<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卦象乾坤</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap');

:root{
  --paper: #F6F0E6;
  --paper-card: #FBF7EF;
  --ink: #3B3128;
  --ink-soft: #6B5E52;
  --line: #E1D3C3;
  --pink: #CDA6A0;
  --pink-deep: #B3837C;
  --pink-pale: #EFDCD7;
  --sage: #8A9A88;
  --sage-deep: #6E7E6C;
  --vermilion: #A5573F;
  --gold: #B08D57;
  --shadow: 0 6px 24px rgba(80,60,45,0.08);
}

*{ box-sizing: border-box; }

html,body{
  margin:0; padding:0;
  background: var(--paper);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(205,166,160,0.10), transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(138,154,136,0.08), transparent 45%);
  color: var(--ink);
  font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
  font-size: 18px;
  line-height: 1.75;
}

.app{ max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }

/* ===== Header ===== */
.app-header{ text-align:center; margin-bottom: 30px; position:relative; }

.share-btn{
  position: absolute; top: 0; right: 0;
  display: flex; align-items: center; gap: 6px;
  font-family: inherit; font-size: 14px; color: var(--pink-deep);
  background: var(--paper-card); border: 1px solid var(--pink); border-radius: 999px;
  padding: 8px 16px; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .15s ease, background .15s ease;
}
.share-btn:hover{ background: var(--pink); color: #fff; transform: translateY(-1px); }
.share-btn svg{ flex-shrink: 0; }

.share-toast{
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: var(--ink); color: #fff; font-size: 14px;
  padding: 10px 20px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  z-index: 999; white-space: nowrap;
}

@media (max-width: 640px){
  .share-btn{ position: static; display: inline-flex; margin: 0 0 14px; }
}

.app-header .eyebrow{
  letter-spacing: 0.5em; font-size: 13px; color: var(--pink-deep);
  margin-bottom: 6px;
}
.app-header h1{
  font-family: "隸書", "LiSu", "STLiti", "华文隶书", "Baoli SC", "報隸", "Noto Serif SC", serif;
  font-size: 52px; font-weight: 400; margin: 0 0 6px;
  color: var(--ink); letter-spacing: 0.2em;
}
.app-header .sub{ color: var(--ink-soft); font-size: 16px; letter-spacing: 0.08em; }
.app-header .divider{
  width: 120px; height: 2px; margin: 18px auto 0;
  background: linear-gradient(90deg, transparent, var(--pink), transparent);
}

/* ===== Cards ===== */
.card{
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: var(--shadow);
  padding: 26px 28px;
  margin-bottom: 22px;
}
.card h2{
  font-size: 20px; margin: 0 0 18px; color: var(--pink-deep);
  display:flex; align-items:center; gap:10px; letter-spacing:0.05em;
}
.card h2::before{
  content:""; width:6px; height:22px; background: var(--pink); border-radius: 3px; display:inline-block;
}

/* ===== Date section ===== */
.date-row{ display:flex; flex-wrap:wrap; gap:16px; align-items:center; }
input[type="date"]{
  font-family: inherit; font-size: 18px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
  color: var(--ink);
}
#lunarInfoBox{ margin-top: 14px; font-size: 17px; color: var(--ink-soft); }
.lunar-line{ margin: 4px 0; }
.xiaoxi-line b{ color: var(--vermilion); }
.mini-btn{
  margin-left: 10px; font-family: inherit; font-size: 14px;
  background: var(--pink-pale); color: var(--pink-deep); border: 1px solid var(--pink);
  border-radius: 20px; padding: 4px 14px; cursor: pointer;
}
.mini-btn:hover{ background: var(--pink); color: #fff; }
.lunar-err{ color: var(--vermilion); }

/* ===== Selects ===== */
.select-row{ display:flex; flex-wrap:wrap; gap: 24px; }
.select-group{ flex:1; min-width: 220px; }
.select-group label{ display:block; font-size:14px; color: var(--ink-soft); margin-bottom:6px; letter-spacing:0.1em;}
select{
  width:100%; font-family: inherit; font-size: 18px; padding: 10px 14px;
  border: 1px solid var(--line); border-radius: 10px; background:#fff; color: var(--ink);
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--pink-deep) 50%), linear-gradient(135deg, var(--pink-deep) 50%, transparent 50%);
  background-position: calc(100% - 20px) center, calc(100% - 15px) center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}


/* ===== Tabs ===== */
.tabs{ display:flex; gap:10px; margin-bottom: 4px; }
.tab-btn{
  font-family: inherit; font-size: 16px; padding: 10px 22px; cursor: pointer;
  border: 1px solid var(--line); background: #fff; border-radius: 999px; color: var(--ink-soft);
  transition: all .2s ease;
}
.tab-btn.active{
  background: var(--pink); color: #fff; border-color: var(--pink);
}

/* ===== Detail panel ===== */
.gua-head{ display:flex; align-items:center; gap: 28px; flex-wrap: wrap; }
.gua-seal{
  width: 58px; height: 58px; background: var(--vermilion); color:#fff;
  display:flex; align-items:center; justify-content:center; border-radius: 8px;
  font-size: 22px; font-weight: 700; flex-shrink:0; box-shadow: 0 2px 8px rgba(165,87,63,0.35);
}
.gua-head-text{ flex:1; min-width:180px; }
#guaTitleId{ font-size:14px; color: var(--ink-soft); letter-spacing:0.15em; }
.gua-name-row{ display:flex; align-items:baseline; gap:10px; margin: 2px 0 6px; flex-wrap:wrap; }
#guaTitleName{ font-size: 36px; font-weight:700; }
.soul-tag{
  display:inline-block; font-size: 13px; font-weight:600; letter-spacing:0.1em;
  padding: 3px 10px; border-radius: 999px; background: var(--sage); color:#fff;
}
#guaUpperLower{ font-size:15px; color: var(--ink-soft); }
#guaMainSvg{ margin-left:auto; }
#guaMainSvg svg .yao-yang{ fill: var(--ink); }
#guaMainSvg svg .yao-yin{ fill: var(--pink-deep); }

.text-section{ margin-top: 24px; }
.text-section .label{
  font-size: 14px; color: var(--pink-deep); letter-spacing: 0.3em; margin-bottom: 6px;
}
.text-section .content{ font-size: 19px; line-height: 1.9; white-space: pre-line; }
.hr-soft{ border:none; border-top: 1px dashed var(--line); margin: 22px 0; }

/* ===== Yao list ===== */
.yao-row{
  display:flex; align-items:flex-start; gap:16px; padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.yao-row:last-child{ border-bottom:none; }
.yao-row-yong{ background: var(--pink-pale); border-radius: 10px; padding: 14px 10px; margin-bottom: 4px; }
.yao-row-yong .yao-row-label{ color: var(--sage-deep); }
.yao-row-mark{ width: 160px; flex-shrink:0; padding-top:6px; }
.mini-yang{ display:block; width:150px; height:6.5px; background: var(--ink); border-radius:3.25px; }
.mini-yin{ display:flex; gap:18px; }
.mini-yin span{ display:block; width:66px; height:6.5px; background: var(--pink-deep); border-radius:3.25px; }
.yao-row-label{
  width: 56px; flex-shrink:0; font-weight:700; color: var(--vermilion); font-size:18px; padding-top:2px;
}
.yao-row-text{ flex:1; }
.yao-ci{ font-size: 18px; }
.yao-xiang{ font-size: 15px; color: var(--ink-soft); margin-top:4px; }

/* ===== Related cards (綜/錯/互) ===== */
.rel-grid-title{ font-size:14px; color: var(--ink-soft); letter-spacing:0.2em; margin: 26px 0 12px; }

/* ===== 焦氏易林 ===== */
.yaolin-title{ font-size: 17px; color: var(--vermilion); font-weight: 700; margin-bottom: 10px; letter-spacing: 0.05em; }
.yaolin-content{ font-size: 18px; line-height: 2; }
.yaolin-missing{ font-size: 15px; color: var(--ink-soft); font-style: normal; }
#relatedCards{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px;
}
.rel-card{
  background:#fff; border:1px solid var(--line); border-radius: 14px; padding: 14px 8px 10px;
  text-align:center; cursor:pointer; transition: transform .15s ease, box-shadow .15s ease;
}
.rel-card:hover{ transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--pink); }
.rel-label{ font-size: 12px; color: var(--pink-deep); margin-bottom:6px; letter-spacing:0.05em; }
.rel-svg{ display:flex; justify-content:center; margin: 6px 0; }
.rel-svg svg .yao-yang{ fill: var(--ink); }
.rel-svg svg .yao-yin{ fill: var(--pink-deep); }
.rel-name{ font-size: 14px; font-weight:600; margin-top:4px; }

footer.note{
  text-align:center; color: var(--ink-soft); font-size: 13px; margin-top: 30px; letter-spacing: 0.05em;
}

@media (max-width: 640px){
  .app{ padding: 20px 14px 60px; }
  .app-header h1{ font-size: 40px; }
  body{ font-size: 16px; }
  .card{ padding: 20px 18px; }
  #guaMainSvg{ margin-left:0; }
  #guaTitleName{ font-size: 30px; }
  .yao-row-mark{ width: 100px; }
  .mini-yang{ width: 90px; }
  .mini-yin{ gap: 10px; }
  .mini-yin span{ width: 40px; }
}

</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <button id="shareBtn" class="share-btn" title="分享給朋友">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      <span>分享</span>
    </button>
    <div class="eyebrow">周 易 六 十 四 卦</div>
    <h1>卦象乾坤</h1>
    <div class="sub">觀象・玩辭・明變</div>
    <div class="divider"></div>

  <section class="card">

      <input type="date" id="dateInput">

        <select id="changeGuaSelect"></select>

    </div>
  </section>

  <section class="card" id="yaolinCard" style="display:none;">
    <h2>焦氏易林</h2>

    <div id="yaolinContent" class="content yaolin-content"></div>
    <div id="yaolinMissing" class="yaolin-missing" style="display:none;">尚未收錄這組主卦變卦的易林內容。</div>
  </section>

  <div class="tabs">
    <button class="tab-btn active" id="tabMain">主卦</button>
    <button class="tab-btn" id="tabChange">變卦</button>
  </div>

  <section class="card" id="detailPanel">
    <div class="gua-head">
      <div class="gua-seal" id="guaTitleId2"></div>
      <div class="gua-head-text">
        <div id="guaTitleId"></div>
        <div class="gua-name-row">
          <span id="guaTitleName"></span>
          <span id="guaSoulTag" class="soul-tag" style="display:none;"></span>
        </div>
        <div id="guaUpperLower"></div>
      </div>
      <div id="guaMainSvg"></div>
    </div>

    <div class="text-section">
      <div class="label">卦　辭</div>
      <div class="content" id="guaci"></div>
    </div>

    <hr class="hr-soft">

    <div class="text-section">
      <div class="label">彖　傳</div>
      <div class="content" id="tuan"></div>
    </div>

    <hr class="hr-soft">

    <div class="text-section">
      <div class="label">象　傳</div>
      <div class="content" id="daxiang"></div>
    </div>

    <hr class="hr-soft" id="xuguaDivider" style="display:none;">

    <div class="text-section" id="xuguaSection" style="display:none;">
      <div class="label">序　卦　傳</div>
      <div class="content" id="xugua"></div>
    </div>

    <hr class="hr-soft" id="zaguaDivider" style="display:none;">

    <div class="text-section" id="zaguaSection" style="display:none;">
      <div class="label">雜　卦　傳</div>
      <div class="content" id="zagua"></div>
    </div>

    <hr class="hr-soft" id="shuoguaDivider" style="display:none;">

    <div class="text-section" id="shuoguaSection" style="display:none;">
      <div class="label">說　卦　傳</div>
      <div class="content" id="shuogua"></div>
    </div>

    <hr class="hr-soft" id="xiciDivider" style="display:none;">

    <div class="text-section" id="xiciSection" style="display:none;">
      <div class="label">繫　辭　傳</div>
      <div class="content" id="xici"></div>
    </div>

    <hr class="hr-soft" id="youhuanDivider" style="display:none;">

    <div class="text-section" id="youhuanSection" style="display:none;">
      <div class="label">繫辭傳之憂患九卦</div>
      <div class="content" id="youhuan"></div>
    </div>

    <hr class="hr-soft">

    <div class="text-section">
      <div class="label">爻　辭　與　小　象</div>
      <div id="yaoList"></div>
    </div>

    <div class="rel-grid-title">綜卦・錯卦・互卦（點擊可切換查看）</div>
    <div id="relatedCards"></div>
  </section>

  <footer class="note">易經原文據通行本整理，僅供學習參考；農曆換算採一般曆法演算法，重大場合請另核對正式萬年曆。</footer>

  <div id="shareToast" class="share-toast" style="display:none;"></div>
</div>

          var solarYmd = this._p.solar.toYmd();

          var jq = this._getJieQiSolar(I18n.getMessage('jq.liChun'));
          var offset = 4 - jq.getLunar().getDayGanIndex();

            offset += 10;

          offset = 4 - jq.getLunar().getDayGanIndex();

      XIU_SONG:{
        '{xx.jiao}': '角星造作主荣昌，外进田财及女郎，嫁娶婚姻出贵子，文人及第见君王，惟有埋葬不可用，三年之后主瘟疫，起工修筑坟基地，堂前立见主人凶。',
        '{xx.kang}': '亢星造作长房当，十日之中主有殃，田地消磨官失职，接运定是虎狼伤，嫁娶婚姻用此日，儿孙新妇守空房，埋葬若还用此日，当时害祸主重伤。',
        '{xx.di}': '氐星造作主灾凶，费尽田园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。',
        '{xx.fang}': '房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。',
        '{xx.xin}': '心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。',
        '{xx.tail}': '尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。',
        '{xx.ji}': '箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。',
        '{xx.dou}': '斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。',
        '{xx.niu}': '牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。',
        '{xx.nv}': '女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。',
        '{xx.xu}': '虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。',
        '{xx.wei}': '危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。',
        '{xx.shi}': '室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。',
        '{xx.qiang}': '壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。',
        '{xx.kui}': '奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。',
        '{xx.lou}': '娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。',
        '{xx.vei}': '胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。',
        '{xx.mao}': '昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。',
        '{xx.bi}': '毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。',
        '{xx.zi}': '觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。',
        '{xx.can}': '参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。',
        '{xx.jing}': '井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。',
        '{xx.gui}': '鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。',
        '{xx.liu}': '柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。',
        '{xx.xing}': '星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。',
        '{xx.zhang}': '张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。',
        '{xx.yi}': '翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。',
        '{xx.zhen}': '轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻龙子入龙宫。'
      },

 tuan:"大哉乾元，萬物資始，乃統天。雲行雨施，品物流形。\n大明始終，六位時成，時乘六龍以御天。\n乾道變化，各正性命，保合大和，乃利貞。首出庶物，萬國咸寧。",
 daxiang:"天行健，君子以自強不息。",
 xici:"天尊地卑，乾坤定矣卑高以陳，貴賤位矣。動靜有常，剛柔斷矣。\n夫乾，其靜也專，其動也直，是以大生焉。\n子曰：乾坤其易之門邪？乾，陽物也。坤，陰物也。陰陽合德而剛柔有體，以體天地之撰，以通神明之德。\n夫乾，天下之至健也，德行恒易以知險。",
 zagua:"乾剛坤柔。",
 yao:[
  {ci:"潛龍，勿用。",xiang:"潛龍勿用，陽在下也。"},
  {ci:"見龍在田，利見大人。",xiang:"見龍在田，德施普也。"},
  {ci:"君子終日乾乾，夕惕若，厲，無咎。",xiang:"終日乾乾，反復道也。"},
  {ci:"或躍在淵，無咎。",xiang:"或躍在淵，進無咎也。"},
  {ci:"飛龍在天，利見大人。",xiang:"飛龍在天，大人造也。"},
  {ci:"亢龍，有悔。",xiang:"亢龍有悔，盈不可久也。"}
 ],
 yong:{label:"用九",ci:"見群龍無首，吉。",xiang:"用九，天德不可為首也。"}},
{id:2,name:"坤為地",upper:"kun",lower:"kun",
 guaci:"坤：元亨，利牝馬之貞。君子有攸往，先迷後得主，利西南得朋，東北喪朋。安貞，吉。",
 tuan:"至哉坤元！萬物資生，乃順承天。\n坤厚載物，德合無疆，含弘光大，品物咸亨。\n牝馬地類，行地無疆，柔順利貞。\n君子攸行，先迷失道，後順得常。\n西南得朋，乃與類行。東北喪朋，乃終有慶。\n安貞之吉，應地無疆。",
 daxiang:"地勢坤，君子以厚德載物。",
 xici:"天尊地卑，乾坤定矣。卑高以陳，貴賤位矣。動靜有常，剛柔斷矣。\n夫坤，其靜也翕，其動也闢，是以廣生焉。\n子曰：乾坤其易之門邪？乾，陽物也。坤，陰物也。陰陽合德而剛柔有體，以體天地之撰，以通神明之德。\n夫坤，天下之至順也，德行恒簡以知阻。\n\n神農氏沒，黃帝、堯、舜氏作，通其變，使民不倦，神而化之，使民宜之。易窮則變，變則通，通則久。是以自天佑之，吉無不利，黃帝、堯、舜垂衣裳而天下治，蓋取諸乾坤。",
 zagua:"乾剛坤柔。",
 yao:[
  {ci:"履霜，堅冰至。",xiang:"履霜堅冰，陰始凝也。馴致其道，至堅冰也。"},
  {ci:"直，方，大，不習無不利。",xiang:"六二之動，直以方也。不習無不利，地道光也。"},
  {ci:"含章可貞。或從王事，無成有終。",xiang:"含章可貞；以時發也。或從王事，知光大也。"},
  {ci:"括囊；無咎，無譽。",xiang:"括囊無咎，慎不害也。"},
  {ci:"黃裳，元吉。",xiang:"黃裳元吉，文在中也。"},
  {ci:"龍戰于野，其血玄黃。",xiang:"龍戰於野，其道窮也。"}
 ],
 yong:{label:"用六",ci:"利永貞。",xiang:"用六永貞，以大終也。"}},
{id:3,name:"水雷屯",upper:"kan",lower:"zhen",
 guaci:"元，亨，利，貞。勿用有攸往，利建侯。",
 tuan:"屯，剛柔始交而難生，動乎險中，大亨貞。\n雷雨之動滿盈，天造草昧，宜建侯而不寧。",
 daxiang:"雲雷屯，君子以經綸。",
 xugua:"有天地，然後萬物生焉。盈天地間者，唯萬物。故受之以屯。\n屯者，盈也。屯者，物之始生也。物生必蒙，故受之以蒙。",
 zagua:"屯見而不失其居。",
 yao:[
  {ci:"磐桓，利居貞，利建侯。",xiang:"雖磐桓，志行正也；以貴下賤，大得民也。"},
  {ci:"屯如邅如，乘馬班如，匪寇婚媾，女子貞不字，十年乃字。",xiang:"六二之難，乘剛也；十年乃字，反常也。"},
  {ci:"即鹿無虞，惟入于林中，君子幾不如舍，往吝。",xiang:"即鹿無虞，以從禽也；君子舍之，往吝窮也。"},
  {ci:"乘馬班如，求婚媾，往吉，無不利。",xiang:"求而往，明也。"},
  {ci:"屯其膏，小貞吉，大貞凶。",xiang:"屯其膏，施未光也。"},
  {ci:"乘馬班如，泣血漣如。",xiang:"泣血漣如，何可長也？"}
 ]},
{id:4,name:"山水蒙",upper:"gen",lower:"kan",
 guaci:"蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。",
 tuan:"蒙，山下有險，險而止，蒙。\n蒙亨，以亨行時中也。匪我求童蒙，童蒙求我，志應也。\n初筮告，以剛中也。再三瀆，瀆則不告，瀆蒙也。\n蒙以養正，聖功也。",
 daxiang:"山下出泉，蒙；君子以果行育德。",
 xugua:"屯者，盈也。屯者，物之始生也。物生必蒙，故受之以蒙。\n蒙者，蒙也，物之稚也。物稚不可不養也，故受之以需。",
 zagua:"蒙雜而著。",
 yao:[
  {ci:"發蒙，利用刑人，用說桎梏，以往吝。",xiang:"利用刑人，以正法也。"},
  {ci:"包蒙吉；納婦吉；子克家。",xiang:"子克家，剛柔接也。"},
  {ci:"勿用取女；見金夫，不有躬，無攸利。",xiang:"勿用取女，行不順也。"},
  {ci:"困蒙，吝。",xiang:"困蒙之吝，獨遠實也。"},
  {ci:"童蒙，吉。",xiang:"童蒙之吉，順以巽也。"},
  {ci:"擊蒙；不利為寇，利禦寇。",xiang:"利用禦寇，上下順也。"}
 ]},
{id:5,name:"水天需",upper:"kan",lower:"qian",soul:"遊魂",
 guaci:"需：有孚，光亨，貞吉。利涉大川。",
 tuan:"需，須也。險在前也。\n剛健而不陷，其義不困窮矣。\n需有孚，光亨，貞吉。位乎天位，以正中也。\n利涉大川，往有功也。",
 daxiang:"雲上於天，需；君子以飲食宴樂。",
 xugua:"蒙者、蒙也，物之稚也，物稚不可不養也，故受之以需。\n需者、飲食之道。飲食必有訟，故受之以訟。",
 zagua:"需，不進也。訟，不親也。",
 yao:[
  {ci:"需于郊。利用恆，無咎。",xiang:"需于郊，不犯難行也。利用恆，無咎；未失常也。"},
  {ci:"需于沙。小有言，終吉。",xiang:"需于沙，衍在中也。雖小有言，以終吉也。"},
  {ci:"需于泥，致寇至。",xiang:"需于泥，災在外也。自我致寇，敬慎不敗也。"},
  {ci:"需于血，出自穴。",xiang:"需于血，順以聽也。"},
  {ci:"需于酒食，貞吉。",xiang:"酒食貞吉，以中正也。"},
  {ci:"入于穴，有不速之客三人來，敬之終吉。",xiang:"不速之客來，敬之終吉。雖不當位，未大失也。"}
 ]},
{id:6,name:"天水訟",upper:"qian",lower:"kan",soul:"遊魂",
 guaci:"訟：有孚，窒惕，中吉，終凶。利見大人，不利涉大川。",
 tuan:"訟，上剛下險，險而健訟。\n訟有孚窒，惕中吉，剛來而得中也。終凶；訟不可成也。\n利見大人；尚中正也。不利涉大川；入于淵也。",
 daxiang:"天與水違行，訟。君子以作事謀始。",
 xugua:"需者，飲食之道也。飲食必有訟，故受之以訟。\n訟必有眾起，故受之以師。",
 zagua:"需，不進也。訟，不親也。",
 yao:[
  {ci:"不永所事，小有言，終吉。",xiang:"不永所事，訟不可長也。雖小有言，其辯明也。"},
  {ci:"不克訟，歸而逋，其邑人三百戶，無眚。",xiang:"不克訟，歸逋竄也。自下訟上，患至掇也。"},
  {ci:"食舊德，貞厲，終吉，或從王事，無成。",xiang:"食舊德，從上吉也。"},
  {ci:"不克訟，復即命渝，安貞吉。",xiang:"復即命，渝安貞；不失也。"},
  {ci:"訟元吉。",xiang:"訟元吉，以中正也。"},
  {ci:"或錫之鞶帶，終朝三褫之。",xiang:"以訟受服，亦不足敬也。"}
 ]},
{id:7,name:"地水師",upper:"kun",lower:"kan",soul:"歸魂",
 guaci:"師：貞，丈人，吉無咎。",
 tuan:"師，眾也。貞，正也。能以眾正，可以王矣。\n剛中而應，行險而順，以此毒天下，而民從之，吉，又何咎矣。",
 daxiang:"地中有水，師；君子以容民畜眾。",
 xugua:"訟必有眾起。故受之以師。\n師者，眾也。眾必以所比，故受之以比。",
 zagua:"比樂師憂。",
 yao:[
  {ci:"師出以律，否臧凶。",xiang:"師出以律，失律凶也。"},
  {ci:"在師中吉，無咎，王三錫命。",xiang:"在師中吉，承天寵也。王三錫命，懷萬邦也。"},
  {ci:"師或輿尸，凶。",xiang:"師或輿尸，大無功也。"},
  {ci:"師左次，無咎。",xiang:"左次無咎，未失常也。"},
  {ci:"田有禽，利執言，無咎。長子帥師，弟子輿尸，貞凶。",xiang:"長子帥師，以中行也。弟子輿尸，使不當也。"},
  {ci:"大君有命，開國承家，小人勿用。",xiang:"大君有命，以正功也。小人勿用，必亂邦也。"}
 ]},
{id:8,name:"水地比",upper:"kan",lower:"kun",soul:"歸魂",
 guaci:"比：吉。原筮，元永貞，無咎。不寧方來，後夫凶。",
 tuan:"比，吉也。比，輔也，下順從也。\n原筮元永貞，無咎，以剛中也。\n不寧方來，上下應也。後夫凶，其道窮也。",
 daxiang:"地上有水，比；先王以建萬國，親諸侯。",
 xugua:"師者，眾也。眾必以所比，故受之以比。\n比者，比也。比必有所畜，故受之以小畜。",
 zagua:"比樂師憂。",
 yao:[
  {ci:"有孚，比之，無咎。有孚盈缶，終來有它吉。",xiang:"比之初六，有他吉也。"},
  {ci:"比之自內，貞吉。",xiang:"比之自內，不自失也。"},
  {ci:"比之匪人。",xiang:"比之匪人，不亦傷乎！"},
  {ci:"外比之，貞吉。",xiang:"外比於賢，以從上也。"},
  {ci:"顯比，王用三驅，失前禽。邑人不誡，吉。",xiang:"顯比之吉，位正中也。舍逆取順，失前禽也。邑人不誡，上使中也。"},
  {ci:"比之無首，凶。",xiang:"比之無首，無所終也。"}
 ]},
{id:9,name:"風天小畜",upper:"xun",lower:"qian",
 guaci:"小畜：亨。密雲不雨，自我西郊。",
 tuan:"小畜，柔得位而上下應之，曰小畜。\n健而巽，剛中而志行，乃亨。\n密雲不雨，尚往也。自我西郊，施未行也。",
 daxiang:"風行天上，小畜；君子以懿文德。",
 xugua:"比者，比也。比必有所畜，故受之以小畜。\n物畜然後有禮，故受之以履。",
 zagua:"小畜，寡也。",
 yao:[
  {ci:"復自道，何其咎，吉。",xiang:"復自道，其義吉也。"},
  {ci:"牽復，吉。",xiang:"牽復在中，亦不自失也。"},
  {ci:"輿說輻，夫妻反目。",xiang:"夫妻反目，不能正室也。"},
  {ci:"有孚，血去惕出，無咎。",xiang:"有孚惕出，上合志也。"},
  {ci:"有孚攣如，富以其鄰。",xiang:"有孚攣如，不獨富也。"},
  {ci:"既雨既處，尚德載，婦貞厲。月幾望，君子征凶。",xiang:"既雨既處，德積載也。君子征凶，有所疑也。"}
 ]},
{id:10,name:"天澤履",upper:"qian",lower:"dui",
 guaci:"履虎尾，不咥人，亨。",
 tuan:"履，柔履剛也。\n說而應乎乾，是以履虎尾，不咥人，亨。\n剛中正，履帝位而不疚，光明也。",
 daxiang:"上天下澤，履；君子以辨上下，定民志。",
 xugua:"物畜然後有禮，故受之以履。\n履而泰然後安，故受之以泰。",
 zagua:"小畜，寡也。履，不處也。",
 youhuan:"履，德之基也。\n履，和而至。\n履以和行。",
 yao:[
  {ci:"素履，往無咎。",xiang:"素履之往，獨行愿也。"},
  {ci:"履道坦坦，幽人貞吉。",xiang:"幽人貞吉，中不自亂也。"},
  {ci:"眇能視，跛能履，履虎尾，咥人，凶。武人為于大君。",xiang:"眇能視，不足以有明也。跛能履，不足以與行也。咥人之凶，位不當也。武人為于大君，志剛也。"},
  {ci:"履虎尾，愬愬終吉。",xiang:"愬愬終吉，志行也。"},
  {ci:"夬履，貞厲。",xiang:"夬履貞厲，位正當也。"},
  {ci:"視履考祥，其旋元吉。",xiang:"元吉在上，大有慶也。"}
 ]},
{id:11,name:"地天泰",upper:"kun",lower:"qian",
 guaci:"泰：小往大來，吉亨。",
 tuan:"泰，小往大來，吉亨。\n則是天地交，而萬物通也；上下交，而其志同也。\n內陽而外陰，內健而外順，內君子而外小人，\n君子道長，小人道消也。",
 daxiang:"天地交泰，后以財成天地之道，輔相天地之宜，以左右民。",
 xugua:"履而泰然後安，故受之以泰。\n泰者，通也。物不可終通，故受之以否。",
 zagua:"否泰，反其類也。",
 yao:[
  {ci:"拔茅茹，以其彙，征吉。",xiang:"拔茅征吉，志在外也。"},
  {ci:"包荒，用馮河，不遐遺，朋亡，得尚于中行。",xiang:"包荒，得尚于中行，以光大也。"},
  {ci:"無平不陂，無往不復。艱貞無咎，勿恤其孚，于食有福。",xiang:"無往不復，天地際也。"},
  {ci:"翩翩不富，以其鄰，不戒以孚。",xiang:"翩翩不富，皆失實也；不戒以孚，中心願也。"},
  {ci:"帝乙歸妹，以祉元吉。",xiang:"以祉元吉，中以行愿也。"},
  {ci:"城復于隍，勿用師。自邑告命，貞吝。",xiang:"城復于隍，其命亂也。"}
 ]},
{id:12,name:"天地否",upper:"qian",lower:"kun",
 guaci:"否之匪人，不利君子貞，大往小來。",
 tuan:"否之匪人，不利君子貞。\n大往小來，則是天地不交，而萬物不通也。上下不交，而天下無邦也。\n內陰而外陽，內柔而外剛，內小人而外君子。小人道長，君子道消也。",
 daxiang:"天地不交，否；君子以儉德辟難，不可榮以祿。",
 xugua:"泰者，通也。物不可終通，故受之以否。\n物不可以終否，故受之以同人。",
 zagua:"否泰，反其類也。",
 xici:"子曰：危者，安其位者也；亡者，保其存者也；亂者，有其治者也。是故，君子安而不忘危，存而不忘亡，治而不忘亂；是以身安而國家可保也。易曰：『其亡其亡，繫于苞桑』。",
 yao:[
  {ci:"拔茅茹，以其彙，貞吉亨。",xiang:"拔茅貞吉，志在君也。"},
  {ci:"包承，小人吉，大人否，亨。",xiang:"大人否亨，不亂群也。"},
  {ci:"包羞。",xiang:"包羞，位不當也。"},
  {ci:"有命，無咎，疇離祉。",xiang:"有命無咎，志行也。"},
  {ci:"休否，大人吉。其亡其亡，繫于苞桑。",xiang:"大人之吉，位正當也。"},
  {ci:"傾否，先否後喜。",xiang:"否終則傾，何可長也。"}
 ]},
{id:13,name:"天火同人",upper:"qian",lower:"li",soul:"歸魂",
 guaci:"同人于野，亨。利涉大川，利君子貞。",
 tuan:"同人，柔得位得中，而應乎乾，曰同人。\n同人于野，亨，利涉大川，乾行也。\n文明以健，中正而應，君子正也。唯君子為能通天下之志。",
 daxiang:"天與火，同人；君子以類族辨物。",
 xugua:"物不可以終否，故受之以同人。\n與人同者。物必歸而成其大。故受之以大有。",
 zagua:"大有，眾也。同人，親也。",
 xici:"同人，先號咷而後笑。\n子曰：君子之道，或出或處，或默或語，二人同心，其利斷金。同心之言，其臭如蘭。",
 yao:[
  {ci:"同人于門，無咎。",xiang:"出門同人，又誰咎也。"},
  {ci:"同人于宗，吝。",xiang:"同人于宗，吝道也。"},
  {ci:"伏戎于莽，升其高陵，三歲不興。",xiang:"伏戎于莽，敵剛也。三歲不興，安行也。"},
  {ci:"乘其墉，弗克攻，吉。",xiang:"乘其墉，義弗克也。其吉，則困而反則也。"},
  {ci:"同人，先號咷而後笑，大師克相遇。",xiang:"同人之先，以中直也。大師相遇，言相克也。"},
  {ci:"同人于郊，無悔。",xiang:"同人于郊，志未得也。"}
 ]},
{id:14,name:"火天大有",upper:"li",lower:"qian",soul:"歸魂",
 guaci:"大有：元亨。",
 tuan:"大有，柔得尊位，大中而上下應之，曰大有。\n其德剛健而文明，應乎天而時行，是以元亨。",
 daxiang:"火在天上，大有；君子以遏惡揚善，順天休命。",
 xugua:"與人同者。物必歸而成其大。故受之以大有。\n有大者不可以盈。故受之以謙。",
 zagua:"大有，眾也。同人，親也。",
 xici:"易曰：自天祐之，吉無不利。\n子曰：祐者，助也。天之所助者，順也；人之所助者，信也。履信思乎順，又以尚賢也。是以自天祐之，吉無不利也。",
 yao:[
  {ci:"無交害，匪咎，艱則無咎。",xiang:"大有初九，無交害也。"},
  {ci:"大車以載，有攸往，無咎。",xiang:"大車以載，積中不敗也。"},
  {ci:"公用亨于天子，小人弗克。",xiang:"公用亨于天子，小人害也。"},
  {ci:"匪其彭，無咎。",xiang:"匪其彭，無咎；明辨晢也。"},
  {ci:"厥孚交如，威如，吉。",xiang:"厥孚交如，信以發志也；威如之吉，易而無備也。"},
  {ci:"自天祐之，吉無不利。",xiang:"大有上吉，自天祐也。"}
 ]},
{id:15,name:"地山謙",upper:"kun",lower:"gen",
 guaci:"謙：亨，君子有終。",
 tuan:"謙。亨。天道下濟而光明。地道卑而上行。\n天道虧盈而益謙。地道變盈而流謙。鬼神害盈而福謙。人道惡盈而好謙。\n謙尊而光。卑而不可踰。君子之終也。",
 daxiang:"地中有山，謙。君子以裒多益寡，稱物平施。",
 xugua:"有大者不可以盈。故受之以謙。\n有大而能謙。必豫。故受之以豫。",
 zagua:"謙輕而豫怠也。",
 xici:"勞謙君子，有終吉。子曰：勞而不伐，有功而不德，厚之至也，語以其功下人者也。德言盛，禮言恭，謙也者，致恭以存其位者也。\n子曰：知幾其神乎？君子上交不諂，下交不瀆，其知幾乎，幾者動之微，吉之先見者也，君子見幾而作，不俟終日。\n易曰：介于石，不終日，貞吉。介如石焉，寧用終日，斷可識矣，君子知微知彰，知柔知剛，萬夫之望。",
 youhuan:"謙，德之柄也。\n謙，尊而光。\n謙，以制禮。",
 yao:[
  {ci:"謙謙君子，用涉大川，吉。",xiang:"謙謙君子，卑以自牧也。"},
  {ci:"鳴謙，貞吉。",xiang:"鳴謙貞吉，中心得也。"},
  {ci:"勞謙，君子有終，吉。",xiang:"勞謙君子，萬民服也。"},
  {ci:"無不利，撝謙。",xiang:"無不利，撝謙，不違則也。"},
  {ci:"不富以其鄰，利用侵伐，無不利。",xiang:"利用侵伐，征不服也。"},
  {ci:"鳴謙，利用行師，征邑國。",xiang:"鳴謙，志未得也。可用行師，征邑國也。"}
 ]},
{id:16,name:"雷地豫",upper:"zhen",lower:"kun",
 guaci:"豫：利建侯，行師。",
 tuan:"豫。剛應而志行。順以動，豫。\n豫順以動，故天地如之，而況建侯行師乎？\n天地以順動，故日月不過，而四時不忒。\n聖人以順動，則刑罰清而民服。豫之時義大矣哉！",
 daxiang:"雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。",
 xugua:"有大而能謙。必豫。故受之以豫。\n豫必有隨。故受之以隨。",
 zagua:"謙輕而豫怠也。",
 xici:"重門擊柝，以待暴客，蓋取諸豫。",
 yao:[
  {ci:"鳴豫，凶。",xiang:"初六鳴豫，志窮凶也。"},
  {ci:"介于石，不終日，貞吉。",xiang:"不終日，貞吉；以中正也。"},
  {ci:"盱豫，悔。遲有悔。",xiang:"盱豫有悔，位不當也。"},
  {ci:"由豫，大有得。勿疑。朋盍簪。",xiang:"由豫，大有得；志大行也。"},
  {ci:"貞疾，恆不死。",xiang:"六五貞疾，乘剛也。恆不死，中未亡也。"},
  {ci:"冥豫，成有渝，無咎。",xiang:"冥豫在上，何可長也。"}
 ]},
{id:17,name:"澤雷隨",upper:"dui",lower:"zhen",soul:"歸魂",
 guaci:"隨：元亨利貞，無咎。",
 tuan:"隨，剛來而下柔，動而說，隨。\n大亨貞，無咎，而天下隨時，隨時之義大矣哉！",
 daxiang:"澤中有雷，隨；君子以嚮晦入宴息。",
 xugua:"豫必有隨，故受之以隨。\n以喜隨人者必有事，故受之以蠱。",
 zagua:"隨，無故也。蠱，則飭也。",
 xici:"服牛乘馬，引重致遠，以利天下，蓋取諸隨。",
 yao:[
  {ci:"官有渝，貞吉。出門交有功。",xiang:"官有渝，從正吉也。出門交有功，不失也。"},
  {ci:"系小子，失丈夫。",xiang:"係小子，弗兼與也。"},
  {ci:"系丈夫，失小子。隨有求得，利居貞。",xiang:"系丈夫，志舍下也。"},
  {ci:"隨有獲，貞凶。有孚在道，以明，何咎。",xiang:"隨有獲，其義凶也。有孚在道，明功也。"},
  {ci:"孚于嘉，吉。",xiang:"孚于嘉，吉；位正中也。"},
  {ci:"拘系之，乃從維之。王用亨于西山。",xiang:"拘系之，上窮也。"}
 ]},
{id:18,name:"山風蠱",upper:"gen",lower:"xun",soul:"歸魂",
 guaci:"蠱：元亨，利涉大川。先甲三日，後甲三日。",
 tuan:"蠱，剛上而柔下，巽而止，蠱。\n蠱，元亨，而天下治也。利涉大川，往有事也。\n先甲三日，後甲三日，終則有始，天行也。",
 daxiang:"山下有風，蠱；君子以振民育德。",
 xugua:"以喜隨人者必有事，故受之以蠱。\n蠱者，事也。有事而後可大，故受之以臨。",
 zagua:"隨，無故也。蠱，則飭也。",
 yao:[
  {ci:"干父之蠱，有子，考無咎，厲終吉。",xiang:"干父之蠱，意承考也。"},
  {ci:"干母之蠱，不可貞。",xiang:"干母之蠱，得中道也。"},
  {ci:"干父之蠱，小有悔，無大咎。",xiang:"干父之蠱，終無咎也。"},
  {ci:"裕父之蠱，往見吝。",xiang:"裕父之蠱，往未得也。"},
  {ci:"干父之蠱，用譽。",xiang:"干父之蠱；承以德也。"},
  {ci:"不事王侯，高尚其事。",xiang:"不事王侯，志可則也。"}
 ]},
{id:19,name:"地澤臨",upper:"kun",lower:"dui",
 guaci:"臨：元亨利貞。至于八月有凶。",
 tuan:"臨，剛浸而長。說而順，剛中而應，大亨以正，天之道也。\n至于八月有凶，消不久也。",
 daxiang:"澤上有地，臨；君子以教思無窮，容保民無疆。",
 xugua:"蠱者，事也。有事而後可大，故受之以臨。\n臨者，大也。物大然後可觀，故受之以觀。",
 zagua:"臨，觀之義，或與或求。",
 yao:[
  {ci:"咸臨，貞吉。",xiang:"咸臨貞吉，志行正也。"},
  {ci:"咸臨，吉無不利。",xiang:"咸臨，吉無不利；未順命也。"},
  {ci:"甘臨，無攸利。既憂之，無咎。",xiang:"甘臨，位不當也。既憂之，咎不長也。"},
  {ci:"至臨，無咎。",xiang:"至臨無咎，位當也。"},
  {ci:"知臨，大君之宜，吉。",xiang:"大君之宜，行中之謂也。"},
  {ci:"敦臨，吉無咎。",xiang:"敦臨之吉，志在內也。"}
 ]},
{id:20,name:"風地觀",upper:"xun",lower:"kun",
 guaci:"觀：盥而不薦，有孚顒若。",
 tuan:"大觀在上，順而巽，中正以觀天下。\n觀，盥而不薦，有孚顒若，下觀而化也。\n觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。",
 daxiang:"風行地上，觀；先王以省方，觀民設教。",
 xugua:"臨者，大也。物大然後可觀也。故受之以觀。\n可觀而後有所合，故受之以噬嗑。",
 zagua:"臨觀之義，或與或求。",
 yao:[
  {ci:"童觀，小人無咎，君子吝。",xiang:"初六童觀，小人道也。"},
  {ci:"闚觀，利女貞。",xiang:"窺觀女貞，亦可醜也。"},
  {ci:"觀我生，進退。",xiang:"觀我生，進退；未失道也。"},
  {ci:"觀國之光，利用賓于王。",xiang:"觀國之光，尚賓也。"},
  {ci:"觀我生，君子無咎。",xiang:"觀我生，觀民也。"},
  {ci:"觀其生，君子無咎。",xiang:"觀其生，志未平也。"}
 ]},
{id:21,name:"火雷噬嗑",upper:"li",lower:"zhen",
 guaci:"噬嗑：亨，利用獄。",
 tuan:"頤中有物，曰噬嗑，噬嗑而亨。\n剛柔分，動而明，雷電合而章。\n柔得中而上行，雖不當位，利用獄也。",
 daxiang:"雷電，噬嗑；先王以明罰敕法。",
 xugua:"可觀而後有所合。故受之以噬嗑。\n嗑者，合也。物不可以苟合而已。故受之以賁。",
 zagua:"噬嗑，食也。",
 xici:"日中為市，致天下之民，聚天下之貨，交易而退，各得其所，蓋取諸噬嗑。\n子曰：小人不恥不仁，不畏不義，不見利不勸，不威不懲。小懲而大誡，此小人之福也。易曰：屨校滅趾，無咎。此之謂也。\n\n善不積，不足以成名；惡不積，不足以滅身。小人以小善為無益而弗為也，以小惡為無傷而弗去也，故惡積而不可掩，罪大而不可解。易曰：何校滅耳，凶。",
 yao:[
  {ci:"屨校滅趾，無咎。",xiang:"屨校滅趾，不行也。"},
  {ci:"噬膚滅鼻，無咎。",xiang:"噬膚滅鼻，乘剛也。"},
  {ci:"噬臘肉，遇毒，小吝，無咎。",xiang:"遇毒，位不當也。"},
  {ci:"噬乾胏，得金矢，利艱貞，吉。",xiang:"利艱貞吉，未光也。"},
  {ci:"噬乾肉，得黃金，貞厲，無咎。",xiang:"貞厲無咎，得當也。"},
  {ci:"何校滅耳，凶。",xiang:"何校滅耳，聰不明也。"}
 ]},
{id:22,name:"山火賁",upper:"gen",lower:"li",
 guaci:"賁：亨。小利有攸往。",
 tuan:"賁，亨；柔來而文剛，故亨。\n分剛上而文柔，故小利有攸往。天文也；文明以止，人文也。\n觀乎天文，以察時變；觀乎人文，以化成天下。",
 daxiang:"山下有火，賁；君子以明庶政，無敢折獄。",
 xugua:"嗑者，合也。物不可以苟合而已。故受之以賁。\n賁者，飾也。致飾然後亨。則盡矣。故受之以剝。",
 zagua:"噬嗑，食也。賁，無色也。",
 yao:[
  {ci:"賁其趾，舍車而徒。",xiang:"舍車而徒，義弗乘也。"},
  {ci:"賁其須。",xiang:"賁其須，與上興也。"},
  {ci:"賁如濡如，永貞吉。",xiang:"永貞之吉，終莫之陵也。"},
  {ci:"賁如皤如，白馬翰如，匪寇婚媾。",xiang:"六四，當位疑也。匪寇婚媾，終無尤也。"},
  {ci:"賁於丘園，束帛戔戔，吝，終吉。",xiang:"六五之吉，有喜也。"},
  {ci:"白賁，無咎。",xiang:"白賁無咎，上得志也。"}
 ]},
{id:23,name:"山地剝",upper:"gen",lower:"kun",
 guaci:"剝：不利有攸往。",
 tuan:"剝，剝也，柔變剛也。不利有攸往，小人長也。\n順而止之，觀象也。君子尚消息盈虛，天行也。",
 daxiang:"山附於地，剝；上以厚下安宅。",
 xugua:"賁者，飾也。致飾然後亨。則盡矣。故受之以剝。\n剝者，剝也。物不可以終盡，剝，窮上反下，故受之以復。",
 zagua:"剝，爛也。復，反也。",
 yao:[
  {ci:"剝牀以足，蔑；貞凶。",xiang:"剝牀以足，以滅下也。"},
  {ci:"剝牀以辨，蔑；貞凶。",xiang:"剝牀以辨，未有與也。"},
  {ci:"剝之，無咎。",xiang:"剝之無咎，失上下也。"},
  {ci:"剝牀以膚，凶。",xiang:"剝牀以膚，切近災也。"},
  {ci:"貫魚，以宮人寵，無不利。",xiang:"以宮人寵，終無尤也。"},
  {ci:"碩果不食，君子得輿，小人剝廬。",xiang:"君子得輿，民所載也；小人剝廬，終不可用也。"}
 ]},
{id:24,name:"地雷復",upper:"kun",lower:"zhen",
 guaci:"復：亨。出入無疾，朋來無咎。反復其道，七日來復，利有攸往。",
 tuan:"復亨，剛反，動而以順行，是以出入無疾，朋來無咎。\n反復其道，七日來復，天行也。利有攸往，剛長也。復其見天地之心乎！",
 daxiang:"雷在地中，復；先王以至日閉關，商旅不行，后不省方。",
 xugua:"剝者，剝也。物不可以終盡，剝，窮上反下，故受之以復。\n復則不妄矣，故受之以無妄。",
 zagua:"復，反也。",
 xici:"子曰：顏氏之子，其殆庶幾乎！有不善，未嘗不知。知之，未嘗復行也。\n易曰：『不遠復，無祇悔，元吉。』",
 youhuan:"復，德之本也。\n復，小而辨於物。\n復以自知。",
 yao:[
  {ci:"不遠復，無祗悔，元吉。",xiang:"不遠之復，以修身也。"},
  {ci:"休復，吉。",xiang:"休復之吉，以下仁也。"},
  {ci:"頻復，厲無咎。",xiang:"頻復之厲，義無咎也。"},
  {ci:"中行獨復。",xiang:"中行獨復，以從道也。"},
  {ci:"敦復，無悔。",xiang:"敦復無悔，中以自考也。"},
  {ci:"迷復，凶，有災眚。用行師，終有大敗，以其國君，凶；至于十年，不克征。",xiang:"迷復之凶，反君道也。"}
 ]},
{id:25,name:"天雷無妄",upper:"qian",lower:"zhen",
 guaci:"無妄：元亨，利貞。其匪正有眚，不利有攸往。",
 tuan:"無妄，剛自外來，而為主於內。動而健，剛中而應，大亨以正，天之命也。\n其匪正有眚，不利有攸往。無妄之往，何之矣？天命不佑，行矣哉？",
 daxiang:"天下雷行，物與無妄；先王以茂對時，育萬物。",
 xugua:"復則不妄矣。故受之以無妄。\n有無妄然後可畜，故受之以大畜。",
 zagua:"無妄，災也。",
 yao:[
  {ci:"無妄，往吉。",xiang:"無妄之往，得志也。"},
  {ci:"不耕穫，不菑畬，則利有攸往。",xiang:"不耕穫，未富也。"},
  {ci:"無妄之災：或繫之牛；行人之得，邑人之災。",xiang:"行人得牛，邑人災也。"},
  {ci:"可貞，無咎。",xiang:"可貞無咎，固有之也。"},
  {ci:"無妄之疾，勿藥有喜。",xiang:"無妄之藥，不可試也。"},
  {ci:"無妄，行有眚，無攸利。",xiang:"無妄之行，窮之災也。"}
 ]},
{id:26,name:"山天大畜",upper:"gen",lower:"qian",
 guaci:"大畜：利貞，不家食吉，利涉大川。",
 tuan:"大畜。剛健篤實輝光。日新其德。剛上而尚賢。能止健。\n大正也。不家食吉。養賢也。利涉大川。應乎天也。",
 daxiang:"天在山中，大畜；君子以多識前言往行，以畜其德。",
 xugua:"有無妄然後可畜。故受之以大畜。\n物畜然後可養。故受之以頤。",
 zagua:"大畜，時也。無妄，災也。",
 yao:[
  {ci:"有厲，利已。",xiang:"有厲利已，不犯災也。"},
  {ci:"輿說輹。",xiang:"輿說輹，中無尤也。"},
  {ci:"良馬逐，利艱貞。曰閑輿衛，利有攸往。",xiang:"利有攸往，上合志也。"},
  {ci:"童牛之牿，元吉。",xiang:"六四元吉，有喜也。"},
  {ci:"豶豕之牙，吉。",xiang:"六五之吉，有慶也。"},
  {ci:"何天之衢，亨。",xiang:"何天之衢，道大行也。"}
 ]},
{id:27,name:"山雷頤",upper:"gen",lower:"zhen",soul:"遊魂",
 guaci:"頤：貞吉。觀頤，自求口實。",
 tuan:"頤貞吉，養正則吉也。\n觀頤，觀其所養也。自求口實，觀其自養也。\n天地養萬物，聖人養賢以及萬民。頤之時大矣哉！",
 daxiang:"山下有雷，頤。君子以慎言語，節飲食。",
 xugua:"物畜然後可養。故受之以頤。\n頤者、養也，不養則不可動，故受之以大過。",
 zagua:"頤，養正也。大過，顛也。",
 yao:[
  {ci:"舍爾靈龜，觀我朵頤，凶。",xiang:"觀我朵頤，亦不足貴也。"},
  {ci:"顛頤，拂經于丘，頤征凶。",xiang:"六二征凶，行失類也。"},
  {ci:"拂頤，貞凶，十年勿用，無攸利。",xiang:"十年勿用，道大悖也。"},
  {ci:"顛頤，吉。虎視眈眈，其欲逐逐，無咎。",xiang:"顛頤之吉，上施光也。"},
  {ci:"拂經，居貞吉，不可涉大川。",xiang:"居貞之吉，順以從上也。"},
  {ci:"由頤，厲吉，利涉大川。",xiang:"由頤厲吉，大有慶也。"}
 ]},
{id:28,name:"澤風大過",upper:"dui",lower:"xun",soul:"遊魂",
 guaci:"大過：棟橈，利有攸往，亨。",
 tuan:"大過。大者過也。棟橈。本末弱也。\n剛過而中。巽而說行。利有攸往。乃亨。大過之時大矣哉！",
 daxiang:"澤滅木，大過；君子以獨立不懼，遯世無悶。",
 xugua:"頤者，養也。不養則不可動，故受之以大過。\n物不可以終過。故受之以坎。",
 zagua:"大過，顛也。",
 xici:"初六，藉用白茅，無咎。子曰：苟錯諸地而可矣，藉之用茅，何咎之有？慎之至也。夫茅之為物薄，而用可重也。慎斯術也以往，其無所失矣。",
 yao:[
  {ci:"藉用白茅，無咎。",xiang:"藉用白茅，柔在下也。"},
  {ci:"枯楊生稊，老夫得其女妻，無不利。",xiang:"老夫女妻，過以相與也。"},
  {ci:"棟橈，凶。",xiang:"棟橈之凶，不可以有輔也。"},
  {ci:"棟隆，吉。有它吝。",xiang:"棟隆之吉，不橈乎下也。"},
  {ci:"枯楊生華，老婦得其士夫，無咎無譽。",xiang:"枯楊生華，何可久也。老婦士夫，亦可醜也。"},
  {ci:"過涉滅頂，凶，無咎。",xiang:"過涉之凶，不可咎也。"}
 ]},
{id:29,name:"坎為水",upper:"kan",lower:"kan",
 guaci:"習坎，有孚，維心亨，行有尚。",
 tuan:"習坎，重險也。水流而不盈，行險而不失其信。\n維心亨，乃以剛中也。行有尚，往有功也。\n天險不可升也，地險山川丘陵也，王公設險以守其國，坎之時用大矣哉！",
 daxiang:"水洊至，習坎；君子以常德行，習教事。",
 xugua:"物不可以終過。故受之以坎。\n陷必有所麗。故受之以離。離者麗也。",
 zagua:"離上坎下也。",
 shuogua:"坎者水也，正北方之卦也，勞卦也，萬物之所歸也，故曰勞乎坎。",
 yao:[
  {ci:"習坎，入于坎窞，凶。",xiang:"習坎入坎，失道凶也。"},
  {ci:"坎有險，求小得。",xiang:"求小得，未出中也。"},
  {ci:"來之坎坎，險且枕，入于坎窞，勿用。",xiang:"來之坎坎，終無功也。"},
  {ci:"樽酒簋貳，用缶，納約自牖，終無咎。",xiang:"樽酒簋貳，剛柔際也。"},
  {ci:"坎不盈，祗既平，無咎。",xiang:"坎不盈，中未大也。"},
  {ci:"係用徽纆，寘于叢棘，三歲不得，凶。",xiang:"上六失道，凶三歲也。"}
 ]},
{id:30,name:"離為火",upper:"li",lower:"li",
 guaci:"離：利貞，亨。畜牝牛，吉。",
 tuan:"離，麗也。日月麗乎天，百穀草木麗乎土，重明以麗乎正，乃化成天下。\n柔麗乎中正，故亨。是以畜牝牛吉也。",
 daxiang:"明兩作，離；大人以繼明照于四方。",
 xugua:"坎者，陷也。陷必有所麗，故受之以離。離者，麗也。",
 zagua:"離上坎下也。",
 yao:[
  {ci:"履錯然，敬之無咎。",xiang:"履錯之敬，以辟咎也。"},
  {ci:"黃離，元吉。",xiang:"黃離元吉，得中道也。"},
  {ci:"日昃之離，不鼓缶而歌，則大耋之嗟，凶。",xiang:"日昃之離，何可久也。"},
  {ci:"突如其來如，焚如，死如，棄如。",xiang:"突如其來如，無所容也。"},
  {ci:"出涕沱若，戚嗟若，吉。",xiang:"六五之吉，離王公也。"},
  {ci:"王用出征，有嘉折首，獲匪其醜，無咎。",xiang:"王用出征，以正邦也。"}
 ]},
{id:31,name:"澤山咸",upper:"dui",lower:"gen",
 guaci:"咸：亨，利貞，取女吉。",
 tuan:"咸，感也。柔上而剛下，二氣感應以相與，\n止而說，男下女，是以亨利貞，取女吉也。\n天地感而萬物化生，聖人感人心而天下和平，觀其所感，而天地萬物之情可見矣！",
 daxiang:"山上有澤，咸；君子以虛受人。",
 xugua:"有天地，然後有萬物。\n有萬物，然後有男女。\n有男女，然後有夫婦。\n有夫婦，然後有父子。\n有父子，然後有君臣。\n有君臣，然後有上下。\n有上下，然後禮義有所錯。\n男女之道，不能無感也，故受之以咸。咸者感也，相感則為夫婦。\n夫婦之道，不可以不久也，故受之以恆，恆者久也。",
 zagua:"咸，速也。",
 yao:[
  {ci:"咸其拇。",xiang:"咸其拇，志在外也。"},
  {ci:"咸其腓，凶，居吉。",xiang:"雖凶居吉，順不害也。"},
  {ci:"咸其股，執其隨，往吝。",xiang:"咸其股，亦不處也。志在隨人，所執下也。"},
  {ci:"貞吉，悔亡，憧憧往來，朋從爾思。",xiang:"貞吉悔亡，未感害也。憧憧往來，未光大也。"},
  {ci:"咸其脢，無悔。",xiang:"咸其脢，志末也。"},
  {ci:"咸其輔頰舌。",xiang:"咸其輔頰舌，滕口說也。"}
 ]},
{id:32,name:"雷風恆",upper:"zhen",lower:"xun",
 guaci:"恆：亨，無咎，利貞，利有攸往。",
 tuan:"恆，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恆。\n恆，亨，無咎，利貞，久於其道也。\n天地之道，恆久而不已也。利有攸往，終則有始也。\n日月得天而能久照，四時變化而能久成，聖人久於其道而天下化成。\n觀其所恆，而天地萬物之情可見矣！",
 daxiang:"雷風，恆；君子以立不易方。",
 xugua:"有天地，然後有萬物。有萬物，然後有男女。有男女，然後有夫婦。\n有夫婦，然後有父子。有父子，然後有君臣。有君臣，然後有上下。\n有上下，然後禮義有所錯。男女之道，不能無感也，故受之以咸。\n咸者感也，相感則為夫婦。夫婦之道，不可以不久也，故受之以恆，恆者久也。",
 zagua:"恆，久也。",
 xici:"易曰：憧憧往來，朋從爾思。\n子曰：天下何思何慮？天下同歸而殊塗，一致而百慮，天下何思何慮？\n日往則月來，月往則日來，日月相推而明生焉。\n寒往則暑來，暑往則寒來，寒暑相推而歲成焉。\n往者屈也，來者信也，屈信相感而利生焉。\n尺蠖之屈，以求信也。龍蛇之蟄，以存身也。\n精義入神，以致用也。利用安身，以崇德也。\n過此以往，未之或知也。窮神知化，德之盛也。",
 youhuan:"恆，德之固也。\n恆，雜而不厭。\n恆以一德。",
 yao:[
  {ci:"浚恆，貞凶，無攸利。",xiang:"浚恆之凶，始求深也。"},
  {ci:"悔亡。",xiang:"九二悔亡，能久中也。"},
  {ci:"不恆其德，或承之羞，貞吝。",xiang:"不恆其德，無所容也。"},
  {ci:"田無禽。",xiang:"久非其位，安得禽也。"},
  {ci:"恆其德，貞，婦人吉，夫子凶。",xiang:"婦人貞吉，從一而終也；夫子制義，從婦凶也。"},
  {ci:"振恆，凶。",xiang:"振恆在上，大無功也。"}
 ]},
{id:33,name:"天山遯",upper:"qian",lower:"gen",
 guaci:"遯：亨，小利貞。",
 tuan:"遯亨，遯而亨也。剛當位而應，與時行也。\n小利貞，浸而長也。遯之時義大矣哉。",
 daxiang:"天下有山，遯；君子以遠小人，不惡而嚴。",
 xugua:"恆者久也。物不可以久居其所。故受之以遯。\n遯者，退也。物不可以終遯，故受之以大壯。",
 zagua:"遯則退也。",
 yao:[
  {ci:"遯尾，厲，勿用有攸往。",xiang:"遯尾之厲，不往何災也。"},
  {ci:"執之用黃牛之革，莫之勝說。",xiang:"執用黃牛，固志也。"},
  {ci:"係遯，有疾厲，畜臣妾吉。",xiang:"係遯之厲，有疾憊也。畜臣妾吉，不可大事也。"},
  {ci:"好遯，君子吉，小人否。",xiang:"君子好遯，小人否也。"},
  {ci:"嘉遯，貞吉。",xiang:"嘉遯貞吉，以正志也。"},
  {ci:"肥遯，無不利。",xiang:"肥遯無不利，無所疑也。"}
 ]},
{id:34,name:"雷天大壯",upper:"zhen",lower:"qian",
 guaci:"大壯：利貞。",
 tuan:"大壯，大者壯也。剛以動，故壯。\n大壯利貞，大者正也。正大而天地之情可見矣。",
 daxiang:"雷在天上，大壯；君子以非禮弗履。",
 xugua:"遯者，退也。物不可以終遯，故受之以大壯。\n物不可以終壯。故受之以晉。晉者進也。",
 zagua:"大壯則止。",
 yao:[
  {ci:"壯于趾，征凶，有孚。",xiang:"壯于趾，其孚窮也。"},
  {ci:"貞吉。",xiang:"九二貞吉，以中也。"},
  {ci:"小人用壯，君子用罔，貞厲，羝羊觸藩，羸其角。",xiang:"小人用壯，君子罔也。"},
  {ci:"貞吉，悔亡，藩決不羸，壯于大輿之輹。",xiang:"藩決不羸，尚往也。"},
  {ci:"喪羊于易，無悔。",xiang:"喪羊于易，位不當也。"},
  {ci:"羝羊觸藩，不能退，不能遂，無攸利，艱則吉。",xiang:"不能退，不能遂，不祥也。艱則吉，咎不長也。"}
 ]},
{id:35,name:"火地晉",upper:"li",lower:"kun",soul:"遊魂",
 guaci:"晉：康侯用錫馬蕃庶，晝日三接。",
 tuan:"晉，進也。明出地上，順而麗乎大明，柔進而上行。\n是以康侯用錫馬蕃庶，晝日三接也。",
 daxiang:"明出地上，晉；君子以自昭明德。",
 xugua:"物不可終壯，故受之以晉。\n晉者、進也，進必有所傷，故受之以明夷。",
 zagua:"晉，晝也。",
 yao:[
  {ci:"晉如，摧如，貞吉。罔孚，裕無咎。",xiang:"晉如，摧如；獨行正也。裕無咎；未受命也。"},
  {ci:"晉如，愁如，貞吉。受茲介福，于其王母。",xiang:"受玆介福，以中正也。"},
  {ci:"眾允，悔亡。",xiang:"眾允之，志上行也。"},
  {ci:"晉如鼫鼠，貞厲。",xiang:"鼫鼠貞厲，位不當也。"},
  {ci:"悔亡，失得勿恤，往吉，無不利。",xiang:"失得勿恤，往有慶也。"},
  {ci:"晉其角，維用伐邑，厲吉無咎，貞吝。",xiang:"維用伐邑，道未光也。"}
 ]},
{id:36,name:"地火明夷",upper:"kun",lower:"li",soul:"遊魂",
 guaci:"明夷：利艱貞。",
 tuan:"明入地中，明夷。內文明而外柔順，以蒙大難，文王以之。\n利艱貞，晦其明也。內難而能正其志，箕子以之。",
 daxiang:"明入地中，明夷；君子以蒞眾，用晦而明。",
 xugua:"進必有所傷，故受以明夷。\n夷者，傷也。傷於外者，必反其家，故受之以家人。",
 zagua:"明夷，誅也。",
 yao:[
  {ci:"明夷于飛，垂其翼；君子于行，三日不食；有攸往，主人有言。",xiang:"君子于行，義不食也。"},
  {ci:"明夷，夷于左股，用拯馬壯，吉。",xiang:"六二之吉，順以則也。"},
  {ci:"明夷于南狩，得其大首，不可疾貞。",xiang:"南狩之志，乃大得也。"},
  {ci:"入于左腹，獲明夷之心，于出門庭。",xiang:"入于左腹，獲心意也。"},
  {ci:"箕子之明夷，利貞。",xiang:"箕子之貞，明不可息也。"},
  {ci:"不明晦；初登于天，後入于地。",xiang:"初登于天，照四國也；後入于地，失則也。"}
 ]},
{id:37,name:"風火家人",upper:"xun",lower:"li",
 guaci:"家人：利女貞。",
 tuan:"家人。女正位乎內。男正位乎外。男女正。天地之大義也。\n家人有嚴君焉。父母之謂也。\n父父。子子。兄兄。弟弟。夫夫。婦婦。而家道正。正家而天下定矣。",
 daxiang:"風自火出，家人；君子以言有物，而行有恆。",
 xugua:"傷於外者。必返其家。故受之以家人。\n家道窮必乖，故受之以睽。\n睽者，乖也。乖必有難，故受之以蹇。",
 zagua:"家人內也。",
 yao:[
  {ci:"閑有家，悔亡。",xiang:"閑有家，志未變也。"},
  {ci:"無攸遂，在中饋，貞吉。",xiang:"六二之吉，順以巽也。"},
  {ci:"家人嗃嗃，悔厲吉；婦子嘻嘻，終吝。",xiang:"家人嗃嗃，未失也；婦子嘻嘻，失家節也。"},
  {ci:"富家，大吉。",xiang:"富家大吉，順在位也。"},
  {ci:"王假有家，勿恤，吉。",xiang:"王假有家，交相愛也。"},
  {ci:"有孚威如，終吉。",xiang:"威如之吉，反身之謂也。"}
 ]},
{id:38,name:"火澤睽",upper:"li",lower:"dui",
 guaci:"睽：小事吉。",
 tuan:"睽，火動而上，澤動而下，二女同居，其志不同行。\n說而麗乎明，柔進而上行，得中而應乎剛，是以小事吉。\n天地睽而其事同也，男女睽而其志通也，萬物睽而其事類也，睽之時用大矣哉。",
 daxiang:"上火下澤，睽；君子以同而異。",
 xugua:"傷於外者。必返其家。故受之以家人。\n家道窮必乖，故受之以睽。\n睽者，乖也。乖必有難，故受之以蹇。",
 zagua:"睽外也。",
 yao:[
  {ci:"悔亡，喪馬勿逐，自復；見惡人無咎。",xiang:"見惡人，以辟咎也。"},
  {ci:"遇主于巷，無咎。",xiang:"遇主于巷，未失道也。"},
  {ci:"見輿曳，其牛掣，其人天且劓，無初有終。",xiang:"見輿曳，位不當也。無初有終，遇剛也。"},
  {ci:"睽孤，遇元夫，交孚，厲無咎。",xiang:"交孚無咎，志行也。"},
  {ci:"悔亡，厥宗噬膚，往何咎。",xiang:"厥宗噬膚，往有慶也。"},
  {ci:"睽孤，見豕負塗，載鬼一車，先張之弧，後說之弧，匪寇婚媾，往遇雨則吉。",xiang:"遇雨之吉，群疑亡也。"}
 ]},
{id:39,name:"水山蹇",upper:"kan",lower:"gen",
 guaci:"蹇：利西南，不利東北；利見大人，貞吉。",
 tuan:"蹇，難也。險在前也，見險而能止，知矣哉！\n蹇利西南，往得中也。不利東北，其道窮也。\n利見大人，往有功也。當位貞吉，以正邦也。蹇之時用大矣哉！",
 daxiang:"山上有水，蹇；君子以反身修德。",
 xugua:"睽者，乖也。乖必有難，故受之以蹇。\n蹇者，難也。物不可以終難，故受之以解。\n解者，緩也。緩必有所失，故受之以損。",
 zagua:"蹇，難也。",
 yao:[
  {ci:"往蹇來譽。",xiang:"往蹇來譽，宜待也。"},
  {ci:"王臣蹇蹇，匪躬之故。",xiang:"王臣蹇蹇，終無尤也。"},
  {ci:"往蹇來反。",xiang:"往蹇來反，內喜之也。"},
  {ci:"往蹇來連。",xiang:"往蹇來連，當位實也。"},
  {ci:"大蹇朋來。",xiang:"大蹇朋來，以中節也。"},
  {ci:"往蹇來碩，吉；利見大人。",xiang:"往蹇來碩，志在內也。利見大人，以從貴也。"}
 ]},
{id:40,name:"雷水解",upper:"zhen",lower:"kan",
 guaci:"解：利西南，無所往，其來復吉。有攸往，夙吉。",
 tuan:"解，險以動，動而免乎險，解。解利西南，往得眾也。\n其來復吉，乃得中也。有攸往夙吉，往有功也。\n天地解而雷雨作，雷雨作而百果草木皆甲坼，解之時大矣哉！",
 daxiang:"雷雨作，解。君子以赦過宥罪。",
 xugua:"睽者，乖也。乖必有難，故受之以蹇。\n蹇者，難也。物不可以終難，故受之以解。\n解者，緩也。緩必有所失，故受之以損。",
 zagua:"解，緩也。",
 xici:"易曰：公用射隼，于高墉之上，獲之無不利。\n子曰：隼者禽也，弓矢者器也，射之者人也。君子藏器於身，待時而動，何不利之有？動而不括，是以出而有獲，語成器而動者也。\n\n子曰：作易者其知盜乎？易曰：負且乘，致寇至。負也者，小人之事也。乘也者，君子之器也。\n小人而乘君子之器，盜思奪之矣！上慢下暴，盜思伐之矣！慢藏誨盜，冶容誨淫，易曰：負且乘，致寇至，盜之招也。",
 yao:[
  {ci:"無咎。",xiang:"剛柔之際，義無咎也。"},
  {ci:"田獲三狐，得黃矢，貞吉。",xiang:"九二貞吉，得中道也。"},
  {ci:"負且乘，致寇至，貞吝。",xiang:"負且乘，亦可醜也；自我致戎，又誰咎也。"},
  {ci:"解而拇，朋至斯孚。",xiang:"解而拇，未當位也。"},
  {ci:"君子維有解，吉，有孚于小人。",xiang:"君子有解，小人退也。"},
  {ci:"公用射隼于高墉之上，獲之，無不利。",xiang:"公用射隼，以解悖也。"}
 ]},
{id:41,name:"山澤損",upper:"gen",lower:"dui",
 guaci:"損：有孚，元吉，無咎，可貞，利有攸往。曷之用，二簋可用享。",
 tuan:"損。損下益上。其道上行。\n損而有孚。元吉。無咎。可貞。利有攸往。\n曷之用？二簋可用享。二簋應有時。\n損剛益柔有時。損益盈虛。與時偕行。",
 daxiang:"山下有澤。損。君子以懲忿窒欲。",
 xugua:"緩必有所失，故受之以損。\n損而不已必益。故受之以益。\n益而不已必決。故受之以夬。",
 zagua:"損益，盛衰之始也。",
 xici:"天地絪縕，萬物化醇，男女構精，萬物化生。\n易曰：『三人行，則損一人；一人行，則得其友。』言致一也。",
 youhuan:"損，德之修也。\n損，先難而後易。\n損以遠害。",
 yao:[
  {ci:"巳事遄往，無咎，酌損之。",xiang:"已事遄往，尚合志也。"},
  {ci:"利貞，征凶，弗損，益之。",xiang:"九二利貞，中以為志也。"},
  {ci:"三人行，則損一人；一人行，則得其友。",xiang:"一人行，三則疑也。"},
  {ci:"損其疾，使遄有喜，無咎。",xiang:"損其疾，亦可喜也。"},
  {ci:"或益之，十朋之龜弗克違，元吉。",xiang:"六五元吉，自上佑也。"},
  {ci:"弗損益之，無咎，貞吉，有攸往，得臣無家。",xiang:"弗損益之，大得志也。"}
 ]},
{id:42,name:"風雷益",upper:"xun",lower:"zhen",
 guaci:"益：利有攸往，利涉大川。",
 tuan:"益，損上益下，民說無疆，自上下下，其道大光。\n利有攸往，中正有慶。利涉大川，木道乃行。\n益動而巽，日進無疆。天施地生，其益無方。凡益之道，與時偕行。",
 daxiang:"風雷，益；君子以見善則遷，有過則改。",
 xugua:"緩必有所失，故受之以損。\n損而不已必益。故受之以益。\n益而不已必決。故受之以夬。",
 zagua:"損益，盛衰之始也。",
 xici:"包犧氏沒，神農氏作。斵木為耜，揉木為耒。耒耨之利，以教天下，蓋取諸益。\n子曰：君子安其身而後動，易其心而後語，定其交而後求，君子脩此三者，故全也。\n危以動，則民不與也，懼以語，則民不應也，無交而求，則民不與也。\n莫之與，則傷之者至矣。易曰：『莫益之，或擊之，立心勿恆，凶。』",
 youhuan:"益，德之裕也。\n益，長裕而不設。\n益以興利。",
 yao:[
  {ci:"利用為大作，元吉，無咎。",xiang:"元吉無咎，下不厚事也。"},
  {ci:"或益之，十朋之龜弗克違，永貞吉。王用享于帝，吉。",xiang:"或益之，自外來也。"},
  {ci:"益之用凶事，無咎。有孚中行，告公用圭。",xiang:"益用凶事，固有之也。"},
  {ci:"中行，告公從。利用為依遷國。",xiang:"告公從，以益志也。"},
  {ci:"有孚惠心，勿問元吉。有孚惠我德。",xiang:"有孚惠心，勿問之矣。惠我德，大得志也。"},
  {ci:"莫益之，或擊之，立心勿恆，凶。",xiang:"莫益之，偏辭也。或擊之，自外來也。"}
 ]},
{id:43,name:"澤天夬",upper:"dui",lower:"qian",
 guaci:"夬：揚于王庭，孚號有厲，告自邑，不利即戎，利有攸往。",
 tuan:"夬，決也，剛決柔也。\n健而說，決而和，揚於王庭，柔乘五剛也。孚號有厲，其危乃光也。\n告自邑。不利即戎，所尚乃窮也。利有攸往，剛長乃終也。",
 daxiang:"澤上于天，夬。君子以施祿及下，居德則忌。",
 xugua:"益而不已必決，故受之以夬。\n夬者，決也，決必有所遇，故受之以姤。",
 zagua:"夬者決也。陽決陰也。姤遇也，柔遇剛也。\n決也，剛決柔也。君子道長，小人道憂也。",
 xici:"上古結繩而治，後世聖人易之以書契，百官以治，萬民以察，蓋取諸夬。",
 yao:[
  {ci:"壯于前趾，往不勝為咎。",xiang:"不勝而往，咎也。"},
  {ci:"惕號，莫夜有戎，勿恤。",xiang:"有戎勿恤，得中道也。"},
  {ci:"壯于頄，有凶。君子夬夬，獨行，遇雨，若濡，有慍，無咎。",xiang:"君子夬夬，終無咎也。"},
  {ci:"臀無膚，其行次且。牽羊悔亡，聞言不信。",xiang:"其行次且，位不當也。聞言不信，聰不明也。"},
  {ci:"莧陸夬夬，中行無咎。",xiang:"中行無咎，中未光也。"},
  {ci:"無號，終有凶。",xiang:"無號之凶，終不可長也。"}
 ]},
{id:44,name:"天風姤",upper:"qian",lower:"xun",
 guaci:"姤：女壯，勿用取女。",
 tuan:"姤，遇也，柔遇剛也。勿用取女，不可與長也。\n天地相遇，品物咸章也。剛遇中正，天下大行也。姤之時義大矣哉！",
 daxiang:"天下有風，姤。后以施命誥四方。",
 xugua:"夬者、決也，決必有所遇，故受之以姤。\n姤者、遇也，物相遇而後聚，故受之以萃。",
 zagua:"夬者決也。陽決陰也。姤遇也，柔遇剛也。\n決也，剛決柔也。君子道長，小人道憂也。",
 yao:[
  {ci:"繫于金柅，貞吉，有攸往，見凶，羸豕孚蹢躅。",xiang:"繫于金柅，柔道牽也。"},
  {ci:"包有魚，無咎，不利賓。",xiang:"包有魚，義不及賓也。"},
  {ci:"臀無膚，其行次且，厲，無大咎。",xiang:"其行次且，行未牽也。"},
  {ci:"包無魚，起凶。",xiang:"無魚之凶，遠民也。"},
  {ci:"以杞包瓜，含章，有隕自天。",xiang:"九五含章，中正也。有隕自天，志不舍命也。"},
  {ci:"姤其角，吝，無咎。",xiang:"姤其角，上窮吝也。"}
 ]},
{id:45,name:"澤地萃",upper:"dui",lower:"kun",
 guaci:"萃：亨。王假有廟，利見大人，亨，利貞。用大牲吉，利有攸往。",
 tuan:"萃，聚也；順以說，剛中而應，故聚也。\n王假有廟，致孝享也。利見大人亨，聚以正也。\n用大牲吉，利有攸往，順天命也。\n觀其所聚，而天地萬物之情可見矣。",
 daxiang:"澤上於地，萃；君子以除戎器，戒不虞。",
 xugua:"姤者，遇也，物相遇而後聚，故受之以萃。\n萃者，聚也，聚而上者謂之升，故受之以升。",
 zagua:"萃聚而升不來也。",
 yao:[
  {ci:"有孚不終，乃亂乃萃；若號，一握為笑，勿恤，往無咎。",xiang:"乃亂乃萃，其志亂也。"},
  {ci:"引吉，無咎，孚乃利用禴。",xiang:"引吉無咎，中未變也。"},
  {ci:"萃如嗟如，無攸利，往無咎，小吝。",xiang:"往無咎，上巽也。"},
  {ci:"大吉，無咎。",xiang:"大吉無咎，位不當也。"},
  {ci:"萃有位，無咎。匪孚，元永貞，悔亡。",xiang:"萃有位，志未光也。"},
  {ci:"齎咨涕洟，無咎。",xiang:"齎咨涕洟，未安上也。"}
 ]},
{id:46,name:"地風升",upper:"kun",lower:"xun",
 guaci:"升：元亨，用見大人，勿恤，南征吉。",
 tuan:"柔以時升，巽而順，剛中而應，是以大亨。\n用見大人，勿恤，有慶也。南征吉，志行也。",
 daxiang:"地中生木，升。君子以順德，積小以高大。",
 xugua:"萃者聚也。聚而上者、謂之升，故受之以升。\n升而不已，必困，故受之以困。",
 zagua:"萃聚而升不來也。",
 yao:[
  {ci:"允升，大吉。",xiang:"允升大吉，上合志也。"},
  {ci:"孚乃利用禴，無咎。",xiang:"九二之孚，有喜也。"},
  {ci:"升虛邑。",xiang:"升虛邑，無所疑也。"},
  {ci:"王用亨于岐山，吉無咎。",xiang:"王用亨于岐山，順事也。"},
  {ci:"貞吉，升階。",xiang:"貞吉升階，大得志也。"},
  {ci:"冥升，利于不息之貞。",xiang:"冥升在上，消不富也。"}
 ]},
{id:47,name:"澤水困",upper:"dui",lower:"kan",
 guaci:"困：亨，貞，大人吉，無咎，有言不信。",
 tuan:"困，剛掩也。\n險以說，困而不失其所，亨。其唯君子乎？\n貞大人吉，以剛中也。有言不信，尚口乃窮也。",
 daxiang:"澤無水，困。君子以致命遂志。",
 xugua:"升而不已必困，故受之以困。\n困乎上者必反下，故受之以井。",
 zagua:"井通而困相遇也。",
 xici:"易曰：「困于石，據于蒺蔾，入于其宮，不見其妻，凶。」\n子曰：「非所困而困焉，名必辱。非所據而據焉，身必危。既辱且危，死期將至，妻其可得見耶？」",
 youhuan:"困，德之辨也。\n困，窮而通。\n困以寡怨。",
 yao:[
  {ci:"臀困于株木，入于幽谷，三歲不覿。",xiang:"入于幽谷，幽不明也。"},
  {ci:"困于酒食，朱紱方來，利用享祀，征凶，無咎。",xiang:"困于酒食，中有慶也。"},
  {ci:"困于石，據于蒺蔾，入于其宮，不見其妻，凶。",xiang:"據于蒺蔾，乘剛也。入于其宮，不見其妻，不祥也。"},
  {ci:"來徐徐，困于金車，吝，有終。",xiang:"來徐徐，志在下也。雖不當位，有與也。"},
  {ci:"劓刖，困于赤紱，乃徐有說，利用祭祀。",xiang:"劓刖，志未得也。乃徐有說，以中直也。利用祭祀，受福也。"},
  {ci:"困于葛藟，于臲卼，曰動悔。有悔，征吉。",xiang:"困于葛藟，未當也。動悔，有悔吉，行也。"}
 ]},
{id:48,name:"水風井",upper:"kan",lower:"xun",
 guaci:"井：改邑不改井，無喪無得，往來井井。汔至，亦未繘井，羸其瓶，凶。",
 tuan:"巽乎水而上水，井。井養而不窮也。改邑不改井，乃以剛中也。\n汔至亦未繘井，未有功也。羸其瓶，是以凶也。",
 daxiang:"木上有水，井。君子以勞民勸相。",
 xugua:"困乎上者必反下，故受之以井。\n井道不可不革，故受之以革。",
 zagua:"井通而困相遇也。",
 youhuan:"井，德之地也。\n井，居其所而遷。\n井以辯義。",
 yao:[
  {ci:"井泥不食，舊井無禽。",xiang:"井泥不食，下也。舊井無禽，時舍也。"},
  {ci:"井谷射鮒，甕敝漏。",xiang:"井谷射鮒，無與也。"},
  {ci:"井渫不食，為我心惻。可用汲，王明，並受其福。",xiang:"井渫不食，行惻也。求王明，受福也。"},
  {ci:"井甃，無咎。",xiang:"井甃無咎，修井也。"},
  {ci:"井洌寒泉，食。",xiang:"寒泉之食，中正也。"},
  {ci:"井收勿幕，有孚元吉。",xiang:"元吉在上，大成也。"}
 ]},
{id:49,name:"澤火革",upper:"dui",lower:"li",
 guaci:"革：巳日乃孚，元亨利貞，悔亡。",
 tuan:"革，水火相息，二女同居，其志不相得，曰革。\n巳日乃孚；革而信也。文明以說，大亨以正，革而當，其悔乃亡。\n天地革而四時成，湯武革命，順乎天而應乎人，革之時大矣哉！",
 daxiang:"澤中有火，革；君子以治歷明時。",
 xugua:"井道不可不革，故受之以革。\n革物者莫若鼎，故受之以鼎。",
 zagua:"革，去故也。鼎，取新也。",
 yao:[
  {ci:"鞏用黃牛之革。",xiang:"鞏用黃牛，不可以有為也。"},
  {ci:"巳日乃革之，征吉，無咎。",xiang:"巳日革之，行有嘉也。"},
  {ci:"征凶，貞厲，革言三就，有孚。",xiang:"革言三就，又何之矣。"},
  {ci:"悔亡，有孚改命，吉。",xiang:"改命之吉，信志也。"},
  {ci:"大人虎變，未占有孚。",xiang:"大人虎變，其文炳也。"},
  {ci:"君子豹變，小人革面，征凶，居貞吉。",xiang:"君子豹變，其文蔚也。小人革面，順以從君也。"}
 ]},
{id:50,name:"火風鼎",upper:"li",lower:"xun",
 guaci:"鼎：元吉，亨。",
 tuan:"鼎，象也。以木巽火，亨飪也。\n聖人亨以享上帝，而大亨以養聖賢。\n巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。",
 daxiang:"木上有火，鼎；君子以正位凝命。",
 xugua:"革物者莫若鼎。故受之以鼎。\n主器者莫若長子，故受之以震。",
 zagua:"革，去故也。鼎，取新也。",
 xici:"子曰：「德薄而位尊，知小而謀大，力小而任重，鮮不及矣。\n易曰：『鼎折足，覆公餗，其形渥，凶。』言不勝其任也。」",
 yao:[
  {ci:"鼎顛趾，利出否，得妾以其子，無咎。",xiang:"鼎顛趾，未悖也。利出否，以從貴也。"},
  {ci:"鼎有實，我仇有疾，不我能即，吉。",xiang:"鼎有實，慎所之也。我仇有疾，終無尤也。"},
  {ci:"鼎耳革，其行塞，雉膏不食，方雨虧悔，終吉。",xiang:"鼎耳革，失其義也。"},
  {ci:"鼎折足，覆公餗，其形渥，凶。",xiang:"覆公餗，信如何也。"},
  {ci:"鼎黃耳金鉉，利貞。",xiang:"鼎黃耳，中以為實也。"},
  {ci:"鼎玉鉉，大吉，無不利。",xiang:"玉鉉在上，剛柔節也。"}
 ]},
{id:51,name:"震為雷",upper:"zhen",lower:"zhen",
 guaci:"震：亨。震來虩虩，笑言啞啞。震驚百里，不喪匕鬯。",
 tuan:"震，亨。震來虩虩，恐致福也。笑言啞啞，後有則也。\n震驚百里，驚遠而懼邇也。不喪匕鬯，出可以守宗廟社稷，以為祭主也。",
 daxiang:"洊雷，震。君子以恐懼修省。",
 xugua:"主器者莫若長子。故受之以震。\n震者、動也，物不可以終動，止之，故受之以艮。",
 zagua:"震，起也。艮，止也。",
 shuogua:"帝出乎震。\n萬物出乎震，震東方也。\n雷以動之。\n動萬物者莫疾乎雷。",
 yao:[
  {ci:"震來虩虩，後笑言啞啞，吉。",xiang:"震來虩虩，恐致福也。笑言啞啞，後有則也。"},
  {ci:"震來厲，億喪貝，躋于九陵，勿逐，七日得。",xiang:"震來厲，乘剛也。"},
  {ci:"震蘇蘇，震行無眚。",xiang:"震蘇蘇，位不當也。"},
  {ci:"震遂泥。",xiang:"震遂泥，未光也。"},
  {ci:"震往來厲，億無喪，有事。",xiang:"震往來厲，危行也。其事在中，大無喪也。"},
  {ci:"震索索，視矍矍，征凶。震不于其躬，于其鄰，無咎。婚媾有言。",xiang:"震索索，中未得也。雖凶無咎，畏鄰戒也。"}
 ]},
{id:52,name:"艮為山",upper:"gen",lower:"gen",
 guaci:"艮其背，不獲其身，行其庭，不見其人，無咎。",
 tuan:"艮，止也。時止則止，時行則行，動靜不失其時，其道光明。\n艮其止，止其所也。上下敵應，不相與也。\n是以不獲其身，行其庭不見其人，無咎也。",
 daxiang:"兼山，艮。君子以思不出其位。",
 xugua:"震者、動也，物不可以終動，止之，故受之以艮。\n艮者、止也，物不可以終止，故受之以漸。",
 zagua:"艮，止也。",
 shuogua:"艮以止之。\n成言乎艮。\n艮、東北之卦也。\n萬物之所成終而所成始也。故曰：成言乎艮。\n終萬物、始萬物者、莫盛乎艮。",
 yao:[
  {ci:"艮其趾，無咎，利永貞。",xiang:"艮其趾，未失正也。"},
  {ci:"艮其腓，不拯其隨，其心不快。",xiang:"不拯其隨，未退聽也。"},
  {ci:"艮其限，列其夤，厲薰心。",xiang:"艮其限，危薰心也。"},
  {ci:"艮其身，無咎。",xiang:"艮其身，止諸躬也。"},
  {ci:"艮其輔，言有序，悔亡。",xiang:"艮其輔，以中正也。"},
  {ci:"敦艮，吉。",xiang:"敦艮之吉，以厚終也。"}
 ]},
{id:53,name:"風山漸",upper:"xun",lower:"gen",soul:"歸魂",
 guaci:"漸：女歸吉，利貞。",
 tuan:"漸之進也，女歸吉也。\n進得位，往有功也。進以正，可以正邦也。\n其位，剛得中也。止而巽，動不窮也。",
 daxiang:"山上有木，漸。君子以居賢德善俗。",
 zagua:"漸，女歸待男行也。\n歸妹、女之終也。",
 xugua:"艮者，止也。物不可以終止，故受之以漸。\n漸者，進也。進必有所歸，故受之以歸妹。",
 yao:[
  {ci:"鴻漸于干，小子厲，有言，無咎。",xiang:"小子之厲，義無咎也。"},
  {ci:"鴻漸于磐，飲食衎衎，吉。",xiang:"飲食衎衎，不素飽也。"},
  {ci:"鴻漸于陸，夫征不復，婦孕不育，凶；利禦寇。",xiang:"夫征不復，離群醜也。婦孕不育，失其道也。利用禦寇，順相保也。"},
  {ci:"鴻漸于木，或得其桷，無咎。",xiang:"或得其桷，順以巽也。"},
  {ci:"鴻漸于陵，婦三歲不孕，終莫之勝，吉。",xiang:"終莫之勝，吉；得所願也。"},
  {ci:"鴻漸于陸，其羽可用為儀，吉。",xiang:"其羽可用為儀，吉；不可亂也。"}
 ]},
{id:54,name:"雷澤歸妹",upper:"zhen",lower:"dui",soul:"歸魂",
 guaci:"歸妹：征凶，無攸利。",
 tuan:"歸妹，天地之大義也。天地不交，而萬物不興。歸妹，人之終始也。\n說以動，所歸妹也。征凶，位不當也。無攸利，柔乘剛也。",
 daxiang:"澤上有雷，歸妹。君子以永終知敝。",
 zagua:"歸妹，女之終也。\n漸，女歸待男行也。",
 xugua:"漸者，進也，進必有所歸，故受之以歸妹。\n得其所歸者必大，故受之以豐。",
 yao:[
  {ci:"歸妹以娣，跛能履，征吉。",xiang:"歸妹以娣，以恆也。跛能履吉，相承也。"},
  {ci:"眇能視，利幽人之貞。",xiang:"利幽人之貞，未變常也。"},
  {ci:"歸妹以須，反歸以娣。",xiang:"歸妹以須，未當也。"},
  {ci:"歸妹愆期，遲歸有時。",xiang:"愆期之志，有待而行也。"},
  {ci:"帝乙歸妹，其君之袂，不如其娣之袂良，月幾望，吉。",xiang:"帝乙歸妹，不如其娣之袂良也。其位在中，以貴行也。"},
  {ci:"女承筐無實，士刲羊無血，無攸利。",xiang:"上六無實，承虛筐也。"}
 ]},
{id:55,name:"雷火豐",upper:"zhen",lower:"li",
 guaci:"豐：亨，王假之，勿憂，宜日中。",
 tuan:"豐，大也。明以動，故豐。\n王假之，尚大也。勿憂宜日中，宜照天下也。\n日中則昃，月盈則食，天地盈虛，與時消息，而況於人乎？況於鬼神乎？",
 daxiang:"雷電皆至，豐；君子以折獄致刑。",
 xugua:"得其所歸者必大。故受之以豐。\n豐者，大也，窮大者必失其居，故受之以旅。",
 zagua:"豐，多故也。親寡，旅也。",
 yao:[
  {ci:"遇其配主，雖旬無咎，往有尚。",xiang:"雖旬無咎，過旬災也。"},
  {ci:"豐其蔀，日中見斗，往得疑疾，有孚發若，吉。",xiang:"有孚發若，信以發志也。"},
  {ci:"豐其沛，日中見沬，折其右肱，無咎。",xiang:"豐其沛，不可大事也。折其右肱，終不可用也。"},
  {ci:"豐其蔀，日中見斗，遇其夷主，吉。",xiang:"豐其蔀，位不當也。日中見斗，幽不明也。遇其夷主，吉；行也。"},
  {ci:"來章，有慶譽，吉。",xiang:"六五之吉，有慶也。"},
  {ci:"豐其屋，蔀其家，闚其戶，闃其無人，三歲不覿，凶。",xiang:"豐其屋，天際翔也。闚其戶，闃其無人，自藏也。"}
 ]},
{id:56,name:"火山旅",upper:"li",lower:"gen",
 guaci:"旅：小亨，旅貞吉。",
 tuan:"旅，小亨，柔得中乎外，而順乎剛，\n止而麗乎明，是以小亨。旅貞吉也。旅之時義大矣哉！",
 daxiang:"山上有火，旅。君子以明慎用刑，而不留獄。",
 xugua:"豐大也，窮大者必失其居，故受之以旅。\n旅而無所容，故受之以巽。",
 zagua:"豐，多故也。親寡，旅也。",
 yao:[
  {ci:"旅瑣瑣，斯其所取災。",xiang:"旅瑣瑣，志窮災也。"},
  {ci:"旅即次，懷其資，得童僕貞。",xiang:"得童僕貞，終無尤也。"},
  {ci:"旅焚其次，喪其童僕，貞厲。",xiang:"旅焚其次，亦以傷矣。以旅與下，其義喪也。"},
  {ci:"旅于處，得其資斧，我心不快。",xiang:"旅于處，未得位也。得其資斧，心未快也。"},
  {ci:"射雉一矢亡，終以譽命。",xiang:"終以譽命，上逮也。"},
  {ci:"鳥焚其巢，旅人先笑後號咷。喪牛于易，凶。",xiang:"以旅在上，其義焚也。喪牛于易，終莫之聞也。"}
 ]},
{id:57,name:"巽為風",upper:"xun",lower:"xun",
 guaci:"巽：小亨，利有攸往，利見大人。",
 tuan:"重巽以申命，剛巽乎中正而志行。\n柔皆順乎剛，是以小亨，利有攸往，利見大人。",
 daxiang:"隨風，巽。君子以申命行事。",
 xugua:"旅而無所容。故受之以巽。\n巽者入也，入而後說之，故受之以兌。",
 zagua:"兌見而巽伏也。",
 youhuan:"巽，德之制也。\n巽，稱而隱。\n巽以行權。",
 yao:[
  {ci:"進退，利武人之貞。",xiang:"進退，志疑也。利武人之貞，志治也。"},
  {ci:"巽在牀下，用史巫紛若，吉，無咎。",xiang:"紛若之吉，得中也。"},
  {ci:"頻巽，吝。",xiang:"頻巽之吝，志窮也。"},
  {ci:"悔亡，田獲三品。",xiang:"田獲三品，有功也。"},
  {ci:"貞吉，悔亡，無不利，無初有終。先庚三日，後庚三日，吉。",xiang:"九五之吉，位正中也。"},
  {ci:"巽在牀下，喪其資斧，貞凶。",xiang:"巽在牀下，上窮也。喪其資斧，正乎凶也。"}
 ]},
{id:58,name:"兌為澤",upper:"dui",lower:"dui",
 guaci:"兌：亨，利貞。",
 tuan:"兌，說也。剛中而柔外，說以利貞，是以順乎天，而應乎人。\n說以先民，民忘其勞：說以犯難，民忘其死：說之大，民勸矣哉！",
 daxiang:"麗澤，兌。君子以朋友講習。",
 xugua:"巽者，入也，入而後說之，故受之以兌。\n兌者，說也。說而後散之，故受之以渙。",
 zagua:"兌見而巽伏也。",
 yao:[
  {ci:"和兌，吉。",xiang:"和兌之吉，行未疑也。"},
  {ci:"孚兌，吉，悔亡。",xiang:"孚兌之吉，信志也。"},
  {ci:"來兌，凶。",xiang:"來兌之凶，位不當也。"},
  {ci:"商兌未寧，介疾有喜。",xiang:"九四之喜，有慶也。"},
  {ci:"孚于剝，有厲。",xiang:"孚于剝，位正當也。"},
  {ci:"引兌。",xiang:"上六引兌，未光也。"}
 ]},
{id:59,name:"風水渙",upper:"xun",lower:"kan",
 guaci:"渙：亨。王假有廟，利涉大川，利貞。",
 tuan:"渙。亨。剛來而不窮。柔得位乎外而上同。\n王假有廟。王乃在中也。利涉大川。乘木有功也。",
 daxiang:"風行水上。渙。先王以享于帝立廟。",
 xugua:"兌者，說也，說而後散之，故受之以渙。\n渙者，離也，物不可以終離，故受之以節。",
 zagua:"渙，離也。節，止也。",
 xici:"刳木為舟，剡木為楫，舟楫之利，以濟不通，致遠以利天下，蓋取諸渙。",
 yao:[
  {ci:"用拯馬壯，吉。",xiang:"初六之吉，順也。"},
  {ci:"渙奔其機，悔亡。",xiang:"渙奔其機，得願也。"},
  {ci:"渙其躬，無悔。",xiang:"渙其躬，志在外也。"},
  {ci:"渙其群，元吉。渙有丘，匪夷所思。",xiang:"渙其群，元吉，光大也。"},
  {ci:"渙汗其大號，渙王居，無咎。",xiang:"王居無咎，正位也。"},
  {ci:"渙其血，去逖出，無咎。",xiang:"渙其血，遠害也。"}
 ]},
{id:60,name:"水澤節",upper:"kan",lower:"dui",
 guaci:"節：亨。苦節，不可貞。",
 tuan:"節，亨。剛柔分，而剛得中也。苦節不可貞。其道窮也。\n說以行險。當位以節。中正以通。\n天地節而四時成。節以制度。不傷財。不害民。",
 daxiang:"澤上有水。節。君子以制數度。議德行。",
 xugua:"渙者、離也，物不可以終離，故受之以節。\n節而信之，故受之以中孚。",
 zagua:"渙，離也；節，止也。",
 xici:"不出戶庭，無咎。子曰：亂之所生也，則言語以為階。\n君不密，則失臣；臣不密，則失身；幾事不密，則害成。\n是以君子慎密而不出也。",
 yao:[
  {ci:"不出戶庭，無咎。",xiang:"不出戶庭，知通塞也。"},
  {ci:"不出門庭，凶。",xiang:"不出門庭，失時極也。"},
  {ci:"不節若，則嗟若，無咎。",xiang:"不節之嗟，又誰咎也。"},
  {ci:"安節，亨。",xiang:"安節之亨，承上道也。"},
  {ci:"甘節，吉；往有尚。",xiang:"甘節之吉，居位中也。"},
  {ci:"苦節，貞凶，悔亡。",xiang:"苦節貞凶，其道窮也。"}
 ]},
{id:61,name:"風澤中孚",upper:"xun",lower:"dui",soul:"遊魂",
 guaci:"中孚：豚魚吉，利涉大川，利貞。",
 tuan:"中孚，柔在內而剛得中。說而巽，孚乃化邦也。\n豚魚吉，信及豚魚也。利涉大川，乘木舟虛也。\n中孚以利貞，乃應乎天也。",
 daxiang:"澤上有風，中孚。君子以議獄緩死。",
 xugua:"節而信之，故受之以中孚。",
 zagua:"小過，過也；中孚，信也。",
 xici:"鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。\n子曰：君子居其室，出其言，善則千里之外應之，況其邇者乎，\n居其室，出其言不善，則千里之外違之，況其邇者乎，\n言出乎身，加乎民，行發乎邇，見乎遠。\n言行君子之樞機，樞機之發，榮辱之主也。\n言行，君子之所以動天地也，可不慎乎。",
 yao:[
  {ci:"虞吉，有它不燕。",xiang:"初九虞吉，志未變也。"},
  {ci:"鳴鶴在陰，其子和之，我有好爵，吾與爾靡之。",xiang:"其子和之，中心願也。"},
  {ci:"得敵，或鼓或罷，或泣或歌。",xiang:"或鼓或罷，位不當也。"},
  {ci:"月幾望，馬匹亡，無咎。",xiang:"馬匹亡，絕類上也。"},
  {ci:"有孚攣如，無咎。",xiang:"有孚攣如，位正當也。"},
  {ci:"翰音登于天，貞凶。",xiang:"翰音登于天，何可長也。"}
 ]},
{id:62,name:"雷山小過",upper:"zhen",lower:"gen",soul:"遊魂",
 guaci:"小過：亨，利貞。可小事，不可大事。飛鳥遺之音，不宜上，宜下，大吉。",
 tuan:"小過，小者過而亨也。過以利貞，與時行也。\n柔得中，是以小事吉也。剛失位而不中，是以不可大事也。\n有飛鳥之象焉，飛鳥遺之音，不宜上宜下，大吉，上逆而下順也。",
 daxiang:"山上有雷，小過。君子以行過乎恭，喪過乎哀，用過乎儉。",
 xugua:"有信者必行之。故受之以小過。\n有過物者，必濟，故受之既濟。",
 zagua:"小過，過也；中孚，信也。",
 xici:"斷木為杵，掘地為臼，臼杵之利，萬民以濟，蓋取諸小過。",
 yao:[
  {ci:"飛鳥以凶。",xiang:"飛鳥以凶，不可如何也。"},
  {ci:"過其祖，遇其妣；不及其君，遇其臣；無咎。",xiang:"不及其君，臣不可過也。"},
  {ci:"弗過防之，從或戕之，凶。",xiang:"從或戕之，凶如何也。"},
  {ci:"無咎，弗過遇之，往厲必戒，勿用永貞。",xiang:"弗過遇之，位不當也。往厲必戒，終不可長也。"},
  {ci:"密雲不雨，自我西郊，公弋取彼在穴。",xiang:"密雲不雨，已上也。"},
  {ci:"弗遇過之，飛鳥離之，凶，是謂災眚。",xiang:"弗遇過之，已亢也。"}
 ]},
{id:63,name:"水火既濟",upper:"kan",lower:"li",
 guaci:"既濟：亨小，利貞，初吉終亂。",
 tuan:"既濟亨。小者亨也。利貞。剛柔正而位當也。\n初吉。柔得中也。終止則亂。其道窮也。",
 daxiang:"水在火上。既濟。君子以思患而豫防之。",
 xugua:"有過物者必濟。故受之以既濟。\n物不可窮也，故受之以未濟終焉。",
 zagua:"既濟、定也。未濟，男之窮也。",
 yao:[
  {ci:"曳其輪，濡其尾，無咎。",xiang:"曳其輪，義無咎也。"},
  {ci:"婦喪其茀，勿逐，七日得。",xiang:"七日得，以中道也。"},
  {ci:"高宗伐鬼方，三年克之，小人勿用。",xiang:"三年克之，憊也。"},
  {ci:"繻有衣袽，終日戒。",xiang:"終日戒，有所疑也。"},
  {ci:"東鄰殺牛，不如西鄰之禴祭，實受其福。",xiang:"東鄰殺牛，不如西鄰之時也；實受其福，吉大來也。"},
  {ci:"濡其首，厲。",xiang:"濡其首厲，何可久也。"}
 ]},
{id:64,name:"火水未濟",upper:"li",lower:"kan",
 guaci:"未濟：亨。小狐汔濟，濡其尾，無攸利。",
 tuan:"未濟，亨。柔得中也。小狐汔濟。未出中也。\n濡其尾無攸利。不續終也。雖不當位。剛柔應也。",
 daxiang:"火在水上。未濟。君子以慎辨物居方。",
 xugua:"物不可窮也，故受之以未濟終焉。",
 zagua:"既濟、定也。未濟，男之窮也。",
 yao:[
  {ci:"濡其尾，吝。",xiang:"濡其尾，亦不知極也。"},
  {ci:"曳其輪，貞吉。",xiang:"九二貞吉，中以行正也。"},
  {ci:"未濟，征凶，利涉大川。",xiang:"未濟征凶，位不當也。"},
  {ci:"貞吉，悔亡，震用伐鬼方，三年有賞于大國。",xiang:"貞吉悔亡，志行也。"},
  {ci:"貞吉，無悔。君子之光，有孚，吉。",xiang:"君子之光，其暉吉也。"},
  {ci:"有孚于飲酒，無咎。濡其首，有孚失是。",xiang:"飲酒濡首，亦不知節也。"}
 ]}
];

 "1-45":"任劣力薄，駑孱恐怯，如蝟見鵲，不敢拒格。",
 "1-46":"衛侯東遊，惑於少姬；亡我考妣，久迷不來。",
 "1-47":"噂噂所言，莫知我垣；歡喜堅固，可以長安。",
 "1-48":"鸑鳴岐山，龜應幽淵；男女媾精，萬物化生；文王以成，為周開庭。",
 "1-49":"玄黃虺隤，行者勞疲；役夫憔悴，踰時不歸。",
 "1-50":"弱足刖跟，不利出門；市賈無利，折亡為患。",
 "1-51":"懸貆素餐，居非其官；失輿剝廬，休坐徒居。",
 "1-52":"民怯城惡，姦人所伏；寇賊大至，入我郛郭，妻子俘獲。",
 "1-53":"陽低頭，陰仰首；水為災，傷我足；進不利，難生子。",
 "1-54":"背北相憎，心意不同，如火與金。",
 "1-55":"太微帝室，黃帝所宜；蕃屏周衛，不可得入，常安無患。",
 "1-56":"繭栗犧牲，敬享鬼神；神嗜飲食，受福多孫。",
 "1-57":"出門逢惡，與禍為怨；更相擊刺，傷我手端。",
 "1-58":"鷁飛中退，舉事不遂，眾人亂潰。",
 "1-59":"跛踦相隨，日暮牛罷；陵遲後旅，失利亡雌。",
 "1-60":"龍角博顙，位至公卿；世祿久長，起動安寧。",
 "1-61":"舜升大禹，石夷之野；徵詣王庭，拜治水土。",
 "1-62":"從風放火，荻芝俱死；三害集房，叔子中傷。",
 "1-63":"楩生荊山，命制輸班；袍衣剝脫，夏熱冬寒；飢餓枯槁，莫人震憐。",
 "1-64":"長面大鼻，來解己憂；遺吾福子，與我惠妻，惠吾嘉喜。",
 "2-1":"谷風布氣，萬物出生；萌庶長養，華葉茂成。",
 "2-2":"不風不雨，白日皎皎；宜出驅馳，通利大道。",
 "2-3":"蒼龍單獨，與石相觸；摧折兩角，家室不足。",
 "2-4":"城上有烏，自名破家；招呼酖毒，為國患災。",
 "2-5":"霜降閉戶，蟄虫隱處；不見日月，與死為伍。",
 "2-6":"天之德室，溫仁受福；衣裳所在，凶惡不起。",
 "2-7":"皇階九重，絕不可登；未見王公，謂天蓋高。",
 "2-8":"孔德如玉，出於幽谷；升高鼓翼，輝光照國。",
 "2-9":"五軛四軌，復得饒有；陳力就列，騶虞悅喜。",
 "2-10":"四足無角，君子所服；南征述職，以惠我國。",
 "2-11":"雷行相逐，無有攸息；戰于平陸，為夷所覆。",
 "2-12":"六龍爭極，服在下飾；謹慎管籥，結禁毋出。",
 "2-13":"長男少女，相向共語，福祿歡喜。",
 "2-14":"奸延惡人，使德不通；炎火為殃，年穀大傷。",
 "2-15":"脩其翰翼，隨風向北；至虞夏國，與舜相得；年歲大樂，邑無盜賊。",
 "2-16":"鉛刀攻玉，堅不可得；盡我筋力，眡蠒為疾。",
 "2-17":"舉被覆目，不見日月；衣衾簠簋，就長夜室。",
 "2-18":"賊仁傷德，天怒不福；斬刈宗社，失其邦域。",
 "2-19":"白龍赤虎，戰鬭俱怒；蚩尤敗走，死於魚口。",
 "2-20":"北辰紫宮，衣冠立中；含和建德，常受天福。",
 "2-21":"稷為堯使，西見王母；拜請百福，賜我善子。",
 "2-22":"三人異趨，反覆迷惑；一身五心，亂無所得。",
 "2-23":"南山大玃，盜我媚妾；怯不敢逐，退然獨宿。",
 "2-24":"眾鬼所趨，反作大怪；九身無頭，魂驚魄去，不可以居。",
 "2-25":"延頸遠望，眯為目疾；不見叔姬，使伯心憂。",
 "2-26":"典策法書，藏在蘭臺；雖遭亂潰，獨不遇災。",
 "2-27":"自衛反魯，時不我與；冰炭異室，仁道隔塞。",
 "2-28":"瘤癭禿疥，為身瘡害；病疾癃殘，常不遠逮。",
 "2-29":"齊東郭盧，嫁我洛都；俊良美好，媒利過倍。",
 "2-30":"齊魯爭言，戰於龍門；搆怨連禍，三世不安。",
 "2-31":"芳澤肥壤，農人豐廠；利居長安，歷世無患。",
 "2-32":"倉盈庾意，宜種黍稷；年豐歲熟，民得安息。",
 "2-33":"鴟鴞破斧，邦人危殆；賴其忠德，轉禍為福，負危復立。",
 "2-34":"歲飢無年，虐政害民；乾溪驪山，秦楚結冤。",
 "2-35":"列挈累累，締結難解；嫫母衒嫁，媒不得坐，自為身禍。",
 "2-36":"陬觜開門，鶴鳴彈冠；章甫進用，舞韶和鸞；三人翼事，國無災患。",
 "2-37":"弟妹合居，與類相扶；願慕群醜，不離其處。",
 "2-38":"邯鄲反言，兄弟生患；涉叔憂恨，卒死不還。",
 "2-39":"三人逐兔，各爭有得；愛亡善走，多獲鹿子。",
 "2-40":"北辰紫宮，衣冠立中；含和建德，常受天福。",
 "2-41":"拜跪請免，不得其哺；俛首銜枚，低頭北去。",
 "2-42":"鶴盜我珠，逃於東隅；求之郭墟，不見所居。",
 "2-43":"一簧兩舌，妄言謬語；三姦成虎，曾母投杼。",
 "2-44":"孤獨特處，莫與為旅；身日勞苦，使布五穀，陰陽順序。",
 "2-45":"蹇衣涉河，澗流浚多；賴遇舟子，濟脫無他。",
 "2-46":"憑河登山，道路阻難，求事少便。",
 "2-47":"兔罝之容，不失其恭；和謙致樂，君子攸同。",
 "2-48":"三女求夫，伺候山隅；不見復關，泣涕漣如。",
 "2-49":"螟蟲為賊，害我黍穀；中霤空虛，家無所食。",
 "2-50":"望尚阿衡，太宰周公；藩屏輔弼，福祿來同。",
 "2-51":"三年生狗，以戌為母；荊夷上侵，姬伯出走。",
 "2-52":"塗遏道塞，求事不得。",
 "2-53":"探懷得蚤，無有凶憂；所願失道，善居漸好。",
 "2-54":"飛樓屬道，趾多攪垣；居之不安，覆壓為患。",
 "2-55":"義不勝情，以欲自傾；幾利危寵，折角摧頸。",
 "2-56":"潼滃蔚薈，林木來會；津液下降，流潦霈霈。",
 "2-57":"白駒生芻，猗猗盛姝；赫咺君子，樂以忘憂。",
 "2-58":"車馳人趨，卷甲相仇；齊魯寇戰，敗於犬丘。",
 "2-59":"舉首望城，不見子貞，使我悔生。",
 "2-60":"龍鬭時門，失理傷賢；內畔外賊，則生禍難。",
 "2-61":"安如太山，福喜屢臻；雖有豺虎，不致危身。",
 "2-62":"初憂後喜，與福為市；八佾列陳，飲御嘉友。",
 "2-63":"持刀操肉，對酒不食；夫行從軍，小子入獄，抱膝獨宿。",
 "2-64":"陰衰老極，陽建其德；履離戴光，天下昭明；功業不長，蝦蟆代王。",
 "3-1":"汎汎柏舟，流行不休；耿耿寤寐，心裏大憂；仁不逢時，復隱窮居。",
 "3-2":"採薪得麟，大命隕顛；豪雄爭名，天下四分。",
 "3-3":"兵征大宛，北出玉門；與胡寇戰，平城道西；七日絕糧，身幾不全。",
 "3-4":"山崩谷絕，天福盡竭；涇渭失紀，玉厤既已。",
 "3-5":"夏臺羑里，湯文所厄；鬼侯輸賄，商王解舍。",
 "3-6":"泥滓汙辱，棄捐溝瀆；為眾笑哭，然不顯錄。",
 "3-7":"李梅冬實，國多盜賊；擾亂並作，君不能息。",
 "3-8":"獐鹿逐牧，飽歸其居；反還次舍，無有疾故。",
 "3-9":"夾河為婚，期至無船；搖心失望，不見所歡。",
 "3-10":"百足俱行，相輔為強；三聖翼事，王室寵光。",
 "3-11":"坐位失處，不能自居；賊破王邑，陰陽顛倒。",
 "3-12":"登几上轝，駕駟南遊；合從散衡，燕齊以強。",
 "3-13":"三孫荷弩，無益於輔；城弱不守，邦君受討。",
 "3-14":"河伯大呼，津不可渡；船空無人，往來亦難。",
 "3-15":"甘露醴泉，太平機關；仁德感應，歲樂民安。",
 "3-16":"重茵厚席，循臯采藿；雖躓不懼，反復其宅。",
 "3-17":"大乙駕騮，從天上來；徵我叔季，封為魯侯。",
 "3-18":"南巴六安，石斛戟天；所指不已，耋老復丁；弊至舊墟，更為新家。",
 "3-19":"家給人足，頌聲並作；四夷賓伏，干戈韜閣。",
 "3-20":"東鄰嫁女，為王妃后；莊公築館，以尊王母；歸于京師，季姜說喜。",
 "3-21":"陳妻敬仲，兆興齊姜；營丘是適，八世大昌。",
 "3-22":"路多枳棘，步刺我足；不利旅客，為心作毒。",
 "3-23":"天官列宿，五神共舍；宮闕光堅，君安其居。",
 "3-24":"牧羊稻園，聞虎呻喧；懼畏惕息，終無禍患。",
 "3-25":"鳴條之圖，北奔犬胡；左衽為長，國號匈奴；主君旄頭，立尊單于。",
 "3-26":"剋身潔己，逢禹巡守；錫我玄珪，拜受福佑。",
 "3-27":"冬華不食，國多盜賊；疾病難醫，鬼哭其室。",
 "3-28":"襄送季女，至于蕩道；齊子旦夕，留連久處。",
 "3-29":"朽根倒樹，花葉落去；卒逢火焱，隨風偃仆。",
 "3-30":"陰變為陽，女化作男；治道得通，君臣相承。",
 "3-31":"炎絕續光，火滅復明；簡易理得，以成乾功。",
 "3-32":"多載重負，捐棄于野；予母誰子，但自勞苦。",
 "3-33":"江河海澤，眾利室宅；可以富有，飲御嘉客。",
 "3-34":"冬採薇蘭，地凍堅拆；利走室北，暮無所得。",
 "3-35":"烏鳴嘻嘻，天火將起；燔我館屋，災及姬后。",
 "3-36":"蠆室蜂戶，螫我手足；不可進取，為身害速。",
 "3-37":"崔嵬北岳，天神貴客；溫仁正直，主布恩德；閔示不已，蒙受大祿。",
 "3-38":"伯蹇叔盲，莫為守床；失我衣裘，伐民除鄉。",
 "3-39":"為季求婦，家在東海；水長無船，不見所歡。",
 "3-40":"山陵岳墓，魂魄室舍；精誠盡竭，長寢不覺。",
 "3-41":"騎牛折角，下山傷軸；失其利祿。",
 "3-42":"水戴舟船，無根以浮；往來濟濟，心勞且憂。",
 "3-43":"有鳥來飛，集於宮樹；鳴聲可惡，主將出去。",
 "3-44":"東徙不時，觸患離憂；井泥無濡，思叔舊居。",
 "3-45":"黃帝所生，宓羲之宇；兵刃不至，利以居止。",
 "3-46":"東山救亂，處婦思夫；勞我君子，役無休已。",
 "3-47":"跛躓未起，先利後市，不得鹿子。",
 "3-48":"大蛇當路，使季畏懼；湯火之災，切近我膚；賴其天幸，趨于王廬。",
 "3-49":"從容長閑，遊戲南山；拜祠禱神，使神無患。",
 "3-50":"區脫康居，慕義入朝；湛露之歡，三爵畢恩；復歸野廬，與母相扶。",
 "3-51":"魚鱉列市，河海饒有；長錢善價，商李悅善。",
 "3-52":"年常蒙慶，今歲受福；三夫採葩，出必有得。",
 "3-53":"二人俱東，道怒爭訟；意乖不同，使君忷忷。",
 "3-54":"樹我藿豆，鹿兔為食；君不恤護，秋無收入。",
 "3-55":"黃鳥悲鳴，愁不見星；困於鷙鳥，鸇使我驚。",
 "3-56":"雙鳧懼飛，欲歸稻食；經涉萑澤，為矢所射；傷我胸臆。",
 "3-57":"久客無依，思歸我鄉；雷雨盛溢，道未得通。",
 "3-58":"道路辟除，南至東遼；衛子善辭，使國無憂。",
 "3-59":"同枕同袍，中年相知；少賈無失，獨居愁思。",
 "3-60":"眾神集聚，相與議語；南國虐亂，百姓愁苦；興師征討，更立賢王。",
 "3-61":"北陸閉蟄，隱伏不出；目盲耳聾，道路不通。",
 "3-62":"癡狂妄作，心狂善惑；迷行失路，不知南北。",
 "3-63":"棟隆強輔，寵貴日光；福善並作，樂以高明。",
 "3-64":"愛我嬰女，牽衣不與；冀幸高貴，反日賤下。",
 "4-1":"海為水王，聰聖且明；百流歸德，無有叛逆，常饒優足。",
 "4-2":"左輔右弼，金玉滿堂；常盈不亡，富如敖倉。",
 "4-3":"安息康居，異國穹廬；非吾習俗，使我心憂。",
 "4-4":"何耳草黃，至未盡玄；室家分離，悲憂於心。",
 "4-5":"范公鴟夷，善賈飾資；東之營丘，易字子皮；把珠載金，多得利歸。",
 "4-6":"老楊日衰，條多枯枝；爵級不進，遂下摧隤。",
 "4-7":"小狐渡水，污濡其尾；利得無幾，與道合契。",
 "4-8":"豕生魚魴，鼠舞庭堂；奸佞施毒，上下昏荒，君失其國。",
 "4-9":"天地配享，六位光明；陰陽順敘，以成和平。",
 "4-10":"踝踵足傷，右足病雍；失旅後時，利走不來。",
 "4-11":"異體殊患，各有所屬；西鄰孤嫗，欲寄我室；王母罵詈，求不可得。",
 "4-12":"操稻鄉畝，折貸稷黍；飲食充口，安利無咎。",
 "4-13":"所受大喜，福祿重來；樂且日富，蒙慶得財。",
 "4-14":"舉盃飲酒，無益溫寒；指直失取，亡利不歡。",
 "4-15":"日月相望，光明盛昌；三聖茂承，功德大隆。",
 "4-16":"猾夫爭強，民去其鄉；公孫叔子，戰於瀟湘。",
 "4-17":"猨墮高木，不踒手足；還歸其室，保我金玉。",
 "4-18":"逐狐東山，水遏我前；深不可涉，失利後便。",
 "4-19":"鑿井求玉，非卞氏寶；名困身辱，勞無所得。",
 "4-20":"黃玉溫厚，君子所服；甘露溽暑，萬物生茂。",
 "4-21":"畫龍頭頸，文章不成；甘言善語，說辭無名。",
 "4-22":"招禍致凶，來弊我邦；病在手足，不得安息。",
 "4-23":"履位乘勢，靡有絕斃；皆為隸圉，與眾庶位。",
 "4-24":"獐鹿雉兔，群聚東囿；盧黃白脊，俱往趨逐；九齚十得，君子有喜。",
 "4-25":"織錦未成，緯盡無名；長子逐兔，鹿起失路；後利不得，因無所據。",
 "4-26":"天厭周德，命與仁國；以禮靜民，兵革休息。",
 "4-27":"重譯賀芝，來除我憂；善說遂良，與喜相求。",
 "4-28":"膏壤肥澤，人民孔樂；宜利居止，長安富貴。",
 "4-29":"白龍黑虎，起鬐暴怒；戰於涿鹿，蚩尤敗走，居止不殆。",
 "4-30":"抱關傳語，聾跛摧殆；眾賤無下，災殃所在。",
 "4-31":"憂禍解除，喜至慶來；坐立歡門，與樂為鄰。",
 "4-32":"折鋒載殳，車馬放休；行軍依營，天下安寧。",
 "4-33":"至德之君，仁政且溫；伊呂股肱，國富民安。",
 "4-34":"千里望城，不見山青；老兔蝦蟆，遠絕無家。",
 "4-35":"有莘季女，為夏妃后；貴夫壽子，母字四海。",
 "4-36":"不虞之患，禍至無門；奄忽暴卒，痛傷我心。",
 "4-37":"飛鷹退去，不食鄰鳥；憂患解除，主君安居。",
 "4-38":"跮差側跌，申酉為祟；亥戌滅明，顏子隱藏。",
 "4-39":"司錄憑怒，謀議無道；商氏失政，殷人乏祀。",
 "4-40":"望鷄得雉，冀馬獲駒；大德生少，有廖從居。",
 "4-41":"忉忉怛怛，如將不活；黍稷之恩，靈輒以存。",
 "4-42":"莫莫輯輯，夜作晝匿；謀議我資，來攻我室；空盡以財，幾無以食。",
 "4-43":"天之所壞，不可強支；眾口指笑，雖貴必危。",
 "4-44":"目動睫瞤，喜來加身；舉家蒙歡，吉利無殃。",
 "4-45":"黿羹芬香，染指弗嘗；口飢於手，子公恨饞。",
 "4-46":"天福所豐，兆如飛龍；成子得志，六二以興。",
 "4-47":"氓伯易絲，抱布自媒；棄禮急情，卒離悔憂。",
 "4-48":"三人為旅，俱歸北海；入門上堂，拜謁王母；勞賜我酒，歡樂無彊。",
 "4-49":"愆淫旱疾，傷害稼穡；喪制病來，農人無食。",
 "4-50":"攫飯把肉，以就口食；萬往必得，無有虛乏。",
 "4-51":"夏姬親附，心聽悅喜；利以搏取，無言不許。",
 "4-52":"南山昊天，刺政閔身；疾悲無辜，背憎為仇。",
 "4-53":"鳥飛無翼，兔走折足；雖欲會同，未得所欲。",
 "4-54":"體重飛難，未能踰關，不離室垣。",
 "4-55":"四雄並處，人民愁苦；擁兵西東，不得安所。",
 "4-56":"重譯關牢，求解己憂；心感乃成，與喜俱居。",
 "4-57":"患解憂除，皇母相於；與喜俱來，使我安居。",
 "4-58":"冬生不華，老女無家；霜冷蓬室，更為枯株。",
 "4-59":"震慄恐懼，多所畏惡；行道留難，不可以步。",
 "4-60":"三人共妻，莫適為雌；子無名氏，公不可知。",
 "4-61":"草凋被霜，花葉不長；非時為落，家受其殃。",
 "4-62":"雉兔之東，狼虎所從；貪叨凶惡，不可止息。",
 "4-63":"馬驚車破，主墮深溝；身死魂去，離其室廬。",
 "4-64":"山林麓藪，非人所處；鳥獸無禮，使我心苦。",
 "5-1":"火滅復息，君明其德；仁人可遇，身受利福。",
 "5-2":"溫山松柏，常茂不落；鸞鳳以庇，得其歡樂。",
 "5-3":"西誅不復，恃強負力；倍道趨敵，師徒敗覆。",
 "5-4":"三塗五嶽，陽城太室；神明所伏，獨無兵革。",
 "5-5":"久旱三年，草木不生；粢盛空乏，無以供靈。",
 "5-6":"二牛生狗，以戌為母；荊夷上侵，姬伯出走。",
 "5-7":"鳧遊江海，役行千里，以為死亡；復見空素，長主凶憂。",
 "5-8":"太乙駕騮，從天上求；徵召叔季，封為魯侯，無有凶憂。",
 "5-9":"絍績獨居，寡處無夫；陰陽失望，為人僕使。",
 "5-10":"兵征大宛，北出玉門；與胡寇戰，平城道西；七日絕糧，身幾不全。",
 "5-11":"楚靈暴虐，罷極民力；禍起乾谿，棄疾作毒；扶伏奔逃，死申亥室。",
 "5-12":"雌單獨居，歸其本巢；毛羽憔悴，志如死灰。",
 "5-13":"兩矛相刺，勇力鈞敵；交綏結和，不破不缺。",
 "5-14":"乘船渡濟，載水逢火；賴幸免患，蒙我生全。",
 "5-15":"喪寵溢尤，政傾家覆；我宗失國，秦滅周室。",
 "5-16":"冬無藏冰，春陽不通；陰流為賊，國被其殃。",
 "5-17":"田鼠野雞，意常欲逃；拘制籠檻，不得動搖。",
 "5-18":"佩玉蘂兮，無所繫之；旨酒一盛，莫與笑語；孤寡獨特，常愁憂苦。",
 "5-19":"沒遊原口，求鮫為寶；家危自懼，復出生道。",
 "5-20":"河水孔穴，壞敗我室；水深無岸，魚鱉傾側。",
 "5-21":"教羊牧兔，使魚相捕；任非其人，費日無功。",
 "5-22":"升戶入室，就溫燠食；水凍北陸，不能相賊。",
 "5-23":"孤竹之墟，老婦無夫；傷於蒺藜，不見少妻；東郭棠姜，武氏破亡。",
 "5-24":"凶憂災殃，日益明章；福不可釐，三郤痍傷。",
 "5-25":"戴璧秉珪，請命于河；周公作誓，沖人瘳愈。",
 "5-26":"鳥升鵲舉，照臨東海；尨降庭堅，為陶叔後；封圻英六，履祿綏厚。",
 "5-27":"危坐至暮，請求不得；膏澤不降，政戾民忒。",
 "5-28":"宜昌娶婦，東家歌舞；燕樂有序，長樂嘉喜。",
 "5-29":"鑿井求玉，非卞和寶；名困身辱，勞無所得。",
 "5-30":"鵠思其雄，欲隨鳳東；順理羽翼，出次須日；中留北邑，復反其室。",
 "5-31":"旱霜晚雪，傷害禾麥；捐功棄力，飢無所食。",
 "5-32":"蝙䘃生子，深目黑醜；雖飾相就，眾人莫取。",
 "5-33":"去如飛鴻，避凶直東；遂得全脫，與福相逢。",
 "5-34":"婚姻合配，同枕共牢；以降嘉休，子孫封侯。",
 "5-35":"咸陽辰巳，長安戌亥；丘陵生止，非魚鰌市；不可辭阻，終无悔咎。",
 "5-36":"螟虫為賊，害我五穀；簞食空虛，家無所食。",
 "5-37":"謀恩拜德，東歸吾國；慷慨歡笑，歡樂有福。",
 "5-38":"齎具贖貍，不聽我辭；繫於虎鬚，牽不得來。",
 "5-39":"比目附翼，歡樂相得；行止集周，終不離忒。",
 "5-40":"一指食肉，口無所得；染其鼎鼐，舌饞於腹。",
 "5-41":"曳綸江海，釣挂魴鯉；王孫利德，以饗仲友。",
 "5-42":"商紂牧野，顛敗所在；賦斂重數，黎元愁苦。",
 "5-43":"北辰紫宮，衣冠中立；含和建德，常受天福。",
 "5-44":"輕戰上勇，不知兵權；為敵所制，從師北奔。",
 "5-45":"大口宣唇，神使伸言；黃龍景星，出應德門；與福上天，天下安昌。",
 "5-46":"凶子禍孫，仗劍向門；凶訟讙囂，驚駭我家。",
 "5-47":"祝伯善言，能事鬼神；拜辭萬歲，使君延年。",
 "5-48":"珪璧琮璋，執贄見王；百里甯越，應聘齊秦。",
 "5-49":"昧旦乘車，履危蹈溝；亡失裙襦，摧折兩軸。",
 "5-50":"膠著木連，不出牛欄；斯享羔羊，家室相安。",
 "5-51":"卷領遁世，仁德不舍；三聖攸同，周國茂興。",
 "5-52":"黍稷苗稻，垂秀方造；中旱不雨，傷風枯槁。",
 "5-53":"冠帶南遊，與福喜逢；期於嘉貞，拜為公卿。",
 "5-54":"一巢九子，同公共母；柔順利貞，出入不殆，福祿所在。",
 "5-55":"韓氏長女，嫁於東海，宜家富主；柔順以居，利得過倍。",
 "5-56":"因禍受福，喜盈我室，所願必得。",
 "5-57":"晉平有疾，迎醫秦國；病乃大患，分為二竪；逃匿膏肓，和不能愈。",
 "5-58":"杜飛門啟，患憂大解；修福行善，不為身禍。",
 "5-59":"追亡逐北，至止而得；稚叔相呼，反其室廬。",
 "5-60":"鳥鳴葭端，一呼三顛，搖動東西；危慄不安，疾病無患。",
 "5-61":"龍化為虎，太山之陽；眾多從者，莫敢敉藏。",
 "5-62":"猋風忽起，車馳揭揭；棄名追亡，失其和節，憂心惙惙。",
 "5-63":"遊居石門，祿安身全；受福西鄰，歸飲玉泉。",
 "5-64":"登高上山，見王自言；申理我讒，得職蒙恩。",
 "6-1":"文王四乳，仁愛篤厚；子畜十男，夭折無有。",
 "6-2":"日入望東，不見子家；長女無夫，左手搔頭。",
 "6-3":"東上太山，見堯自言；申理我冤，以解憂患。",
 "6-4":"奎軫溫湯，過角宿房；宣時布和，無所不通。",
 "6-5":"引船牽頭，雖拘無憂；王母善禱，禍不成災。",
 "6-6":"文巧俗弊，將反大質；僵死如麻，流血濡樐；皆知其母，不識其父，干戈乃止。",
 "6-7":"鳧得水沒，喜笑自啄；毛羽悅懌，利以攻玉；公出不復，伯氏客宿。",
 "6-8":"水流趨下，欲至東海，求我所有；買魴與鯉，足關路止。",
 "6-9":"獐鹿逐牧，安飽其居；反還次舍，無有疾故。",
 "6-10":"樹植藿豆，不得芸鋤；王事無盬，秋無所收。",
 "6-11":"弱水之西，有西王母；生不知死，與天相保。",
 "6-12":"數窮廓落，困於歷室；卒登玉堂，與堯侑食。",
 "6-13":"子鉏執麟，春秋作元；陰聖將終，尼父悲心。",
 "6-14":"尹氏伯奇，父子生離；無罪被辜，長舌所為。",
 "6-15":"蟠木折枝，與母別離；九皐難扣，絕不相知。",
 "6-16":"弱雞無距，與鵲格鬭；翅折目盲，為鳩所傷。",
 "6-17":"甲乙丙丁，俱歸我庭；三丑六子，入門見母。",
 "6-18":"桑葉螟蠹，衣弊如絡；女功不成，絲布為玉。",
 "6-19":"關牢闢門，巡狩釋冤；夏臺羑里，湯文悅喜。",
 "6-20":"欽明之德，坐前玉食；必保嘉美，長受安福。",
 "6-21":"武夫司空，多口爭訟；金火當戶，民不安處，年飢無有。",
 "6-22":"紫閣九重，尊嚴在中；黃帝堯舜，履行至公；冠帶垂裳，天下康寧。",
 "6-23":"負牛上山，力劣行難；烈風雨雪，遮遏我前；出道復還，憂者自歡。",
 "6-24":"蹇兔缺唇，行難齒寒；口病不言，為身生患。",
 "6-25":"合體比翼，嘉偶相得；與君同好，使我有福。",
 "6-26":"口啄卒卒，憂從中出；喪我寶貝，妻妾失位。",
 "6-27":"兩心不同，或從西東；明論終日，莫適相從。",
 "6-28":"啞啞笑言，與善飲食；長樂行觴，千秋起舞，拜受大福。",
 "6-29":"初憂後喜，與福為市；八佾列陳，飲御嘉友。",
 "6-30":"西徙無家，破其新車；王孫失利，不如止居。",
 "6-31":"鳳凰在左，麒麟處右；仁聖相遇，伊呂集聚；時無殃咎，福為我母。",
 "6-32":"甌脫康居，慕仁入朝；湛露之歡，三爵畢恩，復歸舊廬。",
 "6-33":"疾貧望幸，使伯行販；關牢擇羊，多得大牂。",
 "6-34":"處高不傷，雖危不亡；握珠懷玉，還歸其鄉。",
 "6-35":"右手棄酒，左手牧牂；行逢禮御，餌得玉杯。",
 "6-36":"養虎牧狼，還自賊傷；大勇小捷，雖危不亡。",
 "6-37":"戴堯扶禹，從喬彭祖，西過王母；道路夷易，無敢難者。",
 "6-38":"秋冬探巢，不得鵲鶵；銜指北去，愧我少姬。",
 "6-39":"兩羝三牂，俱之代鄉；留連多難，損其食糧。",
 "6-40":"南徙無廬，烏破其巢；伐木思初，不利動搖。",
 "6-41":"爭訟不已，更相擊劍；張季弱口，披髮北走。",
 "6-42":"延頸望酒，不入我口；初喜後否，得利無有。",
 "6-43":"被髮傾走，寇逐我後；亡失刀兵，身全不傷。",
 "6-44":"麟鳳所遊，安樂無憂；君子撫民，世代千秋。",
 "6-45":"褰衣涉河，水深漬罷；賴幸舟子，濟脫無他。",
 "6-46":"憒憒不悅，憂從中出；喪我金罌，无妄失位。",
 "6-47":"絆跳不逞，心與言反；尼父望家，菡萏未華。",
 "6-48":"大牡肥牸，惠我諸舅；內外和穆，不憂飢渴。",
 "6-49":"黃帝建元，文德在身；祿若陽春，封為魯君。",
 "6-50":"虎聚摩牙，以待豚豬；往必傷亡，宜利止居。",
 "6-51":"天地配享，六位光明；陰陽順序，以成和平。",
 "6-52":"猿墜高木，不踒手足；保我金玉，還歸其室。",
 "6-53":"營室紫宮，堅不可攻；明神建德，君受大福。",
 "6-54":"孤翁寡婦，獨宿悲苦；目張耳明，無與笑語。",
 "6-55":"低頭窺視，有所畏避，行者不利；酒酸魚敗，眾莫貪嗜。",
 "6-56":"載金販狗，利棄我走；藏匿淵底，悔折為咎。",
 "6-57":"行觸大忌，與司命啎；執囚束縛，拘制於吏。",
 "6-58":"執玉歡喜，佩之解攣；危詳反安，使我無患。",
 "6-59":"機杼紛擾，女巧不成；長妹許嫁，衣無襦挎；聞禍不成，凶惡消去。",
 "6-60":"金人鐵距，火燒左右；難懼不恐，獨得全處。",
 "6-61":"謝恩拜德，東歸吾國；舞蹈欣躍，歡樂受福。",
 "6-62":"青牛白咽，呼我俱田；歷山之下，可以多耕；歲樂時節，民人安寧。",
 "6-63":"白雉群雊，慕德朝貢；湛露之恩，使我得歡。",
 "6-64":"避患東西，反入禍門；糟糠不足，憂愁我心。",
 "7-1":"一簧兩舌，佞言諂語；三姦成市，曾母投杼。",
 "7-2":"春桃生花，季女宜家，受福且多；在師中吉，男為封君。",
 "7-3":"殊類異路，心不相慕；牝牛牡猳，獨無室家。",
 "7-4":"折若蔽目，不見稚叔；三足孤烏，遠其元夫。",
 "7-5":"雀東求粒，誤入罔域；賴仁君子，脫腹歸息。",
 "7-6":"王孫季子，相與孝友，明允篤誠；升擢家舉，為國榦輔。",
 "7-7":"烏鳴呼子，哺以酒脯；高樓之處，子來歸母；穡人成功，年歲大有，姤婦無子。",
 "7-8":"刖樹無枝，與子分離；飢寒莫食，獨泣哀悲。",
 "7-9":"舜升大禹，石夷之野；徵詣玉闕，拜理水土。",
 "7-10":"義不勝情，以欲自營；見利危寵，滅君令名。",
 "7-11":"三人北行，六位光明；道逢淑女，與我驥子。",
 "7-12":"羿張烏號，彀射天狼；柱國雄勇，鬪死榮陽。",
 "7-13":"季姬踟躕，結衿待時；終日至暮，百兩不來。",
 "7-14":"鴻鴈翩翩，始怨勞苦；災疫病民，鰥寡愁憂。",
 "7-15":"穿胸狗邦，僵離旁美；天地易紀，日月更始。",
 "7-16":"北山有棗，使叔壽考；東嶺多粟，宜行賈市；陸梁雌雉，所至利喜。",
 "7-17":"干旄旄旗，撫幟在郊；雖有寶玉，無路致之。",
 "7-18":"精潔淵塞，為讒所言；證訊詰問，繫於枳溫；甘棠聽斷，怡然蒙恩。",
 "7-19":"玄黃瘣隤，行者勞罷；役夫憔悴，踰時不歸。",
 "7-20":"膚敏之德，發憤晨食；虜豹禽說，以成德王。",
 "7-21":"采唐沫鄉，要我桑中；失信不會，憂思約帶。",
 "7-22":"伯寧子福，惠我邦國；蠲除苛殘，使季无患。",
 "7-23":"讒言佞雄，敗亂邦國；生雖忠孝，敗恩不足。",
 "7-24":"淵泉隄防，水道利通；順注湖海，邦國富有。",
 "7-25":"江南多蝮，螫我手足；冤繁詰屈，痛徹心腹。",
 "7-26":"三人俱行，別離獨食，一身五心；反覆迷惑，亂無所得。",
 "7-27":"鴉鳴庭中，以戒災凶；重門擊柝，備不速客。",
 "7-28":"功成事就，拱手安居；立德有言，坐飾貢賦。",
 "7-29":"國亂不安，兵革為患；掠我妻子，家中飢寒。",
 "7-30":"戴堯扶禹，從喬彭祖，西過王母；道路夷易，無敢難者。",
 "7-31":"長尾蜲蛇，畫地成河；深不可涉，絕無以比，惆悵會息。",
 "7-32":"乘龍從蜺，徵詣北闕；乃見宣室，拜守東城；鎮慰黎元，舉家蒙福。",
 "7-33":"土與山連，終身無患；天地高明，萬歲長安。",
 "7-34":"久旱水涸，枯槁無澤；虛修其德，未有所獲。",
 "7-35":"依天倚地，凶危不至；上清下淨，受福大明，君受其利。",
 "7-36":"火烈不去，必殪僵仆；燔我衣裾，禍不可悔。",
 "7-37":"配合相迎，利之西鄉；欣喜興釋，所言得當。",
 "7-38":"清人高子，久屯外野；逍遙不歸，思我慈母。",
 "7-39":"武庫軍府，甲兵所聚；非里邑居，不可舍止。",
 "7-40":"三德五才，和合四時；陰陽順敘，國无咎災。",
 "7-41":"解衣毛羽，飛入大都；晨門戒守，鄭忽失家。",
 "7-42":"刖根燒株，不生飢膚；病在心腹，日以焦枯。",
 "7-43":"文山紫芝，雍梁朱草；生長和氣，福祿多處。",
 "7-44":"多載重負，棄捐于野；予母誰子，但自勞苦。",
 "7-45":"鳧鴈啞啞，以水為家；雌雄相和，心至娛樂，得其歡欲。",
 "7-46":"耳目盲聾，所言不通；佇直以泣，事無成功。",
 "7-47":"天宮列宿，五神所舍；宮闕堅固，君安其居。",
 "7-48":"范子妙材，戮辱傷膚；然後相國，封為應侯。",
 "7-49":"秋冬探巢，不得鵲雛；銜指北去，慚我少夫。",
 "7-50":"子畏於匡，厄困陳蔡；德行不危，竟脫厄害。",
 "7-51":"鴻飛在陸，公出不復；仲氏任止，伯氏客宿。",
 "7-52":"鶴鳴九皐，避世隱居；抱朴守真，竟不隨時。",
 "7-53":"舜升大禹，石夷之野；徵諸玉闕，拜治水土。",
 "7-54":"左輔右弼，金玉滿堂；常盈不亡，富如敖倉。",
 "7-55":"崔嵬北岳，天神貴客；衣冠不已，蒙彼恩德。",
 "7-56":"空槽注豬，豶彘不到；張弓祝雞，雄父飛去。",
 "7-57":"胡蠻戎狄，大陰所積；涸冰凍寒，君子不存。",
 "7-58":"甘露醴泉，太平機關；仁德感應，歲樂民安。",
 "7-59":"惡來呼伯，慎驚外客；甲守閉宅，以備凶急；臨折之憂，將滅無災。",
 "7-60":"日月相望，光明盛昌；三聖茂功，仁德大隆。",
 "7-61":"葛藟蒙棘，華不得實；讒佞亂政，使恩壅塞。",
 "7-62":"鄰不我顧，而望玉女；身多癩疾，誰肯媚者。",
 "7-63":"精誠所在，神之為輔；德教尚忠，彌世長久；三聖尚功，多受福祐。",
 "7-64":"鑽木求火，掘地索水；主母飢渴，手為心禍。",
 "8-1":"繼祖復宗，追明成康；光照萬國，亭世久長。",
 "8-2":"取火流泉，釣魴山顛；魚不可得，火不肯燃。",
 "8-3":"麟子鳳雛，生長家國；和氣所居，康樂溫仁，邦多聖人。",
 "8-4":"彭名為娛，白龍作菑；盜堯舜裳，桀蹠荷兵；青禽照火，三日夷傷。",
 "8-5":"黍稷醇釀，敬奉山宗；神嗜飲食，甘雨嘉降；庶物蕃殖，獨蒙福祉。",
 "8-6":"李花再實，鴻飛降集；仁哲權輿，廕國受福。",
 "8-7":"千歲之墟，大國所屠；不見子都，城空無家。",
 "8-8":"鹿得美草，鳴呼其友；九族和穆，不憂飢乏。",
 "8-9":"公子王孫，把彈攝丸；發輒有得，室家饒足。",
 "8-10":"驪姬讒喜，與二嬖謀；譖殺恭子，害賊忠孝；申生以縊，重耳奔逃。",
 "8-11":"長生無極，子孫千億；柏柱載青，堅固不傾。",
 "8-12":"失意懷憂，如幽狴牢；亡子喪夫，附托寄居。",
 "8-13":"仁智隱伏，麟不可得；龍蛇潜藏，虛居堂室。",
 "8-14":"挒絜累累，締結難解；嫫母衒嫁，媒不得坐，自為身禍。",
 "8-15":"蜩飛墮木，不毀頭足；保我羽翼，復歸其室。",
 "8-16":"陳媯敬仲，兆興齊姜；乃適營丘，八世大昌。",
 "8-17":"過時不歸，雄雌苦悲；徘徊外國，與母分離。",
 "8-18":"齊魯爭言，戰於龍門；搆怨結禍，三世不安。",
 "8-19":"府藏之富，王以賑貸；捕魚河海，茍願多得。",
 "8-20":"鳴鶴北飛，下就稻池；鱣鮪鰋鯉，眾多饒有；一狗獲兩，利得過倍。",
 "8-21":"蒼梧鬱林，道易利通；元龜象齒，寶貝南金，為吾福功。",
 "8-22":"兩火爭明，雖鬬不傷；分離且忍，全我弟兄。",
 "8-23":"伯夷叔齊，貞廉之師；以德防患，憂禍不存。",
 "8-24":"季去我東，髮櫛如蓬；展轉空牀，內懷憂傷。",
 "8-25":"百足俱行，相輔為強；三聖翼事，王室寵光。",
 "8-26":"壅遏隄防，水不得行；火盛陽光，陰蜺伏藏，退還其鄉。",
 "8-27":"滕蛇乘龍，年歲飢凶，民食草蓬。",
 "8-28":"鉛刀攻玉，堅不可得；盡我筋力，胝蠒為候。",
 "8-29":"恒山浦壽，高邑所在；陰氣下淋，洪水不處；勞人開戶。",
 "8-30":"比目四翼，來安我國；福善上堂，與我同床。",
 "8-31":"杜口結舌，心中拂鬱；去菑患生，莫所結冤。",
 "8-32":"牽尾不前，逆理失臣；忠莫往來，衛朔以奔。",
 "8-33":"早霜晚雪，傷害禾麥；損功棄力，飢無所食。",
 "8-34":"適戌失期，患生無知，懼以懷憂；發藏閉塞，邦國騷愁。",
 "8-35":"昊天白日，照臨我國；萬民康寧，咸賴嘉福。",
 "8-36":"元吉无咎，安寧不殆；時行則行，勿之有悔。",
 "8-37":"懿公淺愚，不深受謀；無援失國，為狄所賊。",
 "8-38":"城上有鳥，自名破家；喚呼鴆毒，為國患災。",
 "8-39":"長股善走，趨步千里；王良嘉言，伯來在道；申見王母。",
 "8-40":"耕石山顛，費種家貧；無聊處作，苗髮不生。",
 "8-41":"二人異路，東趨西步；千里之外，不相知處。",
 "8-42":"純服黃裳，載土以興；德義茂生，天下歸仁。",
 "8-43":"五銑鐵頤，倉庫空虛；賈市無盈，與利為仇。",
 "8-44":"登崑崙，入天門；過糟丘，宿玉泉；問惠觀，見仁君。",
 "8-45":"團團白日，為月所食；損上毀下，鄭昭出走。",
 "8-46":"倉盈庾億，宜稼黍稷；年歲有息，國家富有。",
 "8-47":"虎狼結謀，相聚為保；伺齧牛羊，道絕不通，傷我商人。",
 "8-48":"中年摧折，常恐不活；老賴福慶，光榮輔相。",
 "8-49":"同載共輿，中道分去；喪我元夫，獨為孤居。",
 "8-50":"飲酒醉酗，距躍爭鬬；伯傷叔僵，東家治喪。",
 "8-51":"出值凶災，逢五赤頭，跳言死格；扶杖伏聽，不敢動搖。",
 "8-52":"狼虎爭強，禮義不行；兼吞其國，齊晉無主。",
 "8-53":"南國少子，方略美好；求我長女，薄賤不與；反得醜惡，後乃大悔。",
 "8-54":"一身兩頭，莫適其驅；亂不可治，孰為湯漢。",
 "8-55":"李耳蝟鵲，更相恐怯；偃爾以腹，不能距格。",
 "8-56":"松柏棟梁，相輔為強；八哲五教，王室寧康。",
 "8-57":"雀行求食，暮歸孚乳；反其室舍，安寧無故。",
 "8-58":"四尾六頭，為凶作妖；陰不奉陽，上失其明。",
 "8-59":"一衣三闕，結緝不便；岐道異路，日暮不到。",
 "8-60":"牙孽生齒，室當啟戶；幽人利貞，鼓翼起舞。",
 "8-61":"春鴻飛東，以馬質金；利得十倍，重載歸鄉。",
 "8-62":"懽悅以喜，子孫具在；守發能忍，不見殃咎。",
 "8-63":"精華消落，形體醜惡；齬齚挫頓，枯槁腐蠹。",
 "8-64":"登高上山，見王自言；申理我冤，得職蒙恩。",
 "9-1":"東過虎地，牛馬奔驚；道絕不通，南困無功。",
 "9-2":"子鉏執麟，春秋作元；陰將以終，尼父悲心。",
 "9-3":"取火泉源，釣魴山巔；魚不可得，火不可燃。",
 "9-4":"機關不便，不能出言；精誠不通，為人所冤。",
 "9-5":"故室舊廬，稍弊且除；不如新巢，可治樂居。",
 "9-6":"蜲蛇循流，東求大魚；預且舉網，庖人歌謳。",
 "9-7":"鑿山通道，南至嘉國；周公祝祖，襄適荊楚。",
 "9-8":"鵲近卻縮，不見頭目；日以困急，不能自復。",
 "9-9":"白鳥啣餌，鳴呼其子；斡枝張翅，來從其母；伯仲叔季，尤賀舉手。",
 "9-10":"五舌啄難，各自有言；異國殊俗，使心迷惑，所求不得。",
 "9-11":"天門開闢，牢戶寥廓；桎梏解脫，拘囚縱釋。",
 "9-12":"堅冰黃鳥，當哀悲愁；數驚鷙鳥，雛為我憂。",
 "9-13":"日走月步，趨不同舍；夫妻反目，主君失居。",
 "9-14":"金牙鐵齒，西王母子，無有患殃；扶舍渉道，到來不久。",
 "9-15":"拭牧拭牧，憂禍相半；隔以巖山，室家分散。",
 "9-16":"眾神集聚，相與議語；南國虛亂，百姓勞苦；興師征伐，更立賢王。",
 "9-17":"狼虎爭食，禮義不行；兼吞其國，齊晉無主。",
 "9-18":"寄生無根，如過浮雲；本立不固，斯須落去，更為枯樹。",
 "9-19":"子啼索哺，母行求食；反見空巢，長息訾弋。",
 "9-20":"駕駟逐狐，輪挂荊棘；車不結轍，公子無得。",
 "9-21":"方喙廣口，仁智聖厚；釋解倒懸，唐國大安。",
 "9-22":"駕福乘喜，來至嘉國；戴慶南行，離我安居。",
 "9-23":"孔鯉伯魚，北至高奴；乘馬金車，駕遊大都；王母送我，來牝字駒。",
 "9-24":"三足無頭，不知所之；心狂精傷，莫使為明，不見日光。",
 "9-25":"騋牝龍身，日馭三千；南止蒼梧，與福為婚；道理夷易，安全無患。",
 "9-26":"辰次降婁，王駕巡時；廣祐施惠，安國無憂。",
 "9-27":"望幸不到，文章未就；王子逐走，馬騎銜傷；昳迹不得，曷其有常。",
 "9-28":"中原有菽，以待饔食；飲御諸友，所求大得。",
 "9-29":"亂茅縮酒，靈巫拜禱；神怒不許，瘁愁憂苦。",
 "9-30":"李花再實，鴻卵降集；仁哲以興，廕國受福。",
 "9-31":"源出陵足，行於山趾；不為暴害，民得安處。",
 "9-32":"客入其門，奔走東西；童女不織，士棄耕畝；暴骨千里，歲寒無年。",
 "9-33":"天之所子，福祿常在；以永康寧，不憂危殆。",
 "9-34":"蝗食我稻，驅不可去；實穗無有，但見空藁。",
 "9-35":"牛驥同堂，郭氏已亡；國破空虛，君奔走逃。",
 "9-36":"狗無前足，陰謀其北；為身害賊，何以安息。",
 "9-37":"兩輪自轉，南上大阪；四馬共轅，無有屯難；與禹笑言，鶴鳴竅穴，不離其室。",
 "9-38":"芽蘖生達，陽昌於外；左手執籥，公言錫爵。",
 "9-39":"秋華冬萼，數被嚴霜；甲兵當庭，萬物不生；雄犬夜鳴，民擾大驚。",
 "9-40":"霜降閉戶，蟄虫隱處；不見日月，與死為伍。",
 "9-41":"身載百里，功如四海；為文開基，武立大桂。",
 "9-42":"禹作神間，伯益衘指；斧斤高閣，憧位獨坐；賣庸不讎，苦困為禍。",
 "9-43":"福祚之家，喜至憂除；如魚逢水，長樂受喜。",
 "9-44":"蒼龍隱伏，麟鳳遠匿；冠履同處，未得安息。",
 "9-45":"旦生夕死，名曰嬰鬼，不可得視。",
 "9-46":"白鶴銜珠，夜食為明；懷安德音，身受光榮。",
 "9-47":"役行未已，新事復起；姬姜勞苦，不得休息。",
 "9-48":"憂患解除，喜至慶來；坐立歡忻，與樂為鄰。",
 "9-49":"晨風之翰，大舉就溫；昧過我邑，羿無所得。",
 "9-50":"下田稷黍，方華生齒；大雨集降，紛澇滿甕。",
 "9-51":"君子碌碌，鳥庇茂木；見春百穀，心勞願德。",
 "9-52":"折臂踒足，不能進酒；祠祀曠闊，神怒不喜。",
 "9-53":"學靈三年，聖且神明；光見善祥，吉喜福慶；鳲鳩飛來，告我無憂。",
 "9-54":"三婦同夫，忽不相思；心懷不平，志常愁悲。",
 "9-55":"中田膏黍，以享王母；受福千億，所求大得。",
 "9-56":"陽火不災，喜至慶來；降福送喜，鼓琴歌謳。",
 "9-57":"陽明不息，君無恩德；伯氏失利，農喪其力。",
 "9-58":"鷰雀銜茅，以生孚乳；兄弟六人，姣好悌孝；各得其願，和悅相樂。",
 "9-59":"鶉尾奔奔，火中成軍；虢叔出奔，下失其君。",
 "9-60":"兩人相距，止不同舍；夫妻離散，衛侯失居。",
 "9-61":"魁為番虎，風推雲卻；欲上不得，反歸其宅。",
 "9-62":"關雎淑女，配我君子；少妻在門，君子嘉喜。",
 "9-63":"慈母赤子，饗賜得士；襄夷服除，以安王家。",
 "9-64":"三足孤鳥，靈鳴督郵；伺過討惡，自賊其家。",
 "10-1":"東嚮藩垣，相與笑言；子般執鞭，圉人作患。",
 "10-2":"循河摘舟，旁淮東游；漁父舉網，先得大鰌。",
 "10-3":"轅折輪破，馬倚僕臥；後旅先宿，右足跌踒。",
 "10-4":"兩人相絆，相與悖戾；心不同爭，訟忷忷然。",
 "10-5":"北辰紫宮，衣冠立中；含和建德，常受天福。",
 "10-6":"遊居石門，祿身安全；受福西鄰，歸飲玉泉。",
 "10-7":"羊腸九縈，相推併前；止須王孫，乃能上天。",
 "10-8":"爭訟相倍，和氣不處；陰陽俱否，谷風母子。",
 "10-9":"郭叔距頤，為棘所拘；龍額重顙，禍不成殃；復歸其鄉。",
 "10-10":"十烏俱飛，羿得九雌；雄雖得全，且驚不危。",
 "10-11":"蠆室蜂戶，螫我手足；不得進止，為吾害咎。",
 "10-12":"怒非其怨，因拘有遷；貪垢腐鼠，而呼鴞鳶，失反被困。",
 "10-13":"嬰孩求乳，母歸其子；黃麑悅喜，自樂甘餌。",
 "10-14":"鍼鏤勝服，錦繡不成；鷹逐雉兔，爪折不得。",
 "10-15":"雨潦集降，河梁不通；鄒魯閉塞，破費市空。",
 "10-16":"封豕溝瀆，水潦空谷；客止舍宿，泥塗至腹，處無黍稷。",
 "10-17":"三姦相擾，桀跖為交；上下騷離，隔絕天道。",
 "10-18":"齊景惑疑，為孺子牛；嫡庶不明，賊孽為患。",
 "10-19":"三羊俱亡，走奔南行；會暮失迹，不知所藏。",
 "10-20":"請伯行賈，代山之野；夜歷險阻，不逢危殆，利如澆酒。",
 "10-21":"桑之將落，殞其黃葉；失勢傾側，而無所立。",
 "10-22":"上山求魚，入水捕狸；市非其歸，自令久留。",
 "10-23":"名成德就，項領不試；景公耋老，尼父逝去。",
 "10-24":"天之奧隅，堯舜所居；以存保身，為我國家。",
 "10-25":"雎鳩淑女，賢聖配偶；宜家壽福，吉慶長久。",
 "10-26":"兩人俱爭，莫能有定；心乖不同，訟言起凶。",
 "10-27":"涉伯徇名，棄禮誅身；不得其道，成子奔燕。",
 "10-28":"踰江求橘，并得大栗；烹羊食肉，飯酒歌笑。",
 "10-29":"山險難升，澗中多石；車馳轊擊，重傷載軸；擔負善躓，跌踒右足。",
 "10-30":"元利孔福，神所子畜；般樂無苦，得其歡欲。",
 "10-31":"烏鵲食穀，張口受哺；蒙被恩福，長大成就；柔順利貞，君臣合好。",
 "10-32":"潼滃蔚薈，膚寸來會；津液下降，流潦滂沛。",
 "10-33":"路多枳棘，步刺我足；不利旅客，為心作毒。",
 "10-34":"虺蝮所聚，難以居處；毒螫痛甚，瘡不可愈。",
 "10-35":"麟鳳相隨，觀察安危；東郭聖人，后稷周公；共和政令，君子攸同；利以居止，長无憂凶。",
 "10-36":"築亂不時，使民恨憂；立趾為笑，君危臣騷。",
 "10-37":"黃帝所生，伏羲之宅；兵刃不至，利以居止。",
 "10-38":"雀行求食，暮歸屋宿；反其室舍，安寧無故。",
 "10-39":"大倉積穀，天下饒食；陰陽和調，年歲時熟。",
 "10-40":"履機蹈顛，墜入寒淵；行不能前，足踒不便。",
 "10-41":"竿旄旌旗，執幟在郊；雖有寶珠，無路致之。",
 "10-42":"銜命上車，和合兩家；蛾眉皓齒，二國率殭。",
 "10-43":"吉日車攻，田弋獲禽；宣王飲酒，以告嘉功。",
 "10-44":"重伯黃寶，宜以我市；嫁娶有息，利得過母。",
 "10-45":"延頸望酒，不入我口；深以自喜，利得無有。",
 "10-46":"牧為代守，饗食甘賜；得吏士意，戰大破胡，長安國家。",
 "10-47":"日出溫谷，臨照萬國；高明淑仁，虞夏配德。",
 "10-48":"逐兔索鳥，破我弓車；日暮不及，失利後時。",
 "10-49":"譌言妄語，傳相詿誤；道左失迹，不知所處。",
 "10-50":"履虎躡蛇，貶損我威；君子失車，去其國家。",
 "10-51":"本根不固，花葉落去；更為孤嫗，不得相親。",
 "10-52":"五軛四軏，優得饒有；陳力就列，騶虞喜悅。",
 "10-53":"黃帝紫雲，聖且神明；光見福祥，告我无殃。",
 "10-54":"五利四福，俱佃高邑；黍稷盛茂，多獲藁稻。",
 "10-55":"群虎入邑，求索肉食；大人衛守，君不失國。",
 "10-56":"烏子鵲雛，嘗與母居；顧慕群侶，不離其巢。",
 "10-57":"蹇驢不材，駿驥失時；筋勞力盡，罷於沙丘。",
 "10-58":"玄鬣黑顙，東歸高鄉；朱鳥道引，靈龜載莊；遂抵天門，見我貞君。",
 "10-59":"探巢得雛，鳩鵲來俱，使我音娛。",
 "10-60":"安上宜官，一日九遷；升擢超等，牧養常山，君臣獲安。",
 "10-61":"大頭目明，戴受嘉福；三雀飛來，與祿相得。",
 "10-62":"遠視千里，不見黑子；離婁之明，无益於光。",
 "10-63":"三女為姦，俱遊高園；倍室夜行，與伯笑言；不忍主母，失禮酒冤，皇天誰告。",
 "10-64":"日辰不和，強弱相振；一雌兩雄，客勝主人。",
 "11-1":"伯夷叔齊，貞廉之師；以德防患，憂禍不存。",
 "11-2":"濟深難渡，濡我衣袴；五子善櫂，脫無他故。",
 "11-3":"倚立相望，適得道通；驅駕奔馳，比目同床。",
 "11-4":"葛藟蒙棘，花不得實；讒佞為政，使恩壅塞。",
 "11-5":"四足無角，君子所服；南征述職，與福相得。",
 "11-6":"踝踵之傷，左指病癰；失旅後時，利走不來。",
 "11-7":"春城夏國，生長之域；可以服食，保全家國。",
 "11-8":"望驥不來，駒蹇為憂；雨驚我心，風撼我肌。",
 "11-9":"久客無床，思歸我鄉；雷雨涌盈，道不得通。",
 "11-10":"舫船備水，旁可燃火；積善有徵，終身無禍。",
 "11-11":"求玉陳國，留連東域；須我王孫，四日來復；主君有德，蒙恩受福。",
 "11-12":"陟岵望母，役事未已；王政無盬，不得相保。",
 "11-13":"多載重負，捐棄於野；予母誰子？但自勞苦。",
 "11-14":"生直地乳，上皇大喜；賜我福祉，受命無極。",
 "11-15":"翕翕䡘䡘，稍墮崩顛；滅其令名，長沒不全。",
 "11-16":"東鄰嫁女，為王妃后；莊公築館，以尊王母；歸于京師，季姜悅喜。",
 "11-17":"伯虎仲熊，德義淵閎；使布五穀，陰陽順敘。",
 "11-18":"敏捷敬疾，如猨升木；彤弓雖調，終不能獲。",
 "11-19":"舉被覆目，不見日月；衣裘簟床，就長夜室。",
 "11-20":"忍醜少羞，無面有頭；虛日以弊，消寡耗減。",
 "11-21":"涸陰沍寒，常冰不溫；凌人墮怠，雹大為菑。",
 "11-22":"夏麥麩䵃，霜擊其芒；疾君敗國，使民夭傷。",
 "11-23":"淵涸龍憂，箕子為奴；午叔殞命，殷破其家。",
 "11-24":"跛踦相隨，日暮牛罷；陵遲後旅，失利亡雌。",
 "11-25":"桑之將落，隕其黃葉；失勢傾測，如無所立。",
 "11-26":"生長以時，長育根本；陰陽和德，歲樂無憂。",
 "11-27":"童女無夫，未有匹配；陰陽不和，空坐獨宿。",
 "11-28":"春令原宥，仁德不全；三聖攸同，周國茂興。",
 "11-29":"金精耀怒，帶劍過午；兩虎相距，雖驚无咎。",
 "11-30":"危坐至暮，請求不得；膏澤不降，政戾民忒。",
 "11-31":"老陽日衰，條多枯枝；爵級不進，日下摧隤。",
 "11-32":"蔡侯適楚，留連江濱；踰時歷月，思其君后。",
 "11-33":"右撫劍頭，左受鈎帶；凶訟不止，相與爭戾，失利市肆。",
 "11-34":"水流趨下，遠至東海；求我所有，買鮪與鯉。",
 "11-35":"登几上輿，駕駟南遊；合從散衡，燕秦以強。",
 "11-36":"求兔得獐，過其所望；歡以相迎，高位夷傷。",
 "11-37":"過時不歸，道遠且迷；旅人心悲，使我徘徊。",
 "11-38":"魂孤無室，銜指含食；盜張民饋，見敵失肉。",
 "11-39":"居如轉丸，危不得安；東西不寧，動生憂患。",
 "11-40":"坤厚地德，庶物蕃息；平康正直，以綏大福。",
 "11-41":"列蔽牡荊，生賢山旁；仇敵背憎，孰肯相迎。",
 "11-42":"鳳凰銜書，賜我玄珪，封為晉侯。",
 "11-43":"作凶不善，相牽入井；溺陷辜罪，禍至憂有。",
 "11-44":"悲鳴北行，失其長兄；伯仲不幸，骸骨散亡。",
 "11-45":"羔衣豹裘，高易我家，君子惟好。",
 "11-46":"日中為市，各抱所有；交易資貨，貪珠懷寶，心悅歡喜。",
 "11-47":"振急絕理，常陽不雨；物病焦乾，華實無有。",
 "11-48":"狐貉載剝，徒溫厚蓐；寒棘為疾，有所不足。",
 "11-49":"履踐危難，脫執去患；入福喜門，見誨大君。",
 "11-50":"四亂不安，東西為患；退止我足，毋出國城；乃得全完，賴其生福。",
 "11-51":"南國少子，才略美好；求我長女，賤薄不與；反得醜惡，後乃大悔。",
 "11-52":"妄怒失理，陽孤無輔；物病焦枯，年飢於黍。",
 "11-53":"倬然遠咎，避患害早；田獲三狐，見民為寶。",
 "11-54":"逐鹿山顛，利去我西；維邪南北，無所不得。",
 "11-55":"龍蛇所聚，大水來處；滑滑泲泲，使我無賴。",
 "11-56":"從風吹火，牽騏驥尾；易為功力，因催受福。",
 "11-57":"澤狗水鳧，難畜少雛；不為家饒，心其函憂。",
 "11-58":"水壞我里，東流為海；龜鳧讙囂，不賭慈母。",
 "11-59":"褰衣涉行，水深漬多；賴幸舟子，濟脫無他。",
 "11-60":"龜厭河海，陸行不止；自令枯槁，失其都市；憂悔為咎，亦無及已。",
 "11-61":"同本異業，樂仁政德；東鄰慕義，來興我國。",
 "11-62":"桃李花實，累累日息；長大成熟，甘美可食，為我利福。",
 "11-63":"重瞳四乳，聰明順理；無隱不形，微視千里；災害不作，君子集聚。",
 "11-64":"實沈參墟，以義討尤；次止結盟，以成霸功。",
 "12-1":"天之奧府，眾利所聚；可以饒有，樂我君子。",
 "12-2":"天之所菑，凶不可居；轉徙獲福，留止危憂。",
 "12-3":"名成德就，項領不試；景公耋老，尼父逝去。",
 "12-4":"持善避患，福祿長存；雖有豺虎，不能危患。",
 "12-5":"避患東西，反入禍門；糟糠不屬，憂動我心。",
 "12-6":"珪璧琮璋，執贄見王；百里寗越，應聘齊秦。",
 "12-7":"揚水潛鑿，使君潔白；衣素朱表，戲遊皐沃；得君所願，心志娛樂。",
 "12-8":"官爵相保，居之无咎；求免不得，怕使恨悔。",
 "12-9":"戴元無褌，臝裎出門；小兒作笑，君子憂患。",
 "12-10":"把珠入口，為我利寶；得吾所有，欣然嘉喜。",
 "12-11":"行不如還，直不如屈；進不若退，可以安吉。",
 "12-12":"秦為虎狼，與晉爭強；併吞其國，號曰始皇。",
 "12-13":"眾鬼凡聚，還生大怪；九身無頭，魂驚魄去，不可以居。",
 "12-14":"家給人足，頌聲並作；四夷賓服，干戈襄閣。",
 "12-15":"人面鬼口，長舌為斧；斲破瑚璉，殷商絕祀。",
 "12-16":"南山之峻，真人所在；德配唐虞，天命為子；保祐飲享，身受大慶。",
 "12-17":"春桃生花，季女宜家；受福多年，男為邦君。",
 "12-18":"鴟鴞破斧，沖人危殆；賴其忠德，轉禍為福，傾危復立。",
 "12-19":"猿墮高木，不踒手足；保我金玉，還歸其室。",
 "12-20":"天之奧隅，堯舜所居；可以存身，保我邦家。",
 "12-21":"伯蹇叔盲，足病難行；終日至暮，不離其鄉。",
 "12-22":"日月相望，光明盛昌；三聖茂功，仁德大隆。",
 "12-23":"桃李花實，累累日息；長大成就，甘美可食。",
 "12-24":"入和出明，動作有光；運轉休息，動作尤康。",
 "12-25":"陰冥老極，陽建其德；履離載光，天下昭明；功業不長，蝦蟆代王。",
 "12-26":"行役未巳，新事復起；姬姜勞苦，不得休息。",
 "12-27":"狐鳴苑北，飢無所食；困於空丘，莫與同力。",
 "12-28":"雄聖伏名，人匿麟遠；走鳳飛北，擾亂未息。",
 "12-29":"病貧望幸，使伯行販；開牢擇羊，多得大牂。",
 "12-30":"翕翕䡘䡘，稍墮崩顛；滅其令名，長沒不存。",
 "12-31":"花落實槁，衣弊如絡；女功不成，絲布如玉。",
 "12-32":"溫山松柏，常茂不落；鸞鳳所止，得以歡樂。",
 "12-33":"失恃毋友，嘉偶出走；攫如失兔，傫如喪狗。",
 "12-34":"太乙駕騮，從天上求；徵我叔季，封為魯侯。",
 "12-35":"雙鳧俱飛，欲歸稻池；經涉雚澤，為矢所射，傷我胸臆。",
 "12-36":"深坑復平，天下安寧；意娛心樂，賴福長生。",
 "12-37":"俱為天民，雲過吾西；風伯雨師，與我無恩。",
 "12-38":"野鳥山鵲，來集六愽；三鳥四散，主人勝客。",
 "12-39":"北陰司寒，堅冰不溫；凌人情怠，大雹為災。",
 "12-40":"伊尹智士，去桀耕野；執順以傳，反和无咎。",
 "12-41":"北風牽手，相從笑語；伯歌季舞，讌樂以喜。",
 "12-42":"從巢去家，南過白馬；東西受福，與母相得。",
 "12-43":"鳥飛跌跛，兩兩相和；不病四支，但去莫疑。",
 "12-44":"三馬生駒，以戍為母；荊夷上侵，姬伯出走。",
 "12-45":"破筐弊筥，棄捐於道；壞落穿敗，不復所寶。",
 "12-46":"結紐得解，憂不為禍；食利供家，受福安坐。",
 "12-47":"白日陽光，雷車避藏；雲雨不行，各自止鄉。",
 "12-48":"杜口結舌，心中怫鬱；凶災生患，無所告冤。",
 "12-49":"齍貝贖狸，不聽我辭；繫於虎髯，牽不得來。",
 "12-50":"持鶴抱子，見蛇何咎；室家俱在，不失其所。",
 "12-51":"逐兔山西，利走入門；賴我仁德，獲為我福。",
 "12-52":"興役不休，與民爭時；牛生五趾，行危為憂。",
 "12-53":"春粟夏梨，少鮮希有；斗千石萬，貴不可販。",
 "12-54":"悲號北行，失其長兄；伯仲不幸，骸骨散亡。",
 "12-55":"賦斂重數，政為民賊；杼軸空盡，家去其室。",
 "12-56":"履服白縞，殃咎並到，憂不敢笑。",
 "12-57":"杜口結舌，言為禍母；代伯受患，無所禱冤。",
 "12-58":"免冠進賢，步行出朝；門體不正，賊孽為患。",
 "12-59":"娶於姜女，駕迎新婦；少齊在門，夫子悅喜。",
 "12-60":"牧羊稻園，聞虎喧嚾；恩恐悚息，終無禍患。",
 "12-61":"老妾据機，緯絕不知；女功不成，冬寒無衣。",
 "12-62":"乘龍吐光，使陰復明；燎獵載聖，六師以昌。",
 "12-63":"東鄰嫁女，為王妃后；莊公築館，以尊王母；歸于京師，季姜悅喜。",
 "12-64":"灌鴶東從，道頓跌躊；日食不退，病為身禍。",
 "13-1":"一臂六手，不便於口；莫肯與用，利棄我走。",
 "13-2":"獐鹿逐牧，飽歸其居，安寧無悔。",
 "13-3":"鴻魚逆流，至人潜渚；蒿蓬代柱，大屋顛倒。",
 "13-4":"三羖五牂，相隨俱行；迷入空澤，經涉六駮，為所傷賊。",
 "13-5":"黃帝出遊，駕龍乘馬；東上太山，南過齊魯，邦國咸喜。",
 "13-6":"履危不安，心欲東西；步走逐鹿，空無所得。",
 "13-7":"望尚阿衡，太宰周公；藩屏湯武，立為侯王。",
 "13-8":"白龍黑虎，起伏俱怒；戰於阪兆，蚩尤走敗，死於魯首。",
 "13-9":"載石上山，步跌不前；嚬眉之憂，不得所歡。",
 "13-10":"周德既成，杼軸不傾；申酉跌暮，耋老衰去，箴石不祐。",
 "13-11":"乘雲帶雨，與飛鳥俱；動舉千里，見我慈母。",
 "13-12":"齎貝贖狸，不聽我辭；繫於虎鬚，牽不得來。",
 "13-13":"密槖山顛，銷鋒鑄刃；示不復用，天下大勸。",
 "13-14":"三翼飛來，是我逢時；俱行先至，多得大利。",
 "13-15":"兩足四翼，飛入家國；寧我伯子，與母相得。",
 "13-16":"按民呼池，玉杯文案；魚如白雲，一國獲願。",
 "13-17":"季姬踟躕，望我城隅；終日至暮，不見齊侯，君上無憂。",
 "13-18":"龍渴求飲，黑雲影從；河伯奉觴，跪進酒漿，流潦滂滂。",
 "13-19":"出門逢患，與福為怨；更相擊刺，傷我手端。",
 "13-20":"播天舞地，神明所守，安樂無咎。",
 "13-21":"兩金相擊，勇氣鈞敵；終日大戰，不破不缺。",
 "13-22":"車雖駕，兩紖絕；馬奔出，雙輪脫；行不至，道遇害。",
 "13-23":"文山紫芝，雍梁朱草；長生和氣，王以為寶；公尸侑食，福祿來處。",
 "13-24":"把珠入口，為我畜寶；得吾所有，忻然嘉喜。",
 "13-25":"負牛上山，力劣行難；烈風雨雪，遮遏我前；中道復還，憂者得歡。",
 "13-26":"陶朱白圭，善賈息資；三致千金，德施上人。",
 "13-27":"子鉏執麟，春秋作元；陰聖將終，尼父悲心。",
 "13-28":"春日載陽，福履齊長；四時不忒，與樂為倡。",
 "13-29":"孔德如玉，出於幽谷；飛上喬木，鼓其羽翼，大光照國。",
 "13-30":"區脫康居，慕仁入朝；湛露之歡，三爵畢恩；復歸窮廬，以安其居。",
 "13-31":"秋冬夜行，照覽星辰；道理利通，終身何患。",
 "13-32":"鳴鵠抱子，見蛇何咎；室家俱在，不失其所。",
 "13-33":"安和太山，福祿屢臻；雖有豺虎，不能危身。",
 "13-34":"老目瞢眠，不知東西；君失理命，以直為傴，玉珍其寶。",
 "13-35":"植璧秉珪，請命于河；周公剋敏，沖人瘳愈。",
 "13-36":"太王執政，歲熟民富；國家豐有，主者有喜。",
 "13-37":"爭訟相背，和氣不處；陰陽俱否，谷風無子。",
 "13-38":"齊魯爭言，戰於龍門；搆怨結禍，三世不安。",
 "13-39":"鹿得美草，鳴呼其友；九族和穆，不離邦域。",
 "13-40":"百里南行，雖微復明；去虞適秦，為穆國卿。",
 "13-41":"梅李冬實，國多寇賊；亂擾並作，王不能制。",
 "13-42":"府藏之富，王以振貸；捕魚河海，茍罔多得。",
 "13-43":"杜飛門啟，患憂大解；去老乘馬，不為身禍。",
 "13-44":"宜昌娶婦，東家歌舞，長樂歡喜。",
 "13-45":"正陽之央，甲氏以亡；禍及留吁，湮滅為墟。",
 "13-46":"鳥過稻廬，甘樂𪍿鰌；雖驅不去，田畯懷憂。",
 "13-47":"跛踦俱行，日暮車傷，失旅乏糧。",
 "13-48":"龍門水穴，流行不害；民安其土，君臣相保。",
 "13-49":"山陵西塞，遏我徑路；欲前不得，復還故處。",
 "13-50":"兩虎爭鬭，血流漂杵；城郭空墟，蒿蔾塞道。",
 "13-51":"依叔牆隅，志下心勞；楚亭晨食，韓子低頭。",
 "13-52":"龍生無常，或託空桑；憑乘風雲，為堯立功。",
 "13-53":"魁行搖尾，逐雲吹火；汙泥為陸，下田為稷。",
 "13-54":"跛踦相隨，日暮牛罷；陵遲後旅，失利亡雌。",
 "13-55":"三人俱行，北求大牂；長孟病足，請季負囊；柳下之寶，不失驪黃。",
 "13-56":"鳳凰在左，麒麟處右；仁聖相遇，伊呂集聚；傷害不至，時無殃咎，福為我母。",
 "13-57":"乘筏渡海，雖深不殆；曾孫皇祖，累累具在。",
 "13-58":"比目四翼，來安吾國；賷福上堂，與我同床。",
 "13-59":"娶於姜呂，駕迎新婦；少齊在門，夫子悅喜。",
 "13-60":"螟蟲為賊，害我稼穡；盡禾殫麥，秋無所得。",
 "13-61":"衣裳顛倒，為王來呼；成就東周，邦國大休。",
 "13-62":"王孫季子，相與為友；明允篤誠，升擢慶舉。",
 "13-63":"踊泉滑滑，流行不絕；汙為江海，敗毀邑里；家無所處，聞虎不懼，向我笑喜。",
 "13-64":"桑戶竊脂，啄粟不宜；亂政無常，使我孔明。",
 "14-1":"南山大行，困於空桑；老沙為石，牛馬無糧。",
 "14-2":"蟠枝失岐，與母別離，絕不相知。",
 "14-3":"譐譐所言，莫知我恒；歡樂堅固，可以長安。",
 "14-4":"李梅零墜，心思憒憒；懷憂少愧，亂我魂氣。",
 "14-5":"火雖熾，在吾後；寇雖多，在吾右；身安吉，不危殆。",
 "14-6":"虎臥山隅，鹿過後胊；弓矢設張，猬為功曹；伏不敢起，遂至平野，得我美草。",
 "14-7":"三火起明，雨滅其光；高位疾巔，驕恣誅傷。",
 "14-8":"匹居楚馬，遇讒無辜，久旅離憂。",
 "14-9":"一室百子，同公異母；以義防患，禍菑不起。",
 "14-10":"商人行旅，資所無有；貪貝利珠，留連王市；還旋內顧，公子何咎。",
 "14-11":"禹將為君，北入崑崙；稍進揚光，登入溫湯；代舜為治，功德昭明。",
 "14-12":"乾行天德，覆幬無極；嘔呼烹熟，使各自得。",
 "14-13":"南國盛茂，黍稷醴酒；可以享老，樂我嘉友。",
 "14-14":"白虎張牙，征伐東來；朱雀前驅，讚道說辭；敵人請服，銜璧前趨。",
 "14-15":"方船備水，旁河然火，終身無禍。",
 "14-16":"雷行相逐，無有休息；戰于平陸，為夷所覆。",
 "14-17":"躑躅踟躕，拊心搔頭；五晝四夜，睹我齊侯。",
 "14-18":"大口宣唇，神使伸言；黃龍景星，出應侯門；與福上堂，天下安昌。",
 "14-19":"陰衰老極，陽建其德；離陽載光，天下昭明。",
 "14-20":"三塗五嶽，陽城太室；神明所伏，獨無兵革。",
 "14-21":"年豐歲熟，政仁民樂；利以居止，旅人獲福。",
 "14-22":"楚烏逢天，不時久放；離居無群，意昧精喪；作此哀詩，以告孔憂。",
 "14-23":"出門大步，與凶惡忤；罵公詈母，為我憂恥。",
 "14-24":"火至井谷，陽芒生角；犯歷天戶，闚觀太微；登上玉床，家易六公。",
 "14-25":"牧羊逢狼，雖憂不傷；畏怖既息，終無禍殃。",
 "14-26":"蠒栗犧牲，敬奉貴神；享者飲食，受福多孫；望季不來，孔聖厄陳。",
 "14-27":"大蓋治床，南歸羖羊；長伯為我，多得牛馬，利於徙居。",
 "14-28":"枯樹無枝，與子分離；飢寒莫養，獨立哀悲。",
 "14-29":"天地九重，堯舜履中；正冠垂裳，宇宙平康。",
 "14-30":"鳧鷖遊涇，君子以寧；履德不愆，福祿來成。",
 "14-31":"裸程逐狐，為人觀笑；牝雞雄晨，主作亂根。",
 "14-32":"典策法書，藏在蘭臺；雖遭亂潰，獨不遇菑。",
 "14-33":"三癡俱狂，欲之平鄉；迷惑失道，不知昏明。",
 "14-34":"癭瘤瘍疥，為身瘡害；疾病癃痢，常不屬逮。",
 "14-35":"三豕俱走，鬬於虎口；白豕不勝，死於阪下。",
 "14-36":"賴先之光，受德之佑；雖遭顛沛，獨不凶咎。",
 "14-37":"上義崇德，以建大福；明哲且聰，周武立功。",
 "14-38":"四亂不安，東西為患；身止無功，不出國城；乃得全完，賴其生福。",
 "14-39":"金牙鐵齒，西王母子；無有患殆，減害道利。",
 "14-40":"賀喜從福，日利蕃息，歡樂有得。",
 "14-41":"昊天白日，照臨我國；萬民康寧，咸賴嘉福。",
 "14-42":"左眇右盲，視闇不明；下民多孽，君失其常。",
 "14-43":"吾家黍粱，積委道傍；有囊服箱，運到我鄉；藏於嘉倉。",
 "14-44":"殊類異路，心不相慕；牝猭無猳，鰥無室家。",
 "14-45":"雀行求食，出門見鷂；顛蹷上下，幾無所處。",
 "14-46":"野有種庾，穡人駕取；不逢虎狼，暮歸其宇。",
 "14-47":"膚敏之德，發憤忘食；虎豹禽說，為王求福。",
 "14-48":"光祀春成，陳寶雞鳴；陽明失道，不能自守。",
 "14-49":"左抱金玉，右得熊足；常盈不忘，獲心所欲。",
 "14-50":"履泥汙足，名困身辱；兩仇相得，身為痛瘧。",
 "14-51":"安居重遷，不去其亶；未來相聞，樂得常產。",
 "14-52":"天災所遊，凶不可居；轉徙獲福，留止危憂。",
 "14-53":"昧昧墨墨，不知白黑；景雲亂擾，光明隱伏；犬戎來攻，幽主失國。",
 "14-54":"鳧鴈啞啞，以水為宅；雌雄相和，心志娛樂，得其所欲。",
 "14-55":"長生無極，子孫千億；柏柱載器，堅固不傾。",
 "14-56":"麒麟鳳凰，善政得祥；陰陽和調，國無災殃。",
 "14-57":"天之奧隅，堯舜所居；可以存身，保我室家。",
 "14-58":"配合相迎，利之四鄰；昏以為期，與福笑喜。",
 "14-59":"砥德礪材，果當成周；拜受大命，封為齊侯。",
 "14-60":"與福俱坐，畜水備火；思患豫防，終無殃禍。",
 "14-61":"畏昏潜處，候明昭昭；卒遭白日，為世榮主。",
 "14-62":"視日載光，與天相望；長生歡悅，以福為多。",
 "14-63":"大頭明目，載受嘉福；三雀飛來，與祿相單。",
 "14-64":"楩生荊山，命載輸班；袍衣剝脫，夏熱冬寒；立餓枯槁，眾人莫憐。",
 "15-1":"喋囁處曜，昧冥相待；多言少實，終無成事。",
 "15-2":"北辰紫宮，衣冠立中；含和建德，常受大福；鉛刀攻玉，堅不可得。",
 "15-3":"東壁餘光，數闇不明；主母妬嫉，亂我事業。",
 "15-4":"下背其上，盜明相讓；嬰子兩頭，陳破其虛。",
 "15-5":"鳳生會稽，稍巨飛翔；翺翔往來，為眾鳥雄。",
 "15-6":"鑿井求玉，非卞氏寶；名困身辱，勞無所得。",
 "15-7":"邦桀載役，道至東萊；百僚具舉，君王嘉喜。",
 "15-8":"安息康居，異國同廬；非吾邦域，使伯憂惑。",
 "15-9":"江河淮海，天之都市；商人受福，國家富有。",
 "15-10":"同本異葉，樂仁上德；東鄰慕義，來興吾國。",
 "15-11":"白鶴銜珠，夜食為明；懷吾德音，身受光榮。",
 "15-12":"踐履危難，脫厄去患；入福喜門，見吾邦君。",
 "15-13":"宮商既和，聲音相隨；驪駒在門，主君以歡。",
 "15-14":"天地配享，六位光明；陰陽順序，以成厥功。",
