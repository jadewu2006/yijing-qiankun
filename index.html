 "51-33":"背地相憎，心志不同，如火與金；君猛臣慢，虎行兔伏。",
 "51-34":"夏臺羑里，湯文阨處；鬼侯欼醢，岐人悅喜。",
 "51-35":"牙孽生齒，螳蜋啟戶；幽人利貞，鼓翼起舞。",
 "51-36":"列女無夫，閔思苦憂；齊子無良，使我心愁。",
 "51-37":"踐履危難，脫阨去患；入福喜門，見誨大君。",
 "51-38":"折臂接手，不能進酒；祈祀閑曠，神怒不喜。",
 "51-39":"蟻封戶穴，大雨將集；鵲起數鳴，牝雞歎室；相夢雄父，未到在道。",
 "51-40":"胡俗戎狄，太陰所積；固冰沍寒，君子不存。",
 "51-41":"翕翕䡘䡘，稍頹崩顛；減其令名，身不得全。",
 "51-42":"災蟲為賊，害我稼穡；盡禾單麥，秋無所得。",
 "51-43":"三幸飛來，自我逢時；俱行先至，多得大利。",
 "51-44":"龍馬上山，焦無水泉；喉焦唇乾，渴不能言。",
 "51-45":"春生孶亂，萬物繁熾；君子所集，禍災不至。",
 "51-46":"王孫季子，相與為友；明允篤誠，升擢薦舉。",
 "51-47":"六明並照，政紀有統；秦楚戰國，民受其咎。",
 "51-48":"蝃蝀充側，佞人所惑；女謁橫行，正首壅塞。",
 "51-49":"登崑崙，入天門；過糟丘，宿玉泉；問惠歡，見欣君。",
 "51-50":"體重飛難，未能越關；不啻留垣，上下墟塞，心不遑安。",
 "51-51":"枯瓠不朽，利以濟舟；渡踰河海，無有溺憂。",
 "51-52":"玄黃虺隤，行者勞罷；役夫憔悴，踰時不歸。",
 "51-53":"孔德如玉，出於幽谷；飛上高木，鼓其羽翼，輝光照國。",
 "51-54":"火雖熾，在吾後；寇雖眾，出我右；身安居，不危殆。",
 "51-55":"旃裘羶國，文禮不飾；跨馬控絃，伐我都邑。",
 "51-56":"被髮八十，慕德獻服；邊鄙不聳，以安王國。",
 "51-57":"心得所好，口常為笑；公孫蛾眉，雞鳴樂夜。",
 "51-58":"馬能負乘，見邑之野；并獲粢稻，喜悅无咎。",
 "51-59":"高飛視下，貪叨所在；腐臭為患，害於躬身。",
 "51-60":"東行西步，失其次舍；乾侯野井，昭君喪居。",
 "51-61":"神鳥五彩，鳳凰為主；集於山谷，使年歲有。",
 "51-62":"石門晨啟，荷蕢疾貧；遯世隱居，竟不逢時。",
 "51-63":"𪙨𪙨齧齧，貧鬼相責；無有歡怡，一日九結。",
 "51-64":"白日揚光，雷車避藏；雲雨不行，各止其鄉。",
 "52-1":"憂驚已除，禍不為災，安全以來。",
 "52-2":"穿匏挹水，冓鐵燃火；勞霸力竭，飢渴為禍。",
 "52-3":"蹇牛折角，不能載粟；災害不避，年歲無穀。",
 "52-4":"邑將為虛，居之憂危。",
 "52-5":"根刖殘樹，華葉落去；卒逢火焱，隨風僵仆。",
 "52-6":"元后貪欲，窮極民力；執政乖互，為夷所偪。",
 "52-7":"北山有棗，使叔壽考；東領多栗，宜行賈市；陸梁雌雉，所至利害。",
 "52-8":"高源峻山，陸土少泉；草木林麓，嘉禾所炎。",
 "52-9":"辰次降婁，王駕巡時；廣祐施惠，國安無憂。",
 "52-10":"䡘䡘轠轠，歲暮偏弊；寵名損棄，君衰於位。",
 "52-11":"放銜委轡，奔亂不制；法度無恆，君失其位。",
 "52-12":"獨坐西垣，莫與言笑；秋風多哀，使我心悲。",
 "52-13":"脛急股攣，不可出門；暮速歸旅，必為身患。",
 "52-14":"情偽難知，使我偏頗；小人在位，雖聖何咎。",
 "52-15":"黍稷醇醲，敬奉山宗；神嗜飲食，甘雨嘉降；庶物蕃廡，時無災咎。",
 "52-16":"公子王孫，把彈攝丸；發輒有獲，室家饒足。",
 "52-17":"陰升陽伏，舜失其室；慈母赤子，相餧不食。",
 "52-18":"七竅龍身，造易八元；法則天地，順時施恩，利以長存。",
 "52-19":"逐狐東山，水遏我前；深不可涉，失利後便。",
 "52-20":"銜命辱使，不堪其事；中墜落去，更為負載。",
 "52-21":"溫仁君子，忠孝所在；入閏為儀，禍菑不起。",
 "52-22":"春多膏澤，夏潤優渥；稼穡成熟，畝獲百斛；師行失律，霸功不遂。",
 "52-23":"二女同室，心不聊食；首髮如蓬，憂常在中。",
 "52-24":"築闕石顛，立本泉源；疾病不安，老孤為鄰。",
 "52-25":"欲避凶門，反與禍鄰；顛覆不制，痛薰我心。",
 "52-26":"踧行竊視，有所畏避；狸首伏藏，以夜為利。",
 "52-27":"八面九口，長舌為斧；劈破瑚璉，殷商絕後。",
 "52-28":"和氣相薄，膏澤津液，生我嘉穀。",
 "52-29":"消金厭兵，雷車不行，民安其鄉。",
 "52-30":"秦儀機言，解其國患；一說燕下，齊相以權。",
 "52-31":"旦奭王輔，周德孔明；越裳獻雉，萬國咸康。",
 "52-32":"弱足刖跟，不利出門；賈市無盈，折亡為患。",
 "52-33":"堅冰黃鳥，常哀悲愁；不見白粒，但覩藜蒿；數驚鷙鳥，為我心憂。",
 "52-34":"魂微惙惙，屬纊聽絕；曠然大通，復更生活。",
 "52-35":"陰生獐鹿，鼠舞鬼哭，靈龜墜處。",
 "52-36":"諸石攻玉，無不穿鑿；龍體具舉，魯班為輔；麟鳳成形，德象君子。",
 "52-37":"山作天時，陸為海口，民不安處。",
 "52-38":"東風啟戶，隱伏歡喜；氓庶蒙恩，復得我子。",
 "52-39":"華燈百枝，稍辦衰微；精光欲盡，奄如灰靡。",
 "52-40":"三十無室，寄宿桑中；上宮長女，不得來同，使我失期。",
 "52-41":"卵與石鬬，糜碎無疑；動而有悔，出不得時。",
 "52-42":"秦兵爭強，失其貞良，敗於殽鄉。",
 "52-43":"虎除善猛，難為攻醫；驥窮鹽車，困於銜箠。",
 "52-44":"操笱搏狸，荷弓射魚；非其器用，自令心勞。",
 "52-45":"葵丘之盟，晉獻會行；見太宰辭，復為還輿。",
 "52-46":"臏詐龐子，夷竈盡毀；兵伏萃發，矢至如雨；魏師驚亂，將獲為虜，涓死樹下。",
 "52-47":"南行出城，世得天福；王姬歸齊，賴其所欲。",
 "52-48":"冬采微蘭，地凍堅難；利走室北，暮無所得。",
 "52-49":"王喬無病，苟頭不痛；亡屐失履，乏我送從。",
 "52-50":"宛馬疾步，盲師坐御；目不見路，中宵不到。",
 "52-51":"求利難國，亡去我北；憂歸其城，反為吾賊。",
 "52-52":"君孤獨處，單弱無輔，名曰困苦。",
 "52-53":"比目四翼，安我邦國；上下無患，為吾喜福。",
 "52-54":"八材既登，以成股肱；厖降庭堅，國無災凶。",
 "52-55":"稍弊穿空，家莫為宗；為身作凶，奴婢逃走，子西父東。",
 "52-56":"鳥舞國城，邑懼卒驚；仁德不修，為下所傾。",
 "52-57":"五穀不熟，民苦困急；亟之南國，嘉樂有得。",
 "52-58":"黃裳建元，福德在身；祿祐洋溢，封為齊君；賈市無門，富寶多餐。",
 "52-59":"齊東郭廬，嫁於洛都；驪婦美好，利得過倍。",
 "52-60":"安床厚褥，不得久宿；棄我嘉宴，困於南國；投杼之憂，不成禍災。",
 "52-61":"內崩身傷，中亂無常；雖有美粟，不我食得。",
 "52-62":"出門逢患，與禍為怨；更相擊刺，傷我指端。",
 "52-63":"出入節時，南北無憂；行者函至，在外歸來。",
 "52-64":"公孫駕驪，載游東齊；延陵說產，遺季紵衣。",
 "53-1":"旦種菽荳，暮成藿羹；心之所願，志快意愜。",
 "53-2":"牡飛門啟，憂患大解；修福行善，不為身禍。",
 "53-3":"東山西山，各自止安；雖相登望，竟未同堂。",
 "53-4":"眾鳥所翔，中有大怪；九身無頭，魂驚魄去，不可以居。",
 "53-5":"交侵如亂，民無聊賴；追戎濟西，敵人破陣。",
 "53-6":"麟鳳所翔，國无咎殃；賈市十倍，復歸惠鄉。",
 "53-7":"鑿井求玉，非卞氏寶；身困名辱，勞無所得。",
 "53-8":"文山鴻豹，肥腯多脂；王孫獲願，載福巍巍。",
 "53-9":"周成之隆，刑錯除凶；太宰費祐，君子作人。",
 "53-10":"珪璧琮璜，執贄見王；百里甯戚，應聘齊秦。",
 "53-11":"穿空漏徹，破壞我缺；陶弗能治，瓦甓不鑿。",
 "53-12":"鴻飛循陸，公出不復，伯氏客宿。",
 "53-13":"蝦蟇群聚，從天請雨；雲雷運集，應其願所。",
 "53-14":"老弱無子，不能自理；為民所憂，終不離咎；管子治國，侯伯賓服；乘輿八百，尊我恒德。",
 "53-15":"蟠梅折枝，與母別離，絕不相知。",
 "53-16":"盛中不絕，衰者復掇；盈滿減虧，贏去卻肥；鄭昭失國，重耳興立。",
 "53-17":"聞虎入邑，必欲逃匿；無據易德，不見藿菽，終無憂慝。",
 "53-18":"隨時逐便，不失利門；多獲得福，富於封君。",
 "53-19":"禹作神鼎，伯益銜指；斧斤既折，撞立獨倚；賣萬不讎，枯槁為禍。",
 "53-20":"春鴻飛東，以馬貿金；利得十倍，重載歸鄉。",
 "53-21":"金齒鐵牙，壽考宜家；年歲有儲，貪利者得，雖憂無咎。",
 "53-22":"膏澤沐浴，洗去污辱；振除災咎，更與福處。",
 "53-23":"履階登墀，高登峻巍；福祿洋溢，依天之威。",
 "53-24":"坤厚地德，庶物蕃息；平康正直，以綏大福。",
 "53-25":"絕域異路，多所畏惡；使我驚懼，思吾故處。",
 "53-26":"襁褓孩幼，冠帶成家；出門如賓，父母何憂。",
 "53-27":"一尋百節，綢繆相結；其指詰詘，不能解脫。",
 "53-28":"鷹鸇獵食，雉兔困急；逃頭見尾，為害所賊。",
 "53-29":"危坐至暮，請求不得；膏澤不降，政戾民惑。",
 "53-30":"剛柔相呼，二姓為家；霜降既同，惠我以仁。",
 "53-31":"慈母念子，饗賜得士；蠻夷來服，以安王國。",
 "53-32":"良夫孔姬，脅悝登臺；欒季不扶，衛輒走逃。",
 "53-33":"子長忠直，季氏為賊；禍及無嗣，司馬失福。",
 "53-34":"節度之德，不涉亂國；雖昧無光，後大受慶。",
 "53-35":"驅羊南行，與禍相逢；狼驚我馬，虎盜我子，悲恨自咎。",
 "53-36":"尼父孔丘，釣而不網；他人羅釣，得獲萬頭，富其家室。",
 "53-37":"大根不固，華葉落去，更為孤嫗。",
 "53-38":"設罟捕魚，反得居諸；員困竭忠，伍氏夷誅。",
 "53-39":"敏捷極疾，如猨集木；彤弓雖調，終不能獲。",
 "53-40":"冠帶南遊，與福相期；徼於嘉國，拜為逢時。",
 "53-41":"年豐歲熟，政仁民樂，祿人獲福。",
 "53-42":"築闕石顛，立基泉源；疾病不安，老孤無鄰。",
 "53-43":"逐狐東山，水遏我前；深不可涉，失利後便。",
 "53-44":"麟子鳳雛，生長嘉國；和氣所居，康樂溫仁，邦多聖人。",
 "53-45":"西行求玉，冀得瑜璞；反得凶惡，使我驚惑。",
 "53-46":"心狂老悖，聽視聾盲；正命無常，下民多孽。",
 "53-47":"南國少子，才略美好；求我長女，賤薄不與；反得醜惡，後乃大悔。",
 "53-48":"逶迤高原，家伯妄施，亂其五官。",
 "53-49":"謝恩拜德，東歸吾國，歡樂有福。",
 "53-50":"雞鳴同舉，思配無家；執珮持鳧，無所致之。",
 "53-51":"凶重憂累，身受誅罪，神不能解。",
 "53-52":"虎豹熊羆，遊戲山谷；仁賢君子，得其所欲。",
 "53-53":"別離分散，長子從軍；稚叔就賊，寡老獨居，莫為種瓜。",
 "53-54":"海隅遼右，福祿所在；柔嘉蒙祉，九夷何咎。",
 "53-55":"華首之山，仙道所遊；利以居止，長无咎憂。",
 "53-56":"甲乙戊庚，隨時轉行；不失常節，萌牙律屈；咸達生出，各樂其類。",
 "53-57":"跛躓未起，失利後市，不得鹿子。",
 "53-58":"怙恃自負，不去於下；血從地出，誅罰失理。",
 "53-59":"江河淮海，天之都市；商人受福，國家饒有。",
 "53-60":"節情省慾，賦斂有度；家給人足，利以富貴。",
 "53-61":"牝牛鳴哅，呼求其潦；雲雨大會，流成河海。",
 "53-62":"日月之塗，所行必到，無有患故。",
 "53-63":"乘風而舉，與飛鳥俱；一舉千里，見吾愛母。",
 "53-64":"陰醜陽爭，臥木反立；君子攸行，喪其官職。",
 "54-1":"荊木冬生，司寇緩刑；威權在下，國亂且傾。",
 "54-2":"喘牛傷暑，弗能成畝；草萊不闢，年歲無有。",
 "54-3":"魚欲負流，眾不同心，至德潛伏。",
 "54-4":"春耕有息，秋入利福；獻豜大豵，以樂成功。",
 "54-5":"生有聖德，上配太極；皇靈建中，授中以福。",
 "54-6":"右撫琴頭，左手援帶；凶訟不已，相與爭戾，失利而歸。",
 "54-7":"炙魚枯斗，張伺夜鼠；舌不忍味，機發為祟，卡不得去。",
 "54-8":"申酉說服，牛馬休息；君子以安，勞者得歡。",
 "54-9":"堯門尹爵，聖德增益；使民不疲，安無怵惕。",
 "54-10":"孤公寡婦，獨宿悲苦；目張耳鳴，莫與笑語。",
 "54-11":"外得好畜，相與嫁娶；仁賢集聚，諮詢厥事；傾奪我城，使家不寧。",
 "54-12":"煎砂盛暑，鮮有不朽；去河千里，敗我利市；老牛盲馬，去之何悔。",
 "54-13":"甲乙戊庚，隨時轉行；不失常節，萌芽律屈；咸達出生，各樂其類。",
 "54-14":"依宵夜遊，與君相遭；除解煩惑，使心不憂。",
 "54-15":"死友絕朋，巧言為讒；覆白污玉，顏叔哀喑。",
 "54-16":"逐利三年，利走如神；輾轉東西，如鳥避丸。",
 "54-17":"隄防壞決，河水放逸；傷害稼穡，居孤獨宿，沒溺我邑。",
 "54-18":"陰陽隔塞，許嫁不答；旄丘新臺，悔往嘆息。",
 "54-19":"伯夷叔齊，貞廉之師；以德防患，憂禍不存。",
 "54-20":"陽為狂悖，拔劍自傷，為身生殃。",
 "54-21":"進士為官，不若復田，獲壽保年。",
 "54-22":"耕石不生，棄禮無名；縫衣失鍼，襦袴弗成。",
 "54-23":"靈龜陸處，一旦失所；伊子復耕，桀亂無輔。",
 "54-24":"室當源口，溺漂為海；財產殫盡，食衣無有。",
 "54-25":"雞方啄粟，為狐所逐；走不得食，惶懼喘息。",
 "54-26":"家在海隅，繞旋深流；豈敢憚行，無木以趨。",
 "54-27":"他山之錯，與環為仇；來攻我城，傷我肌膚。國家騷憂。",
 "54-28":"弊鏡無光，不見文章；少女不嫁，棄於其公。",
 "54-29":"大蛇巨魚，相搏於郊；君臣隔塞，戴公盧曹。",
 "54-30":"絕世無嗣，福祿無存；精神渙散，離其躬身。",
 "54-31":"文君之德，養仁致福；年無胎夭，國富民實；憂者之望，增參盜息。",
 "54-32":"合歡之國，喜為我福；東嶽南山，朝躋成息。",
 "54-33":"憂人之患，履悖易顏，為身禍殘；率身自守，與喜相抱；長子成老，封受福祉。",
 "54-34":"太公避紂，七十隱處；卒受聖文，為王室輔。",
 "54-35":"江漢上流，政逆民憂；陰伐其陽，雌為雄公。",
 "54-36":"縮緒亂絲，舉手為災；越畝逐兔，喪其衣袴。",
 "54-37":"臭彘腐水，與狼相輔；亡夫失子，憂及父母。",
 "54-38":"刲羊不當，女執空筐；兔跛鹿踦，緣山墜墮，讒佞亂作。",
 "54-39":"拔劍傷手，見敵不善；良臣無佐，國憂為咎。",
 "54-40":"三羖五牂，相隨俱行；迷入空澤，循谷直北；經涉六駁，為所傷賊。",
 "54-41":"爭雞失羊，亡其金囊；利得不長，陳蔡之患，賴楚以安。",
 "54-42":"三驪負銜，南取芷香；秋蘭芬馥，盈滿神匱，利我仲季。",
 "54-43":"孟夏己丑，哀呼尼父；明德訖終，亂虐茲起。",
 "54-44":"履不容足，南山多革；家有芳蘭，乃無病疾。",
 "54-45":"三足無頭，弗知所之；心強睛傷，莫使為明，不見月光。",
 "54-46":"戴堯扶禹，喬松彭祖；西過王母，道里夷易，無敢難者。",
 "54-47":"式微式微，憂禍相絆；隔以岩山，室家分散。",
 "54-48":"靈龜陸處，一旦失所；伊子復耕，桀亂無輔。",
 "54-49":"仁德覆洽，恩及異域；澤被殊方，禍災隱伏；蠶不作室，寒無所得。",
 "54-50":"夏麥麩䵃，霜擊其芒；疾君敗國，使年夭傷。",
 "54-51":"火雖熾，在吾後；寇雖多，出我右；身安吉，不危殆。",
 "54-52":"遠遼絕路，客宿多悔；頑嚚相聚，生我畏惡。",
 "54-53":"懸懸南海，去家萬里；飛兔褭駿，一日見母，除我憂悔。",
 "54-54":"堅冰黃裳，鳥哀悲愁；不見白粒，但覩藜蒿；數驚鷙鳥，為我心憂。",
 "54-55":"困而後通，雖危不窮；終得其願，姬姜相從。",
 "54-56":"西賈巴蜀，寒雪至轂；欲前不得，還反空屋。",
 "54-57":"作新初陵，爛焰難登；三駒摧車，躓頓傷頤。",
 "54-58":"延頸望酒，不入我口，深目自苦；利得無有，幽人悅喜。",
 "54-59":"仲春孟夏，和氣所舍；生我喜福，國無殘賊。",
 "54-60":"張羅捕鳩，兔離其災；雌雄俱得，為罝所賊。",
 "54-61":"三人俱行，一人言北；伯仲欲南，少叔不得；中路分爭，道鬬相賊。",
 "54-62":"然諾不行，欺紿誤人；使我露宿，夜歸溫室；神怒不直，鬼欲求獨；刺擊其目，反言自賊。",
 "54-63":"陳辭達誠，使安不傾；增祿益壽，以成功名。",
 "54-64":"火燒公床，破家滅亡；然得安昌，先憂重喪。",
 "55-1":"鼎足承德，嘉謀生福；為王開庭，得心所欲。",
 "55-2":"曳綸河海，釣魴與鯉；王孫利得，以饗仲友。",
 "55-3":"東山臯落，叛逆不服；興師征討，恭子敗覆。",
 "55-4":"千里騂駒，為王服車；嘉其麗榮，君子有成。",
 "55-5":"三龍北行，道逢六狼；暮宿中澤，為禍所傷。",
 "55-6":"天災所遊，凶不可居；轉徙獲福，留止危憂。",
 "55-7":"狐狸雉兔，畏人逃去；分走竄匿，不如所處。",
 "55-8":"雨師娶婦，黃巖季女；成禮既婚，相呼南去。膏潤下土，年歲大有。",
 "55-9":"外棲野鼠，與雞為伍；瘡痍不息，即去其室。",
 "55-10":"天命絕後，孤傷無主；彷徨兩社，獨不得酒。",
 "55-11":"鵠思其雄，欲隨鳳東；順理羽翼，出次須日；中留北邑，復反其室。",
 "55-12":"蜲虵九子，長尾不殆；均明光澤，燕自受福。",
 "55-13":"日走月步，趨不同舍；夫妻反目，君主失國。",
 "55-14":"宣房戶室，枯期除毒；文德淵府，害不能賊。",
 "55-15":"齊東郭廬，嫁于洛都；駿良美好，謀利過倍。",
 "55-16":"病篤難醫，和不能治；命終期訖，下既蒿里。",
 "55-17":"開郭緒業，王迹所起；姬德七百，報以八子。",
 "55-18":"豐年多儲，江海饒魚；商客善賈，大國富有。",
 "55-19":"鵠求魚食，過彼射邑；繒加我頭，繳挂羽翼；欲飛不能，為羿所得。",
 "55-20":"望城抱子，見邑不殆；公孫上堂，大君悅喜。",
 "55-21":"左指右麾，邪淫侈靡；執節無良，靈公以亡。",
 "55-22":"日中為市，各持所有；交易資賄，函珠懷寶。",
 "55-23":"山沒丘浮，陸為水魚，燕雀無廬。",
 "55-24":"馬服長股，宜行善市；蒙祐諧偶，獲利五倍；終日在市，詰朝獲利；既享嘉福，得之以義。",
 "55-25":"三狸捕鼠，遮遏前後；死於環域，不得脫走。",
 "55-26":"鬼舞國社，歲樂民喜；臣忠於君，子孝於父。",
 "55-27":"慈母望子，遙思不已；久客外野，我心悲苦。",
 "55-28":"雨師娶婦，黃巖季子；成禮既婚，相呼南去；膏潤下土，年歲大有。",
 "55-29":"百狗同室，相嚙爭食；枉矢西流，射我暴國；高宗鬼方，三年乃服。",
 "55-30":"早霜晚雪，傷害禾麥；損功棄力，飢無可食。",
 "55-31":"腐臭所在，青蠅集聚；變白為黑，敗亂邦國；君為臣逐，失其寵祿。",
 "55-32":"牽羊不與，與心戾旋；聞言不信，誤紿丈人。",
 "55-33":"甘忍利害，還相克敵；商子酷刑，鞅喪厥身。",
 "55-34":"刲羊不當，女執空筐；兔跛鹿踦，緣山墜墮。",
 "55-35":"𪙨𪙨囓囓，貧鬼相責；無有歡怡，一日九結。",
 "55-36":"兩足四翼，飛入嘉國；寧我伯姊，與母相得。",
 "55-37":"天山紫芝，雍梁朱草；生長和氣，王以為寶；公尸侑食，福祿來處。",
 "55-38":"絕世遊魂，福祿不存；精神渙散，離其躬身。",
 "55-39":"北辰紫宮，衣冠立中；含弘建德，常受大福。",
 "55-40":"伯蹇叔瘖，莫與守株；失我衣裘，代爾陰鄉。",
 "55-41":"兩女共室，心不聊食；首髮如蓬，憂常在中。",
 "55-42":"去辛就蓼，毒愈苦甚；避穽遇坑，憂患日生。",
 "55-43":"初病終凶，季為死喪，不見光明。",
 "55-44":"三鳥飛來，自到逢時；俱行先至，多得大利。",
 "55-45":"鹿食山草，不思邑里，雖久無咎。",
 "55-46":"羊腸九縈，相推稍前；止須王孫，乃能上天。",
 "55-47":"管仲遇桓，得其願歡；膠牢振冠，冠帶無憂；笑戲不莊，空言妄行。",
 "55-48":"桀跖並處，民困愁苦；行旅遲遲，留連齊魯。",
 "55-49":"魂孤無室，衘指不食；盜張民餌，見敵失福。",
 "55-50":"讒言亂國，覆是為非；伯奇乖難，恭子憂哀。",
 "55-51":"衛侯東遊，惑於少姬；亡我考妣，久迷不來。",
 "55-52":"雞鳴同興，思邪無家；執佩持鳧，莫使致之。",
 "55-53":"義不勝情，以欲自榮；覬利危寵，摧角折頸。",
 "55-54":"臣尊主卑，擁力日衰；侵奪無光，三家逐公。",
 "55-55":"諸孺行賈，經涉大阻；與杖焉市，不憂危殆．利得十倍。",
 "55-56":"叔仲善賈，與喜為市；不憂危殆，利得十倍。",
 "55-57":"六虵奔走，俱入茂草；驚於長路，畏懼啄口。",
 "55-58":"水壞我里，東流為海；鳧鼃讙囂，不得安居。",
 "55-59":"飛不遠去，卑斯內侍，祿養未富。",
 "55-60":"陰變為陽，女化為男；治道大通，君臣相承。",
 "55-61":"踐履危難，脫厄去患；入福喜門，見誨大君。",
 "55-62":"罟密網縮，動益蹶急，困不得息。",
 "55-63":"負牛上山，力劣行難；烈風雨雪，遮遏我前，中道復還。",
 "55-64":"喁喁嘉草，思降甘雨；景風升上，沾洽時澍，生我禾稼。",
 "56-1":"寄生无根，如過浮雲；立本不固，斯須落去，更為枯樹。",
 "56-2":"人无定法，綬降牛出，虵雄走趨；陽不制陰，宜其家國。",
 "56-3":"眾鳥所聚，中有大怪，九身無頭；魂驚魄去，不可以居。",
 "56-4":"封豕溝瀆，灌潰國邑；火宿口中，民多疾病。",
 "56-5":"奮翅鼓翼，翱翔外國；逍遙徙倚，來歸溫室。",
 "56-6":"秋蚕不成，冬種不生；殷王逆理，棄其寵榮。",
 "56-7":"衛侯東遊，惑於少姬；忘我考妣，久迷不來。",
 "56-8":"烏合卒會，與惡相得；鴟鴞相酬，為心所賊。",
 "56-9":"鳴雞无距，與鵲格鬭；翅折目盲，為仇所傷。",
 "56-10":"木生內蠹，上下相賊，禍亂我國。",
 "56-11":"延陵適魯，觀樂太史；車轔白顛，知秦興起；卒兼其國，一統為主。",
 "56-12":"輔相之好，无有休息；時行雲集，所在遇福。",
 "56-13":"床傾簀折，屋漏垣缺，季姬不愜。",
 "56-14":"東入海口，循流北走；一高一下，五色無主；七日六夜，死於水浦。",
 "56-15":"群虎入邑，求索肉食；大人禦守，君不失國。",
 "56-16":"四亂不安，東西為患；退身止足，无出邦域；乃得完全，賴其生福。",
 "56-17":"叔盻抱冤，祁子自邑；乘遽解患，羊舌以免；賴其福全。",
 "56-18":"延頸望酒，不入我口；深目自苦，利得无有。",
 "56-19":"仁政之德，恭恭日息；成都就邑，人受厥福。",
 "56-20":"牽頭繫尾，屈折幾死；周世无人，不知所歸。",
 "56-21":"教羊逐兔，使魚相捕；任非其人，費日无功。",
 "56-22":"生角有尾，張孽制家，排羊逐狐；張氏易公，憂禍重凶。",
 "56-23":"去安就危，墜陷井池，破我玉瑀。",
 "56-24":"茹芝餌黃，塗飲玉英；與神流通，長无憂凶。",
 "56-25":"體重飛難，未能越關。",
 "56-26":"巢成樹折，傷我彝器；伯踒叔跌，亡羊乃追。",
 "56-27":"六人俱行，各遺其囊；黃鵠失珠，无以為明。",
 "56-28":"蟠梅折枝，與母分離，絕不相知。",
 "56-29":"迎福開戶，喜隨我後；曹伯愷悌，為宋國主。",
 "56-30":"既痴且狂，兩目又盲；箕踞喑啞，名為无中。",
 "56-31":"金梁銕柱，千年牢固；完全不腐，聖人安處。",
 "56-32":"褁糗荷糧，與跖相逢；欲飛不得，為網所獲。",
 "56-33":"彭名為妖，暴龍作災；盜堯衣裳，聚跖荷兵；青禽照夜，三旦夷亡。",
 "56-34":"獨夫老婦，不能生子，鰥寡俱處。",
 "56-35":"鷦鷯竊脂，巢於小枝；搖動不安，為風所吹，心寒飄搖，常憂危殆。",
 "56-36":"素車木馬，不任負重；王子出征，憂危為咎。",
 "56-37":"土陷四維，安平不危；利以居止，保有玉女。",
 "56-38":"負牛上山，力劣行難；烈風雨雪，遮遏我前；中道復還。",
 "56-39":"金城銕郭，上下同力；政平民親，寇不敢賊。",
 "56-40":"清潔淵塞，為人所言；證訊詰問，繫於枳溫；甘棠聽斷，昭然蒙恩。",
 "56-41":"皋陶聽理，岐伯悅喜；西登華道，東歸无咎。",
 "56-42":"低頭竊視，有所畏避；行作未利，酒酸魚敗，重莫貪嗜。",
 "56-43":"十雉百雛，常與母俱；抱雞搏虎，誰肯為侶？",
 "56-44":"高阜山陵，陂陁顛崩；為國妖祥，元后以薨。",
 "56-45":"六鷁退飛，為衰敗祥；陳師合戰，左股疾傷；遂以薨崩，霸功不成。",
 "56-46":"異國殊俗，情不相得；金木為仇，百戰檀穀。",
 "56-47":"鴉噪庭中，以戒災凶；重門擊柝，備憂暴客。",
 "56-48":"慈母赤子，享賜得士，獲夷服除；以安王家，側陋逢時。",
 "56-49":"剗迹惡人，使德不通；炎旱為災，年穀大傷。",
 "56-50":"躬履孔德，以待束帶；文君燎獵，呂尚獲福；號稱太師，封建齊國。",
 "56-51":"征將止惡，鼓鞞除賊；慶仲奔莒，子般獲福。",
 "56-52":"良夫淑女，配合相保；多孫眾子，懽樂長久。",
 "56-53":"蜲蛇四壯，恩念父母；王事靡盬，不我安處。",
 "56-54":"水壞我里，東流為海；鳧龜讙囂，不得安居。",
 "56-55":"束帛戔戔，賻我孟宣；徵召送君，變號易字。",
 "56-56":"羅網四張，鳥无所翔；征伐困極，飢窮不食。",
 "56-57":"乾行大德，覆贍六合；嘔喣成熟，使我福德。",
 "56-58":"秦晉大國，更相克賊；獲惠質圉，鄭被其咎。",
 "56-59":"晦昧昏明，君无紀綱；甲子成亂，簡公喪亡。",
 "56-60":"三足无頭，弗知所之；心狂精傷，莫使為明，不見月光。",
 "56-61":"長夜短日，陰為陽賊；萬物空枯，藏在北陸。",
 "56-62":"依宵夜遊，與大君俱；除解煩惑，使我无憂。",
 "56-63":"逐鹿南山，利入我門；陰陽和調，國无災殘；長子出遊，須其仁君。",
 "56-64":"請冀左耳，嗇不我驅，與我父母。",
 "57-1":"采唐沬卿，要期桑中；失信不會，憂思約帶。",
 "57-2":"有鳥飛來，集于宮樹；鳴聲可畏，主將出去。",
 "57-3":"仁政之德，參參日息；成都就邑，入受厥福。",
 "57-4":"他山之儲，與璆為仇；來攻吾城，傷我肌膚，邦家搔憂。",
 "57-5":"賫貝贖狸，不聽我辭；繫於虎鬚，牽不得來。",
 "57-6":"一簧兩舌，妄言諂語；三奸惑虛，曾母投杼。",
 "57-7":"薄行搔尾，逐雲除水；污泥為陸，下田宜稷。",
 "57-8":"天門九重，深內難通；明坐至暮，不見神公。",
 "57-9":"闇目不明，耳閼聽聰；陷入深淵，滅頂憂凶。",
 "57-10":"霧露早霜，日暗不明；陰陽孽疾，年穀大傷。",
 "57-11":"三諧土廊，德義明堂；交讓往來，享燕相承；箕伯朝王，錫我玄黃。",
 "57-12":"爭雞失羊，利得不長；陳蔡之患，賴楚以安。",
 "57-13":"天旱水涸，枯槁無澤，未有所獲。",
 "57-14":"陶朱白圭，善賈息貲；公子王孫，富利不貧。",
 "57-15":"龜厭江海，陸行不止；自令枯槁，失其都市，憂悔為咎。",
 "57-16":"黃鳥採蓄，既稼不荅；念吾父兄，思復邦國。",
 "57-17":"田鼠野雛，意常欲逃；拘制籠檻，不得動搖。",
 "57-18":"平國不君，夏氏作亂；烏號竊發，靈公殞命。",
 "57-19":"巨虵大鰌，戰於國郊；上下閉塞，君道走逃。",
 "57-20":"讒言亂國，覆是為非；伯奇流離，恭子憂哀。",
 "57-21":"鬱怏不明，為陰所傷；眾霧集聚，共奪日光。",
 "57-22":"望城抱子，見邑不殆；公孫上堂，大君歡喜。",
 "57-23":"三虫作蠱，剗迹無與；勝母盜泉，君子弗處。",
 "57-24":"車馳人趨，卷甲相求；齊魯寇戎，敗於大丘。",
 "57-25":"欲訪子車，善相欺紿；桓叔相迎，不見所期。",
 "57-26":"爭雞失羊，亡其金囊，利得不長；陳蔡之患，賴楚以安。",
 "57-27":"歲暮華落，陽入陰室；萬物伏藏，匿不可得。",
 "57-28":"晨風文翮，大舉就溫；過我成邑，羿無所得。",
 "57-29":"時鵠抱子，見蛇何咎；室家俱在，不失其所。",
 "57-30":"隱隱大雷，霶霈為雨；有女癡狂，驚駭鄰里。",
 "57-31":"無足斷跟，居處不安，凶惡為患。",
 "57-32":"破筐敝筥，棄捐於道，不復為寶。",
 "57-33":"三雞啄粟，十雛從食；飢鳶卒擊，亡其兩叔。",
 "57-34":"乘車七百，以明文德；踐土葵丘，齊晉受福。",
 "57-35":"百足俱行，相輔為強；三聖翼事，王室寵光。",
 "57-36":"典策法書，藏閣蘭臺；雖遭潰亂，獨不逢災。",
 "57-37":"四誅不服，恃強負力；倍道趨敵，師徒敗覆。",
 "57-38":"春陽生草，夏長條肄；萬物蕃滋，充實益有。",
 "57-39":"磝磝禿白，不生黍稷；無以供祭，祗靈乏杞。",
 "57-40":"褰衣涉河，水深漬罷；賴幸舟子，濟脫無他。",
 "57-41":"宜行賈市，所求必倍；戴喜抱子，與利為友。",
 "57-42":"兄征東夷，弟伐遼西；大克勝還，封君河間。",
 "57-43":"初雖驚惶，後乃無傷，受其福慶。",
 "57-44":"隨風乘龍，與利相逢；田獲三倍，商旅有功；憧憧之邑，長安無他。",
 "57-45":"魚擾水濁，寇圍吾邑；城危不安，驚恐狂惑。",
 "57-46":"雖窮復通，履危不凶，保其明公。",
 "57-47":"坤厚地德，庶物蕃息；平康正直，以綏大福。",
 "57-48":"山木暴怒，壞梁折柱；稽難行旅，留連愁苦。",
 "57-49":"使燕築室，身不庇宿；家無聊賴，殱我衣服。",
 "57-50":"矢石所射，襄公㾐劇；吳子巢門，傷病不治。",
 "57-51":"日月運行，一寒一暑；榮寵赫赫，不可得保。顛隕墜墮，更為士伍。",
 "57-52":"宮門愁鳴，臣圍其君，不得東西。",
 "57-53":"戴盆望天，不見星辰；顧小失大，福逃墻外。",
 "57-54":"天之所明，禍不遇家；反自相逐，終得和鳴。",
 "57-55":"天陰霖雨，塗行泥潦；商人休止，市無所有。",
 "57-56":"嘉門福喜，增累盛熾；日就有德，宜民宜國。",
 "57-57":"溫山松栢，常茂不落；鸞鳳以庇，得其懽樂。",
 "57-58":"南山之陽，華葉將將；嘉樂君子，為國寵光。",
 "57-59":"畫龍頭頸，文章未成；甘言美語，說辭無名。",
 "57-60":"嬰兒孩子，未有所識；彼童而角，亂我政事。",
 "57-61":"陰作大奸，欲君勿言；鴻鵠利口，發患禍端；荊季懷憂，張伯被患。",
 "57-62":"德之流行，利之四鄉；雨師洒道，風伯逐殃；巡狩封禪，以告成功。",
 "57-63":"禹將為君，裝入崑崙；稍進陽光，登見溫湯，功德昭明。",
 "57-64":"五岳四瀆，含潤為德；行不失理，民賴恩福。",
 "58-1":"踐履危難，脫危去患；入福喜門，見悔大君。",
 "58-2":"子鉏執麟，春秋作元；陰聖將終，尼父悲心。",
 "58-3":"夾河為婚，期至無船；搖心失望，不見所歡。",
 "58-4":"天孫帝子，與日月處；光榮於世，福祿繁祉。",
 "58-5":"三年人妻，相隨奔馳；終日不食，精氣勞疲。",
 "58-6":"禹召諸神，會稽南山；執玉萬國，天下康寧。",
 "58-7":"早霜晚雪，傷害禾麥；損功棄力，飢無所食。",
 "58-8":"嵩融持戟，杜伯荷弩；降觀下國，誅逐無道；夏商之季，失埶外走。",
 "58-9":"生有聖德，上配大極；皇靈建中，受我以福。",
 "58-10":"下田陸黍，萬華生齒；大雨霖集，波病漬腐。",
 "58-11":"子畏於匡，困厄陳蔡；明德不危，竟克免害。",
 "58-12":"有兩赤頭，從五岳來；謠言無祐，趍爾之林。俯伏聽命，不敢動搖。",
 "58-13":"當得自知，不逢凶災；衰者復興，終無禍來。",
 "58-14":"朽根刖樹，華葉落去；卒逢大焱，隨風僵仆。",
 "58-15":"葛生衍蔓，絺綌為願；家道篤厚，父兄悅喜。",
 "58-16":"東行求玉，反得弊石；名曰無直，字曰醜惡，眾所賤薄。",
 "58-17":"瞻白因弦，駑孱恐怯；任力墮劣，如蝟見鵲；偃視恐伏，不敢拒格。",
 "58-18":"瘡痍多病，宋公危殆；吳子巢門，無命失所。",
 "58-19":"東山西岳，會合俱食；百喜送從，以成恩福。",
 "58-20":"舞非其處，失節多悔，不合我意。",
 "58-21":"南循汝水，茂樹斬枝；過時不遇，惄如周飢。",
 "58-22":"公孫駕驪，載遊東齊；延陵說產，遺我紵衣。",
 "58-23":"乘輿八百，以明文德；踐土葵丘，齊晉受福。",
 "58-24":"雄處弱水，雌在海邊；別離將食，哀悲於心。",
 "58-25":"結網得解，受福安坐，終無患禍。",
 "58-26":"秋南春北，隨時休息；處和履中，安無憂凶。",
 "58-27":"啟戶開門，巡狩釋冤；夏臺羑里，湯文悅喜。",
 "58-28":"符左契右，相與合齒；乾坤利貞，乳生六子；長大成就，風言如母。",
 "58-29":"飢蚕作室，絲多亂緒，端不可得。",
 "58-30":"東壁飾光，數暗不明；主母嫉妒，亂我業事。",
 "58-31":"白茅縮酒，靈巫拜禱；神嗜飲食，使君壽考。",
 "58-32":"范公陶夷，巧賈貨資；東之營丘，易字子皮；抱珠載金，多得利歸。",
 "58-33":"三羖五䍧，相隨俱行；迷入空澤，循谷宜北；經涉六駁。為所傷賊。",
 "58-34":"雄鵠延頸，欲飛入關；雨師洒道，瀸我袍裘；車重難前，侍者稽止。",
 "58-35":"中年蒙慶，今歲受福；必有所得，榮寵受祿。",
 "58-36":"祿如周公，建國洛東，父子俱封。",
 "58-37":"安床厚褥，不得久宿；棄我嘉讌，困於東國；投杼之憂，不成災福。",
 "58-38":"蓄積有餘，糞土不居。",
 "58-39":"心願所喜，乃今逢時；得我利福，不離兵革。",
 "58-40":"目不可合，憂來搔足；怵惕危懼，去其邦族。",
 "58-41":"福德之士，懽悅日喜；夷吾相桓，三歸為臣，賞流子孫。",
 "58-42":"夏姬附耳，心聽悅喜，利以傳取。",
 "58-43":"叔迎兄弟，遇恭在陽；君子季姬，並坐鼓簧。",
 "58-44":"徙巢去家，南遇白烏；東西受福，與喜相得。",
 "58-45":"舜登大禹，石夷之野；徵詣玉闕，拜治水土。",
 "58-46":"江河淮海，天之都市；商人受福，國家富有。",
 "58-47":"隱隱填填，火燒山根；不潤我鄰，獨不蒙恩。",
 "58-48":"闇昧不明，耳聾不聰；陷入深淵，滅頂憂凶。",
 "58-49":"鳥鳴喈喈，天火將下；燔我館舍，災及妃后。",
 "58-50":"十雉百雛，常與母俱；抱雞搏虎，誰敢難者。",
 "58-51":"營城洛邑，周公所作；世建三十，年歷七百；福祐盟執，堅固不落。",
 "58-52":"三人俱行，別離將食；一身五心，反復迷惑。",
 "58-53":"三虎搏狼，力不相當；如鷹格雉，一發破亡。",
 "58-54":"養虎畜狼，還自賊傷；年歲息長，疾君拜禱，雖危不凶。",
 "58-55":"後時失利，不得所欲。",
 "58-56":"雉兔之東，以理為傷；見鷹驚走，死於谷口。",
 "58-57":"秋蛇向穴，不失其節；夫人姜氏，自齊復入。",
 "58-58":"班馬還師，以息勞疲；後夫嘉喜，入戶見妻。",
 "58-59":"鳥鳴巢端，一呼三顛；搖動東西，危魂不安。",
 "58-60":"命夭不遂，死多鬼祟；妻子啼瘖，早失其雄。",
 "58-61":"茆屋結席，祟我文德；三辰旂旗，家受行福。",
 "58-62":"羅網四張，鳥無所翔；征伐困極，飢窮不食。",
 "58-63":"天成地安，積石為山；潤洽萬里，人賴其歡。",
 "58-64":"銅人銕柱，暴露勞苦；終日卒歲，無有休止。",
 "59-1":"焱風阻越，車馳揭揭；棄古追思，失其和節，心憂惙惙。",
 "59-2":"蛇得澤草，不憂危殆。",
 "59-3":"兩犬爭鬭，股瘡無處；不成仇讎，行解邪去。",
 "59-4":"因禍受福，喜盈其室，求事皆得。",
 "59-5":"江多寶珠，海多大魚；疾行亟至，可以得財。",
 "59-6":"二年生狗，以戌為母；荊夷上侵，姬伯出走。",
 "59-7":"安息康居，異國穹廬；非吾習俗，使我心憂。",
 "59-8":"行觸天罡，馬死車傷；身無聊賴，困窮乏糧。",
 "59-9":"裸裎逐狐，為人觀笑；牝雞司晨，主作亂門。",
 "59-10":"為季求婦，家在東海；水長無船，不見所觀。",
 "59-11":"男女合室，二姓同食；婚姻孔云，宜我多孫。",
 "59-12":"太微帝室，黃帝所直；藩屏周衛，不可得入。常安常存，終無禍患。",
 "59-13":"齎金觀市，欲買騮子；猾偷竊發，盜我黃寶。",
 "59-14":"三人俱行，欲歸故鄉；望邑入門，拜見家懽。",
 "59-15":"娶於姜呂，駕迎新婦；少齊在門，夫子悅喜。",
 "59-16":"伯仲旅行，南求大䍧；長孟病足，倩季負囊；柳下之貞，不失驪黃。",
 "59-17":"潔身白齒，衰老復起；多孫眾子，宜利姑舅。",
 "59-18":"獨宿憎夜，嫫母畏晝；平王逐建，荊子憂懼。",
 "59-19":"追亡逐北，呼還幼叔；至止而得，復歸其室。",
 "59-20":"鳥飛無翼，兔走折足；雖欲會同，未見毉功。",
 "59-21":"抱空握虛，鳴教我賈，利去不來。",
 "59-22":"山作天池，陸地為海。",
 "59-23":"為虎所囓，太山之陽；眾多從者，莫敢救藏。",
 "59-24":"逶迤四牡，思歸念母；王事靡盬，不得安處。",
 "59-25":"獮猴所言，語無成全；誤我白鳥，使乾口來。",
 "59-26":"飛不遠去，卑斯內侍，祿養未富。",
 "59-27":"大尾細腰，重不可搖；陰權制國，平子逐昭。",
 "59-28":"旦生夕死，名曰嬰鬼，不可得視。",
 "59-29":"子畏於匡，困於陳蔡；明德不危，竟免厄害。",
 "59-30":"畏昏潛處，候時朗昭；卒逢白日，為世榮主。",
 "59-31":"白鳥御餌，鳴呼其子；施翼張翅，來從其母。",
 "59-32":"宮商角徵，五音和起；君臣父子，弟順有序；唐虞襲德，國無災咎。",
 "59-33":"季姬踟躕，望孟城隅；終日至暮，不見齊侯。",
 "59-34":"鬼哭於社，悲傷無後；甲子昧爽，殷人絕祀。",
 "59-35":"天子所予，福祿常在，不憂危殆。",
 "59-36":"比目附翼，相恃為福；姜氏季女，與君合德。",
 "59-37":"翕翕䡘䡘，稍崩墜顛，滅其令名。",
 "59-38":"折若蔽目，不見稚叔；三足孤烏，遠去家室。",
 "59-39":"羊腸九縈，相推稍前；止須王孫，乃能上天。",
 "59-40":"坤厚地德，庶物蕃息；平康正直，以綏大福。",
 "59-41":"有莘外野，不逢堯主；復居窮處，心勞志苦。",
 "59-42":"胸長景行，來觀桑柘；上伯日喜，都叔允藏。",
 "59-43":"周師伐紂，勝于牧野；甲子平旦，天下大喜。",
 "59-44":"踰江求橘，并得大栗；烹羊食炙，飲食歌笑。",
 "59-45":"敝笱在梁，魴逸不禁；漁父勞苦，筐筥乾口。空虛無有。",
 "59-46":"生有陰孽，制家非陽，遂送還床；張氏易公，憂禍重凶。",
 "59-47":"絕域異路，多有怪惡；使我驚懼，思我故處。",
 "59-48":"迷行失道，不得牛馬；百賈逃亡，市空無有。",
 "59-49":"雌鸑生雛，祥異興起；束雲龍騰，民戴為父。",
 "59-50":"壘壘纍纍，如岐之室；畜一息十，古公始邑。",
 "59-51":"瘡瘍疥搔，孝婦不省；君多疣贅，四牡作去。",
 "59-52":"羊頭兔足，羸瘦少肉；漏囊敗粟，利無所得。",
 "59-53":"薛篾從靡，空無誰是；言季子明，樂減少解。",
 "59-54":"妹為貌熟，敗君正色；作事不成，自為心賊。",
 "59-55":"四馬共轅，東上太山；騂驪同力，無有重難。與君笑言。",
 "59-56":"陰變為陽，女化作男；治道得通，君臣相承。",
 "59-57":"南國少子，材略美好；求我長女，賤薄不與；反得醜惡，後乃天悔。",
 "59-58":"昭公失常，季女悖狂；遜齊處野，喪其寵光。",
 "59-59":"望幸不到，文章未就；王子逐兔，犬踦不得。",
 "59-60":"文山紫芝，雍梁朱草長生和氣，長生和氣，王以為寶；公尸宥食，福祿來處。",
 "59-61":"牽羊不前，與心戾旋；聞言不信，誤紿大人。",
 "59-62":"東山西山，各自止安；心雖相望，竟未同堂。",
 "59-63":"鹿求其子，虎廬之里；唐伯季耳，貧不我許。",
 "59-64":"三虎上山，更相喧喚；志心不親，如仇與怨。",
 "60-1":"虎呴怒咆，慎戒外憂；上下俱搔，士民無聊。",
 "60-2":"探巢得雛，仇鵲俱來，使我心憂。",
 "60-3":"日望一食，常恐不足，祿命寡薄。",
 "60-4":"良馬疾走，千里一宿；逃難它鄉，誰能追復。",
 "60-5":"鵲巢烏城，上下不親；內外乖畔，子走矢頑。",
 "60-6":"雲龍集會，征討西戎；招邊定眾，誰敢當鋒。",
 "60-7":"春多膏澤，夏潤優渥；稼穡成熟，畝獲百斛。",
 "60-8":"童妾獨宿，長女未室，利無所得。",
 "60-9":"四亂不安，東西為患；退止我足，無出邦域；乃得全完，賴其生福。",
 "60-10":"長寧履福，安我百國；嘉賓上堂，與季同床。",
 "60-11":"騏驎綠耳，章明造父；伯夙成季，共成霸功，為晉元輔。",
 "60-12":"張陳嘉謀，贊成漢都；主歡民喜，其樂休休。",
 "60-13":"大面長頸，未解君憂。",
 "60-14":"畏昏不行，待旦昭明；燎獵受福，老賴其慶。",
 "60-15":"伯去我東，首髮如蓬；長夜不寐，憂繫心胸。",
 "60-16":"朽條腐索，不堪施用；安靜候時，以待親知。",
 "60-17":"比目四翼，相倚為福；姜氏季氏，與君合德。",
 "60-18":"履堦升墀，高登崔嵬；福祿洋溢，依天之威。",
 "60-19":"奢淫愛嗇，神所不福；靈祗憑怒，鬼障其室。",
 "60-20":"大步小車，南到喜家；送我豹裘，與福載來。",
 "60-21":"東行西步，失次後舍；與彼作期，不覺至夜；乾侯野井，昭君失居。",
 "60-22":"喜樂抃躍，來迎名家；鵲巢百兩，獲利養福。",
 "60-23":"非理後來，誰肯相與；往來不獲，徒勞道路。",
 "60-24":"北虜匈奴，數侵邊境。",
 "60-25":"征不以禮，辭乃無名；縱獲臣子，伯功不成。",
 "60-26":"景星明堂，麟遊鳳翔；仁施大行，頌聲作興。",
 "60-27":"文明之世，銷鋒鑄耜；以道順民，百王不易。",
 "60-28":"鳥飛無羽，雞鬭折距；徒自長嗟，誰肯為侶。",
 "60-29":"群隊虎狼，齧彼牛羊；道路不通，妨農害商。",
 "60-30":"商伯沉醉，庶兄奔走；淫女蕩夫，仁德並孤。",
 "60-31":"三狸搏鼠，遮遏前後；當此之時，不能脫走。",
 "60-32":"陶叔孔圉，不處亂國；初雖未萌，後受福慶。",
 "60-33":"奮翅鼓翼，翺翔外國；逍遙北域，不入溫室。",
 "60-34":"德音孔博，升在王室；八極蒙祐，受其福祿。",
 "60-35":"當變立權，擿解患難；霍然冰釋，大國以安。",
 "60-36":"羽動角甘，雨續草木，茂年歲熟。",
 "60-37":"天所祐助，福來禍去，君王何憂。",
 "60-38":"方啄宣口，聖智仁厚；釋解倒懸，唐國大安。",
 "60-39":"葛藟蒙棘，華不得實；讒佞亂政，使恩壅塞。",
 "60-40":"皇母多恩，字養孝孫；脫於襁褓，成就為君。",
 "60-41":"積冰不溫，北陸苦寒；露宿多風，君子傷心。",
 "60-42":"伯夷叔齊，貞廉之師；以德防患，憂禍不存。",
 "60-43":"一雌二雄，子不知公；亂我族類，使吾心憤。",
 "60-44":"主安多福，天祿所伏；居之寵昌，君子有光。",
 "60-45":"千歲槐根，身多斧瘢；樹維枯屈，枝葉不出。",
 "60-46":"周師伐紂，勝殷牧野；甲子平旦，天下大喜。",
 "60-47":"日走月步，趍不同舍；夫妻反目，主君失位。",
 "60-48":"宣髮龍叔，為王主國；安土成稷，天下蒙福。",
 "60-49":"諷德誦功，周美盛隆；惠旦輔成，光濟沖人。",
 "60-50":"三夜不寢，憂來益甚；戒以危懼，棄其安居。",
 "60-51":"恩願所之，乃今逢時；洗濯故憂，拜其懽來。",
 "60-52":"噂噂囁囁，夜行晝伏；謀議我資，來竊吾室。",
 "60-53":"騂牛亡子，鳴於大野；申復陰徵，還歸其母；說以除悔。",
 "60-54":"王良善御，伯樂知馬；周旋步趨，行中規矩；止息有節，延命壽考。",
 "60-55":"釋然遠咎，避患害早；田獲三狐，以貝為寶。",
 "60-56":"仁獸所處，國無凶咎；市賈十倍，復歸惠里。",
 "60-57":"六目俱視，各欲有志；心意不同，乖戾生訟。",
 "60-58":"傅說王良，驂御四龍；周徑萬里，無有危凶。",
 "60-59":"伯仲季叔，日暮寢寐；醉醒失明，喪其貝囊，臥拜道旁。",
 "60-60":"海為水王，聰聖且明；百流歸德，無有叛逆，常饒優足。",
 "60-61":"江有寶珠，海多大魚；亟行疾至，可以得財。",
 "60-62":"遠視千里，不見所持；離婁之明，無益於耳。",
 "60-63":"弱足刖跟，不利出門；市賈無嬴，折亡為患。",
 "60-64":"利盡得媒，時不我來；鳴雌深渉，寡宿獨居。",
 "61-1":"黃虹之野，賢君所在；管仲為相，國无災咎。",
 "61-2":"符左契右，梁叔有若；相與合齒，乾坤利貞；乳生六子，長大成就，拋吾如母。",
 "61-3":"蝗齧我稻，驅不可去；實穗无有，但見空藁。",
 "61-4":"嬰孩求乳，母歸其子，黃麑悅喜。",
 "61-5":"折若蔽目，不見稚叔；失旅亡民，遠去家室。",
 "61-6":"䍧羊肥首，君子不飽；年飢孔荒，士民危殆。",
 "61-7":"靈龜陸處，盤桓失所；伊子退耕，桀亂无輔。",
 "61-8":"威約拘囚，為人所誣；皋陶平理，幾得脫免。",
 "61-9":"烏升鵲舉，照臨東海；厖降庭堅，為陶叔後；封於英六，福履綏厚。",
 "61-10":"四目相視，稍近同軌；日昳之後，見吾伯姊。",
 "61-11":"大步上車，南到喜家；送我狐裘，與福載來。",
 "61-12":"卒都和合，未敢面見；媒妁无良，使我不香。",
 "61-13":"鴻飛循陸，公出不復，伯氏客宿。",
 "61-14":"代戍失期，患生无聊；懼以發難，為我開基，邦國憂愁。",
 "61-15":"齊魯爭言，戰於龍門；搆怨結禍，三世不安。",
 "61-16":"周政養賤，背生人足；陸行不安，國危為患。",
 "61-17":"蜩螗歡翹，草木嘉茂；百果蕃生，日益多有。",
 "61-18":"薄災暴虐，風吹雲卻；欲上不得，復歸其宅。",
 "61-19":"乘騮駕驪，遊至東齊；遭遇行旅，逆我以資，厚得利歸。",
 "61-20":"鳳生七子，同巢共乳，歡悅相保。",
 "61-21":"桃雀竊脂，巢於小枝；搖動不安，為風所吹；心寒漂搖，常憂殆危。",
 "61-22":"東山西山，各自止安；雖相登望，竟未同堂。",
 "61-23":"匍伏走出，驚懼皇恐；白虎生孫，蓐收在後。",
 "61-24":"重弋射隼，不知所定；質疑蓍龜，明神祭報；告以肥牡，宜利止居。",
 "61-25":"開門內福，喜至我側；嘉門善祥，為吾室宅；宮城洛邑，以招文德。",
 "61-26":"烏飛狐鳴，國亂不寧；下強上弱，為陰所刑。",
 "61-27":"三雞啄粟，八雛從食；飢鳶卒擊，失亡兩叔。",
 "61-28":"歎息不悅，憂從中出；喪我金嬰，无妄失位。",
 "61-29":"剛柔相呼，三姓為家；霜降既同，惠我以仁。",
 "61-30":"送我季女，至於蕩道；齊子旦夕，留連久處。",
 "61-31":"低頭竊視，有所遇避；行作不利，酒酸魚餒，眾莫貪嗜。",
 "61-32":"典策法書，藏閣蘭臺；雖遭亂潰，獨不遇災。",
 "61-33":"旦醉病酒，暮多瘳愈，不反為咎。",
 "61-34":"畫龍頭頸，文章未成；甘言美語，說辭無名。",
 "61-35":"日月運行，一寒一暑；榮寵赫赫，不可得保；顛躓殞墜，更為士伍。",
 "61-36":"爭利王市，朝多君子；蘇氏六國，獲其榮寵。",
 "61-37":"六蛇奔走，俱入茂草；驚於長塗，畏懼啄口。",
 "61-38":"懸貆素餐，食非其任；失轝剝廬，休坐徙居。",
 "61-39":"歡欣九子，俱見大喜；攜提福善，王孫是富。",
 "61-40":"伯夷叔齊，貞廉之師；以德防患，憂禍不存。",
 "61-41":"雄聖伏名，人匿麟驚；走鳳飛北，亂潰未息。",
 "61-42":"久鰥无偶，思配織女；求其非望，自令寡處。",
 "61-43":"破亡之國，天所不福，難以止息。",
 "61-44":"老慵多郤，弊政為賊；阿房驪山，子嬰失國。",
 "61-45":"三羖六䍧，相隨俱行；迷入空澤，遙涉虎廬；為所傷賊，死於牙腹。",
 "61-46":"囁囁處懼，昧冥相摶。多言少實，語无成事。",
 "61-47":"武陽漸離，擊筑善歌；慕丹之義，為燕助軻；陰謀不遂，霍自死亡，功名賈施。",
 "61-48":"尹氏伯奇，父子分離；无罪被辜，長舌為災。",
 "61-49":"五精亂行，政逆皇恩；湯武赫怒，共伐我域。",
 "61-50":"西歷玉山，東入玉門；登上福堂，飲萬歲漿。",
 "61-51":"行觸夫忌，與司命牾；執囚束縛，拘制於吏，幽人有喜。",
 "61-52":"機父不賢，朝多讒臣；君失其政，保家久貧。",
 "61-53":"三人俱行，北求大䍧；長孟病足，請季負囊；柳下之貞，不失我糧。",
 "61-54":"鵲思其雄，欲隨鳳東；順理羽翼，出次須日；中留北邑，復歸其室。",
 "61-55":"常得自如，不逢禍災。",
 "61-56":"白鵠遊望，君子以寧；履德不愆，福祿來成。",
 "61-57":"膚敏之德，發憤晨食；虜豹擒說，為王得福。",
 "61-58":"百足俱行，相輔為強；三聖翼事，國富民康。",
 "61-59":"生不逢時，困且多憂；年衰老極，中心悲愁。",
 "61-60":"出門蹉跌，看道後旅；買羊逸亡，取物逃走；空手握拳，坐恨相咎。",
 "61-61":"烏鳥譆譆，天火將下；燔我屋室，災及妃后。",
 "61-62":"牧羊稻田，聞虎喧讙；畏懼惕息，終无禍患。",
 "61-63":"龍潛鳳北，其子變服，陰孽萌作。",
 "61-64":"國无比鄰，相與爭強；紛紛匈匈，天下擾憂。",
 "62-1":"積德累仁，靈祐順信，福祉日增。",
 "62-2":"謹慎重言，不幸遭患；周邵述職，脫免牢開。",
 "62-3":"鳥飛鼓翼，喜樂堯德；虞夏美功，要荒賓服。",
 "62-4":"牙孽生齒，室堂啟戶；幽人利貞，鼓翼起舞。",
 "62-5":"使伯東求，拒不肯行；與叔爭訟，更相毀傷。",
 "62-6":"手足易處，頭尾顛倒；公為雌嫗，亂其蚕織。",
 "62-7":"匠卿操斧，豫章危殆；袍衣脫剝，祿命訖已。",
 "62-8":"天女踞床，不成文章；南箕无舌，飯多砂糠；虛象盜名，雌雄折頸。",
 "62-9":"大椎破轂，長舌亂國；墻茨之言，三世不安。",
 "62-10":"衘命辱使，不堪厥事；中墜落去，更為負載。",
 "62-11":"三虵共室，同類相得；甘露時降，生我百穀。",
 "62-12":"衣繡夜遊，與君相逢；除患解惑，使我不憂。",
 "62-13":"被髮獸心，難與為鄰；來如風雲，去如絕絃，為狼所殘。",
 "62-14":"剛柔相呼，二姓為家；霜降既同，惠我以仁。",
 "62-15":"牛耳聾聵，不曉齊味；委以鼎俎，治亂憒憒。",
 "62-16":"低頭竊視，有所畏避；行作不利，酒酢魚餒，眾莫貪嗜。",
 "62-17":"雨師娶婦，黃巖季子；成禮既婚，相呼南上；膏我下土，年歲大有。",
 "62-18":"戴盆望天，不見星辰；顧小失大，遁逃墻外。",
 "62-19":"二人輦車，徙去其家；井沸釜鳴，不可以居。",
 "62-20":"攘臂反肘，怒不可二；佷戾腹心，无以為市。",
 "62-21":"湯世之憂，轉解喜來。",
 "62-22":"忠信輔成，王政不傾；公劉肇舉，文武綏之。",
 "62-23":"登高斬木，頓躓陷險；車傾馬疲，伯叔吁嗟。",
 "62-24":"桑方隕落，黃敗其葉；失勢傾側，如无所立。",
 "62-25":"鸞鳳翱翔，集于喜國；念我伯姊，與母相得。",
 "62-26":"陰淫所居，盈溢過度，傷害禾稼。",
 "62-27":"霄冥高山，道險峻難；王孫罷極，困於阪間。",
 "62-28":"和璧隋珠，為火所燒；冥昧失明，奪精无光，棄於道傍。",
 "62-29":"虞君好神，惠我老親；恭承宗廟，雖慍不去，復我內事。",
 "62-30":"爪牙之夫，怨毒祈父；轉憂與己，傷不及母。",
 "62-31":"倉盈庾億，宜稼黍稷，年歲有息。",
 "62-32":"窗牖戶房，通利光明；賢智輔聖，仁德大行；家給人足，海內殷昌。",
 "62-33":"切切之患，凶重憂荐，為虎所吞。",
 "62-34":"水无魚池，陸為海涯；君子失居，小人相攜。",
 "62-35":"九疑鬱林，沮濕不中；鸞鳳所惡，君子攸去。",
 "62-36":"六翮況飛，走歸不及；脫歸王室，亡其騂特。",
 "62-37":"不直莊公，與我爭訟；媒伯无禮，自令塞壅。",
 "62-38":"倉庾多億，宋公危殆；吳子巢門，殞命失所。",
 "62-39":"失羊捕牛，无損无憂。",
 "62-40":"夏麥麩䵃，霜擊其芒；疾君敗國，使我誅傷。",
 "62-41":"昧昧暗暗，不知白黑；風雨亂擾，光明伏匿，幽王失國。",
 "62-42":"執斧破薪，使媒求婦；和合二姓，親迎斯須；色比毛嬙，姑翁悅喜。",
 "62-43":"六疾生狂，癡走妄行；北入患門，與禍為鄰。",
 "62-44":"驅羊就群，佷不肯前；慶季愎諫，子之被患。",
 "62-45":"二人異路，東趍西步；十里之外，不相知處。",
 "62-46":"義不勝情，以欲自營；覩利危躬，折角摧頸。",
 "62-47":"騷騷擾擾，不安其類；疾在頸項，凶危為憂。",
 "62-48":"三河俱合，水怒湧躍；壞我王屋，民困於食。",
 "62-49":"陽曜旱疾，傷病稼穡，農人无食。",
 "62-50":"流浮出食，載劵入屋；釋鞍繫馬，西南廡下。",
 "62-51":"門戶之居，可以止舍；進仕不殆，安樂相保。",
 "62-52":"過時不歸，雌雄苦悲；徘徊外國，與母分離。",
 "62-53":"中田有廬，彊塲有瓜；獻進皇祖，曾孫壽考。",
 "62-54":"失恃无友，嘉福出走，傫如喪狗。",
 "62-55":"反鼻岐頭，三寡獨居。",
 "62-56":"衣裳顛倒，為王來呼；成就東周，封受大福。",
 "62-57":"飛不遠去，還歸故處，興事多悔。",
 "62-58":"含血走禽，不曉五音；匏巴鼓瑟，不悅於心。",
 "62-59":"求玉獲石，非心所欲，祝願不得。",
 "62-60":"山崩谷絕，大福盡歇；涇渭失紀，玉石既已。",
 "62-61":"雜目懼怒，不安其居；散渙府藏，无有利得。",
 "62-62":"初雖驚惶，後反无傷，受其福慶。",
 "62-63":"眾邪充側，鳳凰折翼；微子復北，去其邦國。",
 "62-64":"六月采芑，征伐无道；張仲方叔，剋敵飲酒。",
 "63-1":"游駒石門，騄耳安全；受福西鄰，歸邑玉泉。",
 "63-2":"陽春生草，萬物盛興；君子所居，災禍不到。",
 "63-3":"人无足法，緩除才出；雄走羊驚，不失其家。",
 "63-4":"太山止奔，變見太微；陳吳廢忽，作為禍患。",
 "63-5":"乘龍吐光，使暗後明；燎獵大得，六師以昌。",
 "63-6":"羊頭兔足，羸瘦少肉；漏囊貯粟，利无所得。",
 "63-7":"因禍受福，喜盈其室；螟虫不作，君无可得。",
 "63-8":"舜升大禹，石夷之野；徵詣王闕，拜治水土。",
 "63-9":"烏子鵲雛，常與母俱；顧類群族，不離其巢。",
 "63-10":"夷羿所射，發輒有獲；矰加鵲鷹，雙鳥俱得。",
 "63-11":"晨風文翰，大舉就溫；昧過我邑，羿无所得。",
 "63-12":"六喜三福，南至歡國；與喜忻樂，珪我潔德。",
 "63-13":"鬭龍股折，日遂不明；自外為主，弟伐其兄。",
 "63-14":"蒙慶受福，有所獲得，不利出門。",
 "63-15":"蠻戎夷狄，太陰所積；涸冰沍寒，君子不存。",
 "63-16":"畏昏潛處，候時昭明；卒遭白日，為榮祿主。",
 "63-17":"水流趍下，欲至東海；求我所有，買魴與鯉。",
 "63-18":"冠帶南遊，與福喜期；徼於嘉國，拜為逢時。",
 "63-19":"莎雞振羽，為季門戶；新沐彈冠，仲公悅喜。",
 "63-20":"結衿流粥，遭讒桎梏；周召述職，身受大福。",
 "63-21":"田鼠野雞，意常欲逃；拘制籠檻，不得動搖。",
 "63-22":"居華巔，觀浮雲；風不搖，雨不濡；心平安，无咎憂。",
 "63-23":"傾倚將顛，不能得存；英雄作業，家困无年。",
 "63-24":"心願所喜，今乃逢時；保我利福，不離兵革。",
 "63-25":"靈龜陸處，盤桓失所；阿衡退耕，夏封於國。",
 "63-26":"弱水之右，有西王母；生不知老，與天相保，不利行旅。",
 "63-27":"抱瓌求金，日暮坐吟；終月卒歲，竟无成功。",
 "63-28":"言笑未畢，憂來暴卒；身加搤檻，囚繫縛束。",
 "63-29":"望幸不到，文章未成；王子逐兔，犬踦不得。",
 "63-30":"震慄恐懼，多所畏惡；行道留難，不可以步。",
 "63-31":"雄狐綏綏，登山崔嵬；昭告顯功，大福允興。",
 "63-32":"火起吾後，喜炙倉廡；龍衘水深，潠注屋柱，雖憂无咎。",
 "63-33":"危坐至暮，請求不得；膏澤不降，政戾民忒。",
 "63-34":"孟春和氣，鷹隼搏鷙；眾雀憂憒。",
 "63-35":"緩法長奸，不肯理冤；浮沉失節，君受其患。",
 "63-36":"魚鱉貪餌，死於網釣；受危國寵，為身殃咎。",
 "63-37":"金精輝怒，帶劍過午；徘徊高庫，宿於山谷；兩虎相拒，弓矢滿野。",
 "63-38":"四目相望，稍近同光，並坐鼓簧。",
 "63-39":"茹芝餌黃，飲酒玉英；與神流通，長无憂凶。",
 "63-40":"求璋嘉鄉，惡虵不行；道出岐口，還復其床。",
 "63-41":"天門地戶，幽冥不覩，不知所在。",
 "63-42":"跌足息肩，有所忌難；金城鐵郭，以銅為關；藩屏自衛，安止无患。",
 "63-43":"三雁俱飛，欲歸稻池；先涉雚澤，為矢所射，傷我胸臆。",
 "63-44":"濟流難渡，濡我衣袴；五子善櫂，脫无他故。",
 "63-45":"飲酒醉酗，跳起爭鬭；伯傷叔僵，東家治喪。",
 "63-46":"跌躓未起，後失利市；蒙被咎殃。",
 "63-47":"辰次降婁，建星中堅，子无遠行；外顛霄陷，遂命訖終。",
 "63-48":"商風召寇，來呼外盜；間諜內應，與我爭鬭；殫已寶藏，主人不勝。",
 "63-49":"甘露醴泉，太平機關；仁德感應，歲樂民安。",
 "63-50":"祭仲子突，要門逐忽；禍起子商，弟伐其兄，鄭久不昌。",
 "63-51":"反孽難步，留不反舍；露宿澤陂，亡其襦袴。",
 "63-52":"狼虎結謀，相聚為保；伺候牛羊，病我商人。",
 "63-53":"明德克敏，重華貢舉；放勳徵用，八哲蒙佑。",
 "63-54":"貧鬼守門，日破我盆；毀罌傷瓶，空虛无子。",
 "63-55":"天命赤烏，與兵徼期；征伐无道，箕子遊遨。",
 "63-56":"威約拘囚，為人所誣；皋陶平理，剖械出牢，脫歸家閭。",
 "63-57":"羊驚虎狼，聳耳群聚；无益威彊，為齒所傷。",
 "63-58":"初雖號啼，後必慶笑；光明照耀，百喜如意。",
 "63-59":"馬服長股，宜行善市；蒙祐諧耦，獲金五倍。",
 "63-60":"應門內崩，誅賢殺暴；上下咸悖，景公失位；長歸無恆，望妻不來。",
 "63-61":"執斧破薪，使媒求婦；好合二姓，親御斯須；色比毛嬙，姑悅公喜。",
 "63-62":"兩輪日轉，南上大阪；四馬共轅，无有險難，與禹笑言。",
 "63-63":"玄兔指掌，與足相恃；謹訊詰問，誣情自直；冤死誰告，口為身禍。",
 "63-64":"千柱百梁，終不傾僵，周宗寧康。",
 "64-1":"旦生夕死，名曰嬰鬼，不可得視。",
 "64-2":"大步上車，南到喜家；送我狐裘，與福喜來。",
 "64-3":"西多小星，三五在東；早夜晨行，勞苦无功。",
 "64-4":"北陸藏冰，君子心悲；困於粒食，鬼驚我門。",
 "64-5":"山水暴怒，壞折梁柱；稽難行旅，留連愁苦。",
 "64-6":"比目四翼，來安吾國；福喜上堂，與我同床。",
 "64-7":"狡兔趯趯，良犬逐咋；雄雌爰爰，為鷹所獲。",
 "64-8":"增祿益福，喜來入室，解除憂惑。",
 "64-9":"騎龍乘風，上見神公；彭祖受刺，王喬贊通；巫咸就位，拜福无窮。",
 "64-10":"天火卒起，燒我旁里；延及吾家，空盡己財。",
 "64-11":"金帛共寶，宜與我市；嫁娶有息，利得過倍。",
 "64-12":"鬼魅之居，凶不可舍。",
 "64-13":"鳥飛兔走，各有畏惡；鵰鷹為賊，亂我室舍。",
 "64-14":"初雖驚惶，後乃无傷，受其福慶。",
 "64-15":"兩金相擊，勇氣均敵；日月鬭戰，不破不缺。",
 "64-16":"曳綸河海，掛釣魴鯉；王孫利德，以享仲友。",
 "64-17":"犬畏狼虎，依人有輔；三夫執戟，伏不敢起，身安无咎。",
 "64-18":"蜘蛛作網，以伺行旅；青蠅嚵聚，以求膏腴；觸我羅絆，為網所得。",
 "64-19":"所望在外，鼎金方來；拭爵滌罍，炊食待之，不為季憂。",
 "64-20":"日月並居，常暗匪明；高山崩顛，丘陵為谿。",
 "64-21":"春服既成，載華復生；莖葉盛茂，實穗泥泥。",
 "64-22":"華首山頭，仙道所由；利以居止，長无咎憂。",
 "64-23":"三狐群哭，自悲孤獨；野无所遊，死於丘室。",
 "64-24":"火中暑退，禾黍其食；商人不至，市空无有。",
 "64-25":"獨立山顛，求鹿耕田；草木不闢，秋飢无年。",
 "64-26":"火雖熾，在吾後；寇雖近，在吾右；身安吉，不危殆。",
 "64-27":"𪙨𪙨𪘙𪘙，貧鬼相責；无有懽怡，一日九結。",
 "64-28":"追亡逐北，呼還幼叔；至山而得，反歸其室。",
 "64-29":"衘命辱使，不堪厥事；遂墮落去，更為斯吏。",
 "64-30":"被珠衘玉，沐浴仁德；應聘唐國，四門穆穆；蟊賊不作，凶惡伏匿。",
 "64-31":"機關不便，不能出言；精成通道，為人所冤。",
 "64-32":"甕破盆缺，南行亡失。",
 "64-33":"唇亡齒寒，積日凌根；朽不可用，為身災患。",
 "64-34":"蒙惑憧憧，不知西東；魁罡指南，告我室中；利以宜止，去國憂患。",
 "64-35":"鳥鴟搏翼，以避陰賊；盜伺二女，賴厥生福；旱災為疾，君无黍稷。",
 "64-36":"名成德就，項領不試；景公耄老，尼父逝去。",
 "64-37":"言與心詭，西行東坐；鯀湮洪水，佞賊為禍。",
 "64-38":"獫狁匪度，治兵焦穫；伐鎬及方，與周爭彊；元戎其駕，衰及夷王。",
 "64-39":"三火起明，雨滅其光；高位疾顛，驕恣誅傷。",
 "64-40":"承川決水，為吾之祟，使我心憒；毋樹麻枲，居止凶咎。",
 "64-41":"厭浥晨夜，道多湛露；沾我襦袴，重難以步。",
 "64-42":"宜行賈市，所求必倍；載喜抱子，與利為友。",
 "64-43":"陰變為陽，女化為男；治道得通，君臣相承。",
 "64-44":"樹蔽牡荊，生蘙山旁；仇敵背憎，孰肯相迎？",
 "64-45":"坐茵乘軒，據德宰臣；虞叔受命，六合和親。",
 "64-46":"雲興蔽日，雨集草木，年茂歲熟。",
 "64-47":"蟠梅折枝，與母別離，絕不相知。",
 "64-48":"天旱水涸，枯槁无澤；困於沙石，未有所獲。",
 "64-49":"圭璧琮璜，執禮見王；百里甯戚，應聘齊秦。",
 "64-50":"龍渴求飲，黑雲景從；河伯捧醴，跪進酒漿，流潦滂滂。",
 "64-51":"雹梅零蔕，心思憒憒，亂我靈氣。",
 "64-52":"鹿求其子，虎廬之里；唐伯季耳，貪不我許。",
 "64-53":"穿匏挹水，篝銕燃火；勞疲力竭，飢渴為禍。",
 "64-54":"龍生馬淵，壽考且神；飛騰上天，舍宿軒轅，常居樂安。",
 "64-55":"崔嵬北岳，天神貴客；溫仁正直，主布恩德；衣冠不已，蒙受大福。",
 "64-56":"鬼夜哭泣，齊失其國，為下所賊。",
 "64-57":"二政多門，君失其權；三家專制，禍起季孫。",
 "64-58":"望幸不到，文章未就；王子逐兔，犬踦不得。",
 "64-59":"伯虎仲熊，德義昭明；使布五教，陰陽順序。",
 "64-60":"兩足四翼，飛入家國；寧我伯叔，與母相得。",
 "64-61":"春秋禱祀，解禍除憂，君无災咎。",
 "64-62":"牧羊稻園，聞虎喧讙；懼畏悚息，終无禍患。",
 "64-63":"大蛇巨魚，相搏於郊；君臣隔塞，郭公出廬。",
 "64-64":"忠慢未習，單酒糗脯；數至神前，欲求所顧，反得大患。",
};

</script>
<script>
// ========= 卦象運算核心 =========

// 依 lower/upper trigram key 取得六爻陣列(由下而上, index0=初爻...index5=上爻)
function getLines(gua){
  return TRIGRAMS[gua.lower].bits.concat(TRIGRAMS[gua.upper].bits);
}

// 由六爻陣列(由下而上)反查對應卦
function findGuaByLines(lines){
  const lowerBits = lines.slice(0,3).join('');
  const upperBits = lines.slice(3,6).join('');
  return GUA_LIST.find(g=>{
    return TRIGRAMS[g.lower].bits.join('')===lowerBits && TRIGRAMS[g.upper].bits.join('')===upperBits;
  });
}

function findGuaByName(name){
  return GUA_LIST.find(g=>g.name===name);
}

// 綜卦: 全卦上下顛倒(六爻次序反轉)
function getZongGua(gua){
  const lines = getLines(gua).slice().reverse();
  return findGuaByLines(lines);
}

// 錯卦: 每一爻陰陽互換
function getCuoGua(gua){
  const lines = getLines(gua).map(b=> b===1?0:1);
  return findGuaByLines(lines);
}

// 五個互卦, 依需求提供之公式(索引為1~6, 對應初二三四五上爻, 這裡用0-based)
const HU_GUA_FORMULAS = [
  { label:"互卦(2345爻)", lowerIdx:[1,2,3], upperIdx:[2,3,4] }, // 234下 345上
  { label:"互卦(1234爻)", lowerIdx:[0,1,2], upperIdx:[1,2,3] }, // 123下 234上
  { label:"互卦(12345爻)", lowerIdx:[0,1,2], upperIdx:[2,3,4] }, // 123下 345上
  { label:"互卦(3456爻)", lowerIdx:[2,3,4], upperIdx:[3,4,5] }, // 345下 456上
  { label:"互卦(23456爻)", lowerIdx:[1,2,3], upperIdx:[3,4,5] }  // 234下 456上
];

function getHuGuaList(gua){
  const lines = getLines(gua);
  return HU_GUA_FORMULAS.map(f=>{
    const lowerBits = f.lowerIdx.map(i=>lines[i]);
    const upperBits = f.upperIdx.map(i=>lines[i]);
    const found = findGuaByLines(lowerBits.concat(upperBits));
    return { label:f.label, gua:found };
  });
}

// ========= 農曆 / 十二消息卦 =========
function getXiaoXiInfo(date){
  try{
    const solar = Solar.fromYmd(date.getFullYear(), date.getMonth()+1, date.getDate());
    const lunar = solar.getLunar();
    const lunarMonth = Math.abs(lunar.getMonth());
    const isLeap = lunar.getMonth() < 0;
    const info = XIAOXI_GUA[lunarMonth];
    return {
      lunarYear: lunar.getYearInChinese(),
      lunarMonth: (isLeap?'閏':'') + lunar.getMonthInChinese() + '月',
      lunarDay: lunar.getDayInChinese(),
      ganzhiYear: lunar.getYearInGanZhi(),
      xiaoxiName: info ? info.name : '',
      xiaoxiMonthLabel: info ? info.month : ''
    };
  }catch(e){
    console.error(e);
    return null;
  }
}

// ========= 卦象圖繪製(SVG) =========
function renderGuaSvg(gua, opts){
  opts = opts || {};
  const width = opts.width || 120;
  const lineH = opts.lineH || 14;
  const gap = opts.gap || 14;
  const totalH = lineH*6 + gap*5;
  const svgH = totalH + 8;
  const lines = getLines(gua).slice().reverse(); // 由上而下畫(上爻在上)
  let y = 4;
  let rects = '';
  lines.forEach(bit=>{
    if(bit===1){
      rects += `<rect x="4" y="${y}" width="${width-8}" height="${lineH}" rx="${lineH/2}" class="yao-yang"></rect>`;
    } else {
      const segW = (width-8-14)/2;
      rects += `<rect x="4" y="${y}" width="${segW}" height="${lineH}" rx="${lineH/2}" class="yao-yin"></rect>`;
      rects += `<rect x="${4+segW+14}" y="${y}" width="${segW}" height="${lineH}" rx="${lineH/2}" class="yao-yin"></rect>`;
    }
    y += lineH+gap;
  });
  return `<svg viewBox="0 0 ${width} ${svgH}" width="${width}" height="${svgH}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
}

function safeScrollTo(id){
  const el = document.getElementById(id);
  if(el && typeof el.scrollIntoView === 'function'){
    el.scrollIntoView({behavior:'smooth', block:'start'});
  }
}

// ========= 爻位標籤 =========
function yaoLabel(posIndex, bit){
  // posIndex 0~5, bit 1=陽(九) 0=陰(六)
  const posNames = ['一','二','三','四','五','六'];
  const num = bit===1?'九':'六';
  if(posIndex===0) return '初'+num;
  if(posIndex===5) return '上'+num;
  return num+posNames[posIndex];
}

// ========= App State & Rendering =========
const state = {
  mainName: '乾為天',
  changeName: '坤為地',
  viewing: 'main', // 'main' | 'change'
  currentName: '乾為天' // 目前顯示中的卦(可能因點擊卡片而變)
};

function populateSelects(){
  const opts = GUA_LIST.map(g=>`<option value="${g.name}">${g.id}. ${SHORT_NAMES[g.id-1]}</option>`).join('');
  document.getElementById('mainGuaSelect').innerHTML = opts;
  document.getElementById('changeGuaSelect').innerHTML = opts;
  document.getElementById('mainGuaSelect').value = state.mainName;
  document.getElementById('changeGuaSelect').value = state.changeName;
}

function renderRelatedCard(container, label, gua){
  const div = document.createElement('div');
  div.className = 'rel-card';
  div.innerHTML = `
    <div class="rel-label">${label}</div>
    <div class="rel-svg">${renderGuaSvg(gua, {width: 74, lineH: 5, gap: 6})}</div>
    <div class="rel-name">${gua.name}</div>
  `;
  div.addEventListener('click', ()=>{
    state.currentName = gua.name;
    renderDetail();
    safeScrollTo('detailPanel');
  });
  container.appendChild(div);
}

function renderDetail(){
  const gua = findGuaByName(state.currentName);
  if(!gua) return;
  const lines = getLines(gua);

  document.getElementById('guaTitleId').textContent = '第 ' + gua.id + ' 卦';
  document.getElementById('guaTitleId2').textContent = gua.id;
  document.getElementById('guaTitleName').textContent = gua.name;
  const soulTag = document.getElementById('guaSoulTag');
  if(gua.soul){
    soulTag.textContent = gua.soul + '卦';
    soulTag.style.display = '';
  } else {
    soulTag.style.display = 'none';
  }
  document.getElementById('guaUpperLower').textContent =
    `上${TRIGRAMS[gua.upper].name}(${TRIGRAMS[gua.upper].nature})　下${TRIGRAMS[gua.lower].name}(${TRIGRAMS[gua.lower].nature})`;
  document.getElementById('guaMainSvg').innerHTML = renderGuaSvg(gua, {width:150, lineH:7, gap:11});

  document.getElementById('guaci').textContent = gua.guaci;
  document.getElementById('tuan').textContent = gua.tuan;
  document.getElementById('daxiang').textContent = gua.daxiang;

  // 繫辭傳(僅部分卦有收錄相關摘引, 無資料時整段隱藏)
  const xiciSection = document.getElementById('xiciSection');
  const xiciDivider = document.getElementById('xiciDivider');
  if(gua.xici){
    document.getElementById('xici').textContent = gua.xici;
    xiciSection.style.display = '';
    xiciDivider.style.display = '';
  } else {
    xiciSection.style.display = 'none';
    xiciDivider.style.display = 'none';
  }

  // 繫辭傳之憂患九卦(僅履謙復恆損益困井巽九卦有收錄, 無資料時整段隱藏)
  const youhuanSection = document.getElementById('youhuanSection');
  const youhuanDivider = document.getElementById('youhuanDivider');
  if(gua.youhuan){
    document.getElementById('youhuan').textContent = gua.youhuan;
    youhuanSection.style.display = '';
    youhuanDivider.style.display = '';
  } else {
    youhuanSection.style.display = 'none';
    youhuanDivider.style.display = 'none';
  }

  // 序卦傳(僅部分卦有收錄相關摘引, 無資料時整段隱藏)
  const xiguaSection = document.getElementById('xuguaSection');
  const xiguaDivider = document.getElementById('xuguaDivider');
  if(gua.xugua){
    document.getElementById('xugua').textContent = gua.xugua;
    xiguaSection.style.display = '';
    xiguaDivider.style.display = '';
  } else {
    xiguaSection.style.display = 'none';
    xiguaDivider.style.display = 'none';
  }

  // 說卦傳(僅部分卦有收錄相關摘引, 無資料時整段隱藏)
  const shuoguaSection = document.getElementById('shuoguaSection');
  const shuoguaDivider = document.getElementById('shuoguaDivider');
  if(gua.shuogua){
    document.getElementById('shuogua').textContent = gua.shuogua;
    shuoguaSection.style.display = '';
    shuoguaDivider.style.display = '';
  } else {
    shuoguaSection.style.display = 'none';
    shuoguaDivider.style.display = 'none';
  }

  // 雜卦傳(僅部分卦有收錄, 無資料時整段隱藏)
  const zaguaSection = document.getElementById('zaguaSection');
  const zaguaDivider = document.getElementById('zaguaDivider');
  if(gua.zagua){
    document.getElementById('zagua').textContent = gua.zagua;
    zaguaSection.style.display = '';
    zaguaDivider.style.display = '';
  } else {
    zaguaSection.style.display = 'none';
    zaguaDivider.style.display = 'none';
  }

  const yaoContainer = document.getElementById('yaoList');
  yaoContainer.innerHTML = '';

  // 用九／用六(僅乾坤兩卦有此特殊爻辭, 顯示於最上方)
  if(gua.yong){
    const yongRow = document.createElement('div');
    yongRow.className = 'yao-row yao-row-yong';
    yongRow.innerHTML = `
      <div class="yao-row-mark"></div>
      <div class="yao-row-label">${gua.yong.label}</div>
      <div class="yao-row-text">
        <div class="yao-ci">${gua.yong.ci}</div>
        <div class="yao-xiang">〈象〉${gua.yong.xiang}</div>
      </div>
    `;
    yaoContainer.appendChild(yongRow);
  }

  for(let idx=5; idx>=0; idx--){
    const y = gua.yao[idx];
    const bit = lines[idx];
    const label = yaoLabel(idx, bit);
    const markHtml = bit===1
      ? `<span class="mini-yang"></span>`
      : `<span class="mini-yin"><span></span><span></span></span>`;
    const row = document.createElement('div');
    row.className = 'yao-row';
    row.innerHTML = `
      <div class="yao-row-mark">${markHtml}</div>
      <div class="yao-row-label">${label}</div>
      <div class="yao-row-text">
        <div class="yao-ci">${y.ci}</div>
        <div class="yao-xiang">〈象〉${y.xiang}</div>
      </div>
    `;
    yaoContainer.appendChild(row);
  }

  // 綜卦 / 錯卦 / 互卦
  const relContainer = document.getElementById('relatedCards');
  relContainer.innerHTML = '';

  const zong = getZongGua(gua);
  const cuo = getCuoGua(gua);
  if(zong) renderRelatedCard(relContainer, '綜卦', zong);
  if(cuo) renderRelatedCard(relContainer, '錯卦', cuo);

  const huList = getHuGuaList(gua);
  huList.forEach(h=>{
    if(h.gua) renderRelatedCard(relContainer, h.label, h.gua);
  });

  // 更新頁籤狀態(主卦/變卦)
  document.getElementById('tabMain').classList.toggle('active', state.currentName===state.mainName);
  document.getElementById('tabChange').classList.toggle('active', state.currentName===state.changeName);
}

function onDateChange(){
  const val = document.getElementById('dateInput').value;
  if(!val) return;
  const d = new Date(val + 'T00:00:00');
  const info = getXiaoXiInfo(d);
  const box = document.getElementById('lunarInfoBox');
  if(!info){
    box.innerHTML = '<span class="lunar-err">換算失敗,請確認日期</span>';
    return;
  }
  box.innerHTML = `
    <div class="lunar-line">農曆　${info.ganzhiYear}年（${info.lunarYear}）　${info.lunarMonth}　${info.lunarDay}</div>
    <div class="lunar-line xiaoxi-line">對應消息卦：<b>${info.xiaoxiMonthLabel}　${info.xiaoxiName}</b>
      <button class="mini-btn" id="setXiaoxiAsMain">設為主卦</button>
    </div>
  `;
  document.getElementById('setXiaoxiAsMain').addEventListener('click', ()=>{
    if(!info.xiaoxiName) return;
    state.mainName = info.xiaoxiName;
    document.getElementById('mainGuaSelect').value = state.mainName;
    state.currentName = state.mainName;
    state.viewing = 'main';
    renderDetail();
    safeScrollTo('detailPanel');
  });
}

function showShareToast(msg){
  const toast = document.getElementById('shareToast');
  toast.textContent = msg;
  toast.style.display = '';
  clearTimeout(showShareToast._t);
  showShareToast._t = setTimeout(()=>{ toast.style.display = 'none'; }, 2400);
}

async function handleShare(){
  const url = window.location.href;
  const title = '卦象乾坤・易經解卦';
  const text = '一起來看看易經卦象吧！';

  if(navigator.share){
    try{
      await navigator.share({ title, text, url });
      return;
    }catch(err){
      // 使用者取消分享或不支援, 往下走備援方案
      if(err && err.name === 'AbortError') return;
    }
  }

  // 備援：直接開啟 LINE 分享連結
  const lineUrl = 'https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
  const win = window.open(lineUrl, '_blank');

  // 同時嘗試複製連結到剪貼簿, 方便使用者貼到其他地方
  if(navigator.clipboard && navigator.clipboard.writeText){
    try{
      await navigator.clipboard.writeText(url);
      showShareToast(win ? '已開啟 LINE 分享，連結也複製好了' : '已複製連結，貼給朋友吧！');
    }catch(err){
      if(!win) showShareToast('請手動複製網址列連結分享');
    }
  } else if(!win){
    showShareToast('請手動複製網址列連結分享');
  }
}

function renderYaolin(){
  const card = document.getElementById('yaolinCard');
  const mainGua = findGuaByName(state.mainName);
  const changeGua = findGuaByName(state.changeName);
  if(!mainGua || !changeGua){
    card.style.display = 'none';
    return;
  }
  card.style.display = '';
  document.getElementById('yaolinTitle').textContent = SHORT_NAMES[mainGua.id-1] + '之' + SHORT_NAMES[changeGua.id-1];
  const key = mainGua.id + '-' + changeGua.id;
  const text = YAOLIN[key];
  const contentEl = document.getElementById('yaolinContent');
  const missingEl = document.getElementById('yaolinMissing');
  if(text){
    contentEl.textContent = text;
    contentEl.style.display = '';
    missingEl.style.display = 'none';
  } else {
    contentEl.style.display = 'none';
    missingEl.style.display = '';
  }
}

function init(){
  document.getElementById('shareBtn').addEventListener('click', handleShare);

  populateSelects();

  document.getElementById('mainGuaSelect').addEventListener('change', (e)=>{
    state.mainName = e.target.value;
    state.currentName = state.mainName;
    state.viewing = 'main';
    renderDetail();
    renderYaolin();
  });
  document.getElementById('changeGuaSelect').addEventListener('change', (e)=>{
    state.changeName = e.target.value;
    state.currentName = state.changeName;
    state.viewing = 'change';
    renderDetail();
    renderYaolin();
  });
  document.getElementById('tabMain').addEventListener('click', ()=>{
    state.currentName = state.mainName;
    state.viewing = 'main';
    renderDetail();
  });
  document.getElementById('tabChange').addEventListener('click', ()=>{
    state.currentName = state.changeName;
    state.viewing = 'change';
    renderDetail();
  });

  const dateInput = document.getElementById('dateInput');
  const today = new Date();
  dateInput.value = today.toISOString().slice(0,10);
  dateInput.addEventListener('change', onDateChange);
  onDateChange();

  renderDetail();
  renderYaolin();
}

document.addEventListener('DOMContentLoaded', init);

</script>
